<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Клёвая рыбалка</title>
<!--SDK-->
<style>
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(nunito-cyrillic-600-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:600;font-display:swap;src:url(nunito-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+25CF}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(nunito-cyrillic-800-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(nunito-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+25CF}
@font-face{font-family:Nunito;font-weight:900;font-display:swap;src:url(nunito-cyrillic-900-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:900;font-display:swap;src:url(nunito-latin-900-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD,U+25CF}
@font-face{font-family:Pangolin;font-weight:400;font-display:swap;src:url(pangolin-cyrillic-400-normal.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Pangolin;font-weight:400;font-display:swap;src:url(pangolin-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#1f3b4a;--muted:#5f7584;--panel:#fffaf0;--card:#fff;--line:#e8dec8;--accent:#f08a2a;--accentD:#c9671a;--green:#46a54a;--greenD:#2f7d33;--blue:#3a8fc8;--blueD:#2a6a9a;--gold:#f6c94a;--red:#e5483a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#7fb2cf;font-family:Nunito,'Trebuchet MS',Arial,sans-serif;font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.ic{width:1em;height:1em;display:block;flex:none}
.hidden{display:none!important}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
#ui .top-l{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;display:flex;align-items:center;gap:8px}
.panel,.lvl,.coins,.env,.sb,.bb,.gearb,.hint,.fight{background:rgba(255,250,240,.94);border:2px solid rgba(160,130,80,.25);box-shadow:0 3px 0 rgba(90,70,40,.18),0 6px 16px rgba(20,40,60,.18)}
.lvl{position:relative;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lvl svg{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);transform:rotate(-90deg)}
.lvl circle{fill:none;stroke-width:5}
.lvl .ring-bg{stroke:#eadfc6}
.lvl .ring{stroke:var(--green);stroke-linecap:round;transition:stroke-dasharray .4s}
.lvl b{font-size:22px;font-weight:900}
.coins{display:flex;align-items:center;gap:7px;height:46px;padding:0 16px 0 9px;border-radius:24px;font-size:22px;font-weight:900}
.coins .ic{font-size:30px}
.env{position:absolute;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);border-radius:18px;padding:6px 16px;display:flex;flex-direction:column;align-items:center;gap:1px;max-width:min(560px,calc(100vw - 360px));white-space:nowrap}
.env .e1{display:flex;align-items:center;gap:6px;font-size:18px}
.env .e1 .ic{font-size:24px}
.env .e1 b{margin-right:8px}
.env .e2{font-size:14px;color:var(--muted);font-weight:800;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.env .e2 b{color:var(--ink)}
.dots{font-style:normal;color:var(--accent);letter-spacing:1px}
.dots u{text-decoration:none;color:#ddd2bb}
.dots.big{font-size:26px}
.gearb{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.side{position:absolute;top:calc(72px + env(safe-area-inset-top));right:12px;display:flex;flex-direction:column;gap:9px}
.sb{position:relative;width:76px;height:70px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--ink)}
.sb .ic{font-size:32px;color:var(--blueD)}
.sb .dot{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:50%;background:var(--red);border:2px solid #fff;display:none}
.sb.has .dot{display:block}
.h-gift{animation:wob 1.6s ease-in-out infinite;background:#fff1c9}
.h-gift .ic{color:var(--accent)}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(7deg)}30%{transform:rotate(0)}}
.buffs{position:absolute;top:calc(76px + env(safe-area-inset-top));left:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none!important}
.buff{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 7px;border-radius:16px;background:rgba(232,248,226,.95);font-size:15px;color:var(--greenD);box-shadow:0 3px 10px rgba(20,40,60,.15)}
.buff .ic{font-size:22px}
.bottom{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:10px;pointer-events:none!important}
.bottom>*{pointer-events:auto}
.bb{position:relative;width:86px;height:86px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;flex:none}
.bb .ic{font-size:38px;color:var(--blueD)}
.bb b{font-size:18px;font-weight:900;line-height:1.05}
.bb>span{font-size:12px;color:var(--muted)}
.bb .bait-ic .ic{font-size:40px}
.bb.full{background:#ffe2d6;animation:wob 1.6s ease-in-out infinite}
.bb .smk{position:absolute;top:-8px;right:-8px;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.bb .smk .ic{font-size:20px;color:#fff}
.pulse{animation:pls .6s ease-out 2}
@keyframes pls{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.act{flex:1;display:flex;justify-content:center;align-items:flex-end;min-width:0;pointer-events:none!important}
.act>*{pointer-events:auto}
.hint{display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:22px;font-size:19px;max-width:100%}
.hint .ic{font-size:34px;animation:tap 1.4s ease-in-out infinite}
.hint span{display:flex;flex-direction:column}
.hint small{font-size:14px;color:var(--muted)}
.hint.soft{background:rgba(255,250,240,.75)}
.hint.warn{background:#ffe2d6;color:#a8381c}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.actbtn{pointer-events:auto;touch-action:none}
.actbtn.bite{min-width:250px;height:86px;border-radius:26px;background:linear-gradient(#ff9d3a,#ec6f1c);color:#fff;font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:1px;box-shadow:0 6px 0 #b4501a,0 10px 30px rgba(240,120,40,.6);animation:bitep .45s ease-in-out infinite alternate;text-shadow:0 2px 0 rgba(120,40,0,.35)}
@keyframes bitep{from{transform:scale(1)}to{transform:scale(1.07)}}
.fight{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 14px 12px;border-radius:24px;width:min(460px,100%)}
.fmsg{font-size:19px}
.fmsg.hot{color:var(--red);animation:bitep .3s ease-in-out infinite alternate}
.bars{display:flex;gap:12px;width:100%}
.bar{flex:1;display:flex;flex-direction:column;gap:3px}
.bar small{font-size:13px;color:var(--muted)}
.bar i{display:block;height:16px;border-radius:9px;background:#eadfc6;overflow:hidden}
.bar u{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:background .2s}
.bar.p u{background:var(--blue)}
.actbtn.pull{width:100%;height:72px;border-radius:20px;background:linear-gradient(#5cc160,#3a9a3e);color:#fff;font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 #2a7a2e}
.actbtn.pull .ic{font-size:40px}
.actbtn.pull.down{transform:translateY(4px);box-shadow:0 1px 0 #2a7a2e;background:linear-gradient(#4aac4e,#2f8a33)}
#toasts{position:fixed;top:calc(84px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none;width:min(560px,92vw)}
.toast{padding:10px 20px;border-radius:18px;background:rgba(31,59,74,.92);color:#fff;font-size:18px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast.good{background:rgba(47,125,51,.94)}
.toast.warn{background:rgba(190,70,40,.94)}
.toast.tip{background:rgba(42,106,154,.94)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.flyc{position:fixed;z-index:70;width:30px;height:30px;pointer-events:none}
.flyc .ic{width:30px;height:30px}
/* меню */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(ellipse at 50% 40%,rgba(255,250,235,.0),rgba(20,40,60,.25))}
.mn{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;transform:translateY(-6vh)}
.mn h1{margin:0;font-family:Pangolin,'Comic Sans MS',cursive;font-weight:400;line-height:.92;color:#fff;text-shadow:0 4px 0 #2a6a8a,0 8px 0 #1f4a62,0 14px 30px rgba(10,30,50,.45);display:flex;flex-direction:column}
.mn h1 span:first-child{font-size:min(92px,17vw);color:#ffe28a}
.mn h1 span:last-child{font-size:min(80px,15vw)}
.mn p{margin:0;font-size:21px;color:#fff;text-shadow:0 2px 6px rgba(0,30,50,.6)}
.mrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:16px;font-size:19px;font-weight:900;line-height:1.1;text-align:center}
.btn .ic{font-size:26px}
.btn.primary{background:linear-gradient(#ffa040,#ee7a22);color:#fff;box-shadow:0 4px 0 var(--accentD);text-shadow:0 1px 0 rgba(120,50,0,.3)}
.btn.green{background:linear-gradient(#5cc160,#3a9a3e);color:#fff;box-shadow:0 4px 0 var(--greenD)}
.btn.ad{background:linear-gradient(#55a8e0,#3584c0);color:#fff;box-shadow:0 4px 0 var(--blueD)}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--ink);box-shadow:0 3px 0 #e2d6bc}
.btn.big{min-height:72px;font-size:28px;padding:0 40px;border-radius:22px}
.btn.big .ic{font-size:32px}
.btn.sm{min-height:46px;padding:0 14px;font-size:16px;border-radius:13px;flex:none}
.btn.sm .ic{font-size:22px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.45;pointer-events:none}
.cn{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.cn .ic{font-size:1.25em}
/* окна */
#modal{position:fixed;inset:0;z-index:50;pointer-events:none}
.mwrap{position:absolute;inset:0;background:rgba(18,36,48,.5);display:flex;align-items:center;justify-content:center;padding:12px;pointer-events:auto;animation:fin .2s ease-out}
@keyframes fin{from{opacity:0}}
.mbox{position:relative;width:min(540px,100%);max-height:calc(100% - 8px);overflow-y:auto;overflow-x:hidden;background:var(--panel);border-radius:26px;padding:20px 20px 22px;box-shadow:0 14px 50px rgba(0,0,0,.35);border:3px solid #f1e5c8;display:flex;flex-direction:column;align-items:stretch;gap:12px;animation:pop .25s cubic-bezier(.3,1.4,.6,1);touch-action:pan-y}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mbox.wide{width:min(760px,100%)}
.mbox.tall{height:min(860px,100%)}
.mbox.small{width:min(480px,100%)}
.mx{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);z-index:2}
.m-title{font-family:Pangolin,'Comic Sans MS',cursive;font-weight:400;font-size:34px;text-align:center;line-height:1.1;padding:0 50px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.m-title.warn{color:#c2412a}
.m-title.gold{color:#c58a10}
.m-title .mc{font-family:Nunito,sans-serif;font-weight:900;font-size:20px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:3px 12px}
.sub{margin:0;text-align:center;color:var(--muted);font-size:16px}
.sub.warn{color:#c2412a}
.hintp{margin:0;color:var(--muted);font-size:15px;text-align:center;font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:18px;padding:30px 10px;margin:0}
.m-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.m-btns .btn{flex:1 1 200px;max-width:340px}
.m-col{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px}
.tab{flex:1 0 auto;min-height:48px;padding:0 12px;border-radius:14px;background:#f1e8d4;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--muted)}
.tab .ic{font-size:22px}
.tab.on{background:var(--blue);color:#fff}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-size:18px}
.row.sel{border-color:var(--accent);background:#fff6ea}
.row.claimed{opacity:.6}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .rt b{font-size:18px}
.row .rt b em{font-style:normal;color:var(--muted);font-size:15px}
.row .rt small{font-size:14px;color:var(--muted);font-weight:600;line-height:1.25}
.row .fi{width:84px;height:auto;flex:none}
.row .fi.smoked{filter:sepia(.8) saturate(1.4) brightness(.85)}
.bi{width:56px;height:56px;flex:none;border-radius:14px;background:#f4ecd9;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--blueD)}
.bi img{max-width:52px;max-height:44px}
.sm-ic{width:84px;display:flex;justify-content:center;font-size:36px;color:#c8bca0}
.okl{display:inline-flex;align-items:center;gap:4px;color:var(--greenD);font-size:15px;flex:none}
.okl .ic{font-size:26px}
.lockl{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;flex:none;white-space:nowrap}
.lockl .ic{font-size:20px}
.rew{color:var(--muted);font-size:16px;flex:none}
.lvls{display:flex;gap:4px}
.lvls i{width:16px;height:7px;border-radius:4px;background:#e6dcc5}
.lvls i.on{background:var(--green)}
.pb{display:block;height:10px;border-radius:6px;background:#ece2cc;overflow:hidden}
.pb u{display:block;height:100%;background:var(--green);border-radius:6px}
.stars{display:inline-flex;gap:1px}
.stars i{font-size:18px;color:#e2d8c2}
.stars i.on{color:#f2b532}
.stars.r5 i.on{color:#e8a010}
/* улов */
.fishcv{align-self:center;max-width:100%}
.c-name{font-family:Pangolin,cursive;font-size:36px;text-align:center;line-height:1}
.c-row{display:flex;align-items:center;justify-content:center;gap:10px}
.c-row .stars i{font-size:24px}
.rname{font-size:17px;color:var(--muted)}
.rname.r3{color:#2a7ab8}.rname.r4{color:#8a4ac0}.rname.r5{color:#c58a10}
.c-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c-info>div{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px}
.c-info small{font-size:13px;color:var(--muted)}
.badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:0}
.badge{padding:4px 12px;border-radius:14px;font-size:15px;color:#fff;background:var(--green)}
.badge.gold{background:linear-gradient(#f8d250,#e09a10);color:#5a3a00}
.badge.rec{background:var(--accent)}
.badge.day{background:var(--blue)}
.mbox.catch.big{background:radial-gradient(circle at 50% 30%,#fff8dc,var(--panel) 70%)}
.wish{font-size:20px;text-align:center;margin:0;line-height:1.35;font-weight:800;font-style:italic;color:#5a4a20}
.brk{display:flex;flex-direction:column;align-items:center;gap:6px}
.brk img{width:200px}
.brk p{margin:0;text-align:center;font-size:17px;color:var(--muted)}
.lv-big{align-self:center;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#f6c94a);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:#7a5200;box-shadow:0 6px 0 #c8961a,0 0 0 8px rgba(246,201,74,.25)}
.lv-sub,.lv-un{margin:0;text-align:center;font-size:19px}
.lv-un{color:var(--greenD)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg)}}
/* атлас */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow-y:auto}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.card img{width:100%;height:88px;object-fit:contain}
.card b{font-size:16px}
.card small{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.card .bt{font-size:12px;color:#8a9aa4}
.card.unk{background:#f6f1e4}
.card.r3{border-color:#a8cbe6}.card.r4{border-color:#cdb2e6}.card.r5{border-color:#f2cf6a;background:#fffaea}
/* водоёмы */
.locs{display:flex;flex-direction:column;gap:10px}
.loc{display:flex;align-items:center;gap:12px;padding:8px;border-radius:18px;background:#fff;border:2px solid var(--line)}
.loc img{width:150px;height:84px;border-radius:12px;object-fit:cover;flex:none}
.loc.locked img{filter:grayscale(.7) brightness(.9)}
.loc.cur{border-color:var(--green);background:#f0faea}
.loc .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.loc .lt b{font-size:19px}
.loc .lt small{font-size:14px;color:var(--muted);font-weight:600}
/* прогноз */
.fc{display:flex;flex-direction:column;gap:10px}
.fcr{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.fcr>.ic{font-size:44px}
.fcr div{display:flex;flex-direction:column;gap:2px}
.fcr b{font-size:19px}
.fcr small{font-size:15px;color:var(--muted);font-weight:600}
.fcr small.mut{font-size:13px}
.fcr .fi{width:70px}
/* подарки */
.gcal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gday{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:96px;justify-content:center}
.gday small{font-size:14px;color:var(--muted)}
.gday .gr{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:16px}
.gday .gr .cn .ic{font-size:26px}
.gday.big{grid-column:span 2;background:#fff5d6;border-color:#f2cf6a}
.gday.today{border-color:var(--accent);box-shadow:0 0 0 4px rgba(240,138,42,.25);animation:bitep .8s ease-in-out infinite alternate}
.gday.past{opacity:.55}
.gok{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.rewi{display:flex;gap:8px;flex-wrap:wrap;font-size:15px}
/* персонаж */
.setc{display:flex;flex-direction:column;gap:8px;align-items:center}
.chars{display:flex;gap:12px;justify-content:center}
.charb{width:150px;border-radius:18px;background:#fff;border:3px solid var(--line);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:17px}
.charb img{width:100%;border-radius:12px}
.charb.on{border-color:var(--accent);background:#fff3e2}
.chars.big .charb{width:180px;font-size:20px}
.tut{display:flex;flex-direction:column;gap:10px}
.tut>div{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.tut .ic{font-size:44px;color:var(--blueD)}
.tut p{margin:0;font-size:18px;line-height:1.3}
.tb{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}
.lb{display:flex;flex-direction:column;gap:6px}
.lbr{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px}
.lbr b{width:32px;text-align:center;color:var(--muted)}
.lbr span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbr.me{border-color:var(--accent);background:#fff3e2}
.vol-row{font-weight:800}
/* телефон вертикально */
body.port .env{top:calc(76px + env(safe-area-inset-top));max-width:calc(100vw - 24px);padding:5px 12px}
body.port .env .e1{font-size:16px}
body.port .env .e2{font-size:13px}
body.port .side{top:calc(140px + env(safe-area-inset-top));gap:7px}
body.port .sb{width:66px;height:62px;font-size:11.5px;border-radius:16px}
body.port .sb .ic{font-size:28px}
body.port .buffs{top:calc(140px + env(safe-area-inset-top))}
body.port .bb{width:72px;height:78px;border-radius:20px}
body.port .bb .ic{font-size:32px}
body.port .bottom{left:8px;right:8px;gap:6px}
body.port .actbtn.bite{min-width:0;width:100%;font-size:28px;height:80px}
body.port .fight{padding:8px 10px 10px}
body.port .actbtn.pull{height:66px;font-size:24px}
body.port .hint{font-size:16px;padding:8px 12px}
body.port .hint .ic{font-size:28px}
body.port .hint small{display:none}
body.port #toasts{top:calc(150px + env(safe-area-inset-top))}
body.port .mn{transform:translateY(-10vh)}
@media (max-height:520px){
  .sb{width:64px;height:56px;font-size:11px}.sb .ic{font-size:26px}.side{gap:6px;top:64px}
  .bb{width:72px;height:72px}.mbox{padding:14px}.m-title{font-size:28px}.actbtn.pull{height:56px}.bars small{display:none}
}
@media (max-width:420px){.gcal{grid-template-columns:repeat(3,1fr)}.loc img{width:96px;height:64px}.row .fi{width:64px}.grid{grid-template-columns:repeat(2,1fr)}.charb{width:130px}.chars.big .charb{width:140px}}
/* заставка */
#boot{position:fixed;inset:0;z-index:100;background:linear-gradient(#f6c6a8 0%,#ffe4bd 42%,#9cc7d8 42.2%,#4a86a4 100%);transition:opacity .5s;overflow:hidden;display:flex;align-items:center;justify-content:center}
#boot svg.sc{position:absolute;left:0;bottom:0;width:100%;height:100%}
#boot .bx{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;transform:translateY(-14vh)}
#boot .bt{font-family:Pangolin,'Comic Sans MS',cursive;font-size:min(64px,12vw);color:#fff;text-shadow:0 4px 0 #2a6a8a,0 8px 18px rgba(20,50,70,.4);line-height:1;text-align:center}
#boot .bar{width:min(340px,70vw);height:18px;border-radius:10px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
#boot #bootFill{display:block;height:100%;width:6%;border-radius:10px;background:linear-gradient(90deg,#ffb04a,#ee7a22);transition:width .3s}
#boot #bootPct{font-size:18px;color:#fff;text-shadow:0 1px 3px rgba(0,40,60,.6)}
#boot .float{animation:bob 1.6s ease-in-out infinite;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
#boot .rip{animation:rip 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
#boot .rip.b{animation-delay:1.2s}
@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(2.2);opacity:0}}
#boot .jump{animation:jmp 3.2s ease-in-out infinite;transform-box:view-box}
@keyframes jmp{0%,55%{transform:translate(0,40px) rotate(0);opacity:0}60%{opacity:1}75%{transform:translate(70px,-60px) rotate(30deg)}90%{transform:translate(140px,30px) rotate(70deg);opacity:1}92%,100%{opacity:0;transform:translate(140px,40px) rotate(70deg)}}
#boot .sun{animation:sunr 6s ease-out infinite alternate}
@keyframes sunr{from{transform:translateY(12px)}to{transform:translateY(-6px)}}
#boot .cl{animation:drift 14s linear infinite}
#boot .cl.b{animation-duration:20s;animation-delay:-8s}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
#boot .reed{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
#boot .reed.b{animation-delay:-1.4s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
#boot .duck{animation:swim 16s linear infinite}
@keyframes swim{from{transform:translateX(1300px)}to{transform:translateX(-300px)}}
#boot .glit{animation:gl 2s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.25}to{opacity:.8}}
</style>
</head>
