<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Голодная Воронка</title>
<style>
@font-face{font-family:"Rubik Bubbles";font-weight:400;font-display:block;src:url(bubbles-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Rubik Bubbles";font-weight:400;font-display:block;src:url(bubbles-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Rubik;font-weight:600;font-display:block;src:url(rubik600-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Rubik;font-weight:600;font-display:block;src:url(rubik600-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Rubik;font-weight:800;font-display:block;src:url(rubik800-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Rubik;font-weight:800;font-display:block;src:url(rubik800-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Городская стройка: дорожные знаки, сигнальная лента, тёмно-синий «асфальтовый» контур */
:root{--ink:#1d2240;--ink2:#2c3254;--asph:#343a58;--paper:#fffaf0;--sun:#ffc93c;--sun2:#f2a922;--red:#ff5a4e;--blue:#3aa0ff;--green:#3fc777;--violet:#8a6af0;--muted:#b8bdd8;
--logo:"Rubik Bubbles",Rubik,"Arial Rounded MT Bold",sans-serif;--body:Rubik,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#bfe6ff;font-family:var(--body);font-weight:800;color:var(--paper);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.layer{position:absolute;inset:0;pointer-events:none}
#scr button,#scr .pe{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--sun);outline-offset:3px}
svg{display:block}
/* кнопки — как дорожные таблички с толстым контуром */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;font-weight:800;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(29,34,64,.35);letter-spacing:.2px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:26px;height:26px;flex:none}
.big{min-width:170px;height:60px;padding:0 24px;border-radius:16px;font-size:24px;color:#fff;background:var(--red)}
.big::after,.mid::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:32%;border-radius:10px;background:rgba(255,255,255,.22);pointer-events:none}
.big.green{background:var(--green)}
.mid{height:48px;padding:0 16px;border-radius:14px;font-size:18px;color:#fff;background:var(--violet)}
.mid.green{background:var(--green)}.mid.blue{background:var(--blue)}.mid.violet{background:var(--violet)}
.round{width:52px;height:52px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.round svg{width:30px;height:30px}
.round.small{width:44px;height:44px}
.round.small svg{width:24px;height:24px}
.round:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip{display:flex;align-items:center;gap:6px;background:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font-size:19px;box-shadow:0 3px 0 rgba(29,34,64,.5);color:var(--paper)}
.chip svg{width:30px;height:30px}
.chip .plus{width:24px;height:24px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;margin-left:2px}
.chip .plus svg{width:18px;height:18px}
.topbar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tb-r{display:flex;gap:8px;align-items:center}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:14px;align-items:stretch;width:100%}
.muted{color:var(--muted);font-weight:600}
/* уровень игрока */
.lvl{display:flex;align-items:center;gap:6px;background:var(--ink);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 3px 0 rgba(29,34,64,.5)}
.lvl-n{width:40px;height:40px;border-radius:50%;background:var(--sun);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid var(--paper)}
.lvl-b{display:flex;flex-direction:column;gap:3px;min-width:90px}
.lvl-b small{font-size:12px;color:var(--muted);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--asph);overflow:hidden;border:2px solid var(--ink)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),#ffe27a);border-radius:4px;transition:width .2s}
.bar.big{height:14px;width:min(180px,40vw)}
/* логотип */
.logo{position:absolute;left:0;right:0;top:8%;display:flex;justify-content:center;pointer-events:none}
.logo-in{text-align:center;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.logo-t{font-family:var(--logo);font-size:clamp(40px,8vw,88px);line-height:1;color:var(--sun);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink),0 0 40px rgba(29,34,64,.3);transform:rotate(-2deg)}
.logo-sub{display:inline-block;margin-top:8px;font-size:clamp(15px,2.3vw,22px);color:var(--ink);padding:4px 16px;border:3px solid var(--ink);border-radius:10px;transform:rotate(1.5deg);background:repeating-linear-gradient(-45deg,var(--sun) 0 14px,#ffe27a 14px 28px);box-shadow:0 4px 0 var(--ink)}
/* меню */
.menu-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:70px 12px 16px}
.modes{display:grid;grid-template-columns:repeat(4,minmax(0,205px));gap:8px;pointer-events:auto}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 14px;border-radius:14px;background:rgba(29,34,64,.82);border:3px solid var(--ink);color:var(--muted);text-align:left;box-shadow:0 4px 0 var(--ink)}
.mode b{font-size:19px;color:var(--paper)}
.mode small{font-size:12.5px;font-weight:600;line-height:1.2}
.mode.on{background:var(--sun);color:var(--ink)}
.mode.on b{color:var(--ink)}
.maps{display:flex;gap:10px;flex-wrap:nowrap;max-width:100%;overflow-x:auto;overflow-y:hidden;padding:8px 6px 10px;pointer-events:auto;touch-action:pan-x;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--ink) transparent;-webkit-overflow-scrolling:touch}
.maps>.mcard{flex:none;scroll-snap-align:center}
.maps>.mcard:first-child{margin-left:auto}
.maps>.mcard:last-child{margin-right:auto}
.maps::-webkit-scrollbar{height:6px}
.maps::-webkit-scrollbar-thumb{background:rgba(29,34,64,.55);border-radius:3px}
.mcard{position:relative;width:clamp(112px,15vw,150px);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 6px 8px;border-radius:14px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:15px}
.mcard .mart{width:100%;border-radius:9px;overflow:hidden;border:2px solid var(--ink);aspect-ratio:12/7}
.mcard .mart svg{width:100%;height:100%}
.mcard.on{background:var(--sun);transform:translateY(-4px);box-shadow:0 8px 0 var(--ink)}
.mcard.locked .mart{filter:grayscale(.85) brightness(.85)}
.mlock{display:flex;align-items:center;gap:3px;font-size:12px;color:#6a6f8a}
.mlock svg{width:16px;height:16px}
.mstars{display:flex;gap:1px}
.mstars svg{width:18px;height:18px}
.mstars.sm svg{width:16px;height:16px}
.play{height:70px;min-width:260px;font-size:34px}
.play svg{width:32px;height:32px}
.side .mid svg{width:28px;height:28px}
.hint{font-size:13px;color:var(--ink);background:rgba(255,250,240,.85);border-radius:8px;padding:3px 10px;font-weight:600}
/* HUD */
.hud-time{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.htime{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 14px 4px 8px;font-size:26px;box-shadow:0 4px 0 var(--ink);min-width:118px}
.htime svg{width:28px;height:28px}
.htime.hurry{background:var(--red);color:#fff;animation:hurry .5s infinite alternate}
@keyframes hurry{to{transform:scale(1.07)}}
.feed{display:flex;flex-direction:column;align-items:center;gap:4px}
.feed div{font-size:14px;background:rgba(29,34,64,.8);padding:3px 10px;border-radius:8px;animation:fin .3s}
@keyframes fin{from{opacity:0;transform:translateY(-6px)}}
.hud-me{position:absolute;top:10px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hud-me .pts{font-size:22px;padding-right:16px}
.hud-me .pts.pulse{animation:pulse .5s}
@keyframes pulse{40%{transform:scale(1.25);background:var(--green)}}
.prog{display:flex;align-items:center;gap:6px;background:var(--ink);border-radius:10px;padding:5px 10px}
.prog small{font-size:15px}
.hud-r{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.lboard{display:flex;flex-direction:column;gap:3px;background:rgba(29,34,64,.78);border-radius:12px;padding:6px 8px;min-width:170px}
.lb-row{display:flex;align-items:center;gap:6px;font-size:14.5px;padding:2px 4px;border-radius:7px}
.lb-row.me{background:var(--sun);color:var(--ink)}
.lb-row.dead{opacity:.45}
.lb-i{width:20px;text-align:center;flex:none;display:flex;justify-content:center}
.lb-i svg{width:20px;height:20px}
.lb-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);flex:none}
.lb-n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.hlabel{position:absolute;left:0;top:0;font-size:14px;color:#fff;background:rgba(29,34,64,.72);padding:2px 9px;border-radius:8px;white-space:nowrap;will-change:transform}
.hlabel.me{background:var(--sun);color:var(--ink)}
.hlabel.hunter{background:rgba(214,58,48,.85)}
.hlabel.pro{background:rgba(110,80,220,.85);box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.pop{position:absolute;left:0;top:0;font-size:24px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;will-change:transform}
.pop.hot{color:var(--sun)}
#stick{position:absolute;left:-60px;top:-60px;width:120px;height:120px;margin:0;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);display:none;pointer-events:none}
#stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,250,240,.85);border:3px solid var(--ink)}
.death{position:absolute;left:0;right:0;bottom:16%;display:flex;justify-content:center}
.dcard{display:flex;flex-direction:column;align-items:center;gap:8px;background:rgba(29,34,64,.88);border:3px solid var(--ink);border-radius:18px;padding:14px 22px;pointer-events:auto;animation:fin .3s}
.dcard b{font-size:22px;color:var(--sun)}
.dcard .cd{font-size:16px;color:var(--paper)}
.dcard small{font-size:12px;color:var(--muted);font-weight:600}
/* итоги */
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(29,34,64,.45);pointer-events:auto;padding:10px}
.rcard{position:relative;width:min(470px,96vw);max-height:96vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:18px 18px 20px;box-shadow:0 8px 0 var(--ink);animation:mIn .3s}
.rcard::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;border-radius:18px 18px 0 0;background:repeating-linear-gradient(-45deg,var(--sun) 0 12px,var(--ink) 12px 24px)}
.rplace{position:relative;width:86px;height:86px;border-radius:50%;background:var(--asph);border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;margin-top:8px}
.rplace.gold{background:var(--sun);color:var(--ink)}
.rplace svg{position:absolute;top:-30px;width:50px;height:50px}
.rzen svg{width:70px;height:70px;margin-top:10px}
.rtitle{font-size:22px;text-align:center}
.rstars{display:flex;gap:6px;margin-top:10px}
.st.lg svg{width:58px;height:58px}
.st.pop{animation:popS .45s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes popS{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
.newbest{background:var(--red);color:#fff;padding:3px 14px;border-radius:10px;border:3px solid var(--ink);transform:rotate(-2deg);font-size:17px}
.rstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;width:100%}
.rstats div{display:flex;flex-direction:column;align-items:center;background:#f0ead8;border-radius:12px;padding:6px 4px;border:2px solid #e2d8c0}
.rstats small{font-size:12px;color:#6a6f8a;font-weight:600;text-align:center}
.rstats b{font-size:21px}
.rtable{width:100%;display:flex;flex-direction:column;gap:3px}
.rcard .lb-row,.mbody .lb-row{background:#f0ead8;color:var(--ink);font-size:16px;padding:5px 8px}
.rcard .lb-row.me,.mbody .lb-row.me{background:var(--sun)}
.rreward{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:18px}
.rlvl{background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 14px;font-size:17px}
/* окна */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(14,18,40,.55);pointer-events:auto;font-family:var(--body);font-weight:800}
.mpanel{position:relative;width:min(520px,95vw);max-height:92vh;display:flex;flex-direction:column;background:var(--ink2);border:4px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink),0 18px 50px rgba(0,0,0,.45);animation:mIn .22s ease-out;overflow:hidden;color:var(--paper)}
.mpanel::before{content:"";display:block;height:12px;background:repeating-linear-gradient(-45deg,var(--sun) 0 12px,var(--ink) 12px 24px)}
@keyframes mIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 4px 20px}
.mhead b{font-family:var(--logo);font-weight:400;font-size:28px;color:var(--sun);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.mbody{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 16px 20px;overflow-y:auto;touch-action:pan-y}
.subt{font-size:17px;color:var(--sun);align-self:flex-start}
.mybest{display:flex;align-items:center;gap:8px;font-size:19px}
.mybest svg{width:32px;height:32px}
.lbx{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%}
.skin{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--asph);border:3px solid var(--ink);border-radius:16px;padding:10px 6px}
.skin.cur{background:#4a5180;border-color:var(--sun)}
.sprev{width:84px;height:84px;border-radius:50%;background:var(--ring);display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px var(--glow),inset 0 0 0 3px var(--ink);border:3px solid var(--ink)}
.sprev i{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--wall),#000 70%);border:2px solid var(--ink)}
.skin b{font-size:15px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:4px;min-width:100px;height:38px;padding:0 10px;border-radius:11px;background:var(--blue);color:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px}
.sbtn svg{width:22px;height:22px}
.sbtn.buy{background:var(--sun);color:var(--ink)}
.sbtn.buy.poor{background:#8a8fa8;color:#e8e8f0}
.sbtn.ad{background:var(--green);font-size:13px}
.sbtn.on{background:transparent;color:var(--sun);box-shadow:none;border-color:var(--sun)}
.ups{display:flex;flex-direction:column;gap:10px;width:100%}
.upr{display:flex;align-items:center;gap:10px;background:var(--asph);border:3px solid var(--ink);border-radius:14px;padding:10px}
.upi svg{width:40px;height:40px}
.upt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.upt b{font-size:17px}
.upt small{font-size:13px;color:var(--muted);font-weight:600}
.pips{display:flex;gap:4px;margin-top:2px}
.pips i{width:20px;height:9px;border-radius:4px;background:#1d2240}
.pips i.on{background:var(--green)}
.tgl{display:flex;align-items:center;gap:10px;font-size:16px;align-self:flex-start}
.tgl input{width:24px;height:24px;accent-color:var(--sun)}
.iap-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--asph);border:3px solid var(--ink);width:100%}
.iap-ic{width:58px;height:58px;flex:none;display:flex;align-items:center;justify-content:center}
.iap-ic img,.iap-ic svg{width:58px;height:58px;object-fit:contain}
.iap-tx{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.iap-tx b{font-size:17px}
.iap-tx small{font-size:13px;color:var(--muted);line-height:1.25;font-weight:600}
.iap-buy{flex:none;display:flex;align-items:center;gap:5px;min-width:96px;height:46px;padding:0 12px;border-radius:12px;background:var(--sun);color:var(--ink);font-size:17px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.iap-buy svg{width:22px;height:22px}
.iap-buy:disabled{opacity:.55}
.iap-buy.owned{background:transparent;color:var(--muted);font-size:14px;box-shadow:none}
.iap-item.free .iap-buy{background:var(--green);color:#fff;font-size:14px}
.iap-price{display:inline-flex;align-items:center;gap:5px}
.iap-price img{width:20px;height:20px}
.iap-price i{font-style:normal;font-size:.8em}
.toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ink);color:var(--sun);padding:10px 20px;border-radius:14px;font-size:20px;z-index:80;animation:toastA 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw;border:3px solid var(--sun);font-family:var(--body);font-weight:800}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* узкие экраны */
@media (max-width:640px){
 .logo{top:9%}
 .menu-c{gap:9px;padding-bottom:12px}
 .mode{padding:6px 10px}
 .mode small{font-size:11px}
 .mcard{width:100px;font-size:11.5px;padding:4px 3px 6px;letter-spacing:-.02em}
 .maps{gap:8px;width:100vw;max-width:none;margin:0 -12px;padding-left:12px;padding-right:12px}
 .play{height:62px;min-width:220px;font-size:28px}
 .side .mid{font-size:15px;padding:0 10px;height:44px}
 .lboard{min-width:140px}
 .lb-row{font-size:12.5px}
 .lb-n{max-width:84px}
 .htime{font-size:22px;min-width:100px}
 .hud-me .pts{font-size:18px}
}
@media (max-height:520px){
 .logo{top:3%}.logo-t{font-size:38px}.logo-sub{display:none}
 .menu-c{gap:7px;padding-bottom:8px}
 .mcard{width:110px}
 .mode small{display:none}
 .play{height:54px;font-size:26px}
 .hint{display:none}
 .tut{bottom:3%}
 .tcard{padding:6px 12px 8px;gap:4px}
 .tcard b{font-size:16px}
 .tstep{display:none}
}
/* стрелка к золотой цели */
#garrow{position:absolute;left:0;top:0;width:58px;height:58px;pointer-events:none;z-index:3}
#garrow img{position:absolute;inset:0;width:100%;height:100%;animation:gpulse 1s ease-in-out infinite}
#garrow i{position:absolute;inset:-16px}
#garrow i::after{content:'';position:absolute;right:-4px;top:50%;margin-top:-13px;border:13px solid transparent;border-left:18px solid #ffc020;filter:drop-shadow(2px 0 0 #1d2240)}
@keyframes gpulse{50%{transform:scale(1.12)}}
/* значок на кнопке заданий */
.round{position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-style:normal;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);animation:hurry .6s infinite alternate}
.r2{gap:8px;flex-wrap:nowrap}
/* бонусы на HUD */
.effs{display:flex;flex-direction:column;gap:5px}
.eff{display:flex;align-items:center;gap:6px;background:rgba(29,34,64,.85);border:2px solid var(--c);border-radius:999px;padding:2px 10px 2px 2px;font-size:14px;animation:fin .3s}
.eff img{width:28px;height:28px}
.eff b{color:var(--c);min-width:16px;text-align:right}
.left{font-size:14px;background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:2px 10px}
.hlabel.danger{background:rgba(226,52,44,.92);box-shadow:0 0 0 2px #fff}
.hlabel.prey{background:rgba(40,170,90,.92)}
/* обучение */
.tut{position:absolute;left:0;right:0;bottom:7%;display:flex;justify-content:center;padding:0 12px}
.tcard{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(560px,94vw);background:rgba(255,250,240,.96);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:10px 16px 12px;box-shadow:0 5px 0 var(--ink);text-align:center;animation:fin .3s;pointer-events:auto}
.tcard b{font-size:clamp(17px,2.4vw,22px);line-height:1.25}
.tstep{font-size:13px;color:#6a6f8a;font-weight:600}
.tskip{font-size:14px;color:var(--ink);background:#e8e0cc;border:2px solid var(--ink);border-radius:10px;padding:5px 12px;font-weight:700}
/* задания и подарок */
.upr.ready{border-color:var(--sun)}
.upt .bar{height:9px;margin-top:3px}
.qrew{display:flex;align-items:center;gap:3px;font-size:15px;color:var(--muted);min-width:70px;justify-content:center}
.qrew svg{width:20px;height:20px}
.muted.small{font-size:13px;text-align:center}
.gdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
.gday{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--asph);border:3px solid var(--ink);border-radius:12px;padding:6px 2px;font-size:15px}
.gday small{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap}
.gday svg{width:28px;height:28px}
.gday.past{opacity:.45}
.gday.now{background:var(--sun);color:var(--ink);transform:scale(1.08)}
.gday.now small{color:var(--ink)}
@media (max-width:640px){
 .modes{grid-template-columns:repeat(2,minmax(0,1fr));width:min(440px,96vw)}
 .eff span{display:none}
 .gday{font-size:12px;padding:5px 1px}
 .gday svg{width:22px;height:22px}
}
/* загрузка */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#bfe6ff,#e6f6ff 60%,#8fd16a 60%);z-index:100;color:var(--ink);font-family:var(--body);font-weight:800}
#loader svg{width:min(300px,70vw);height:auto}
#loader .lspin{animation:lspin 1.2s linear infinite;transform-origin:150px 128px}
@keyframes lspin{to{transform:rotate(360deg)}}
#lt{font-size:18px}
</style>
