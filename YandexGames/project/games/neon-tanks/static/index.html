<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Неоновые Танки</title>
<style>
@font-face{font-family:"Russo One";font-style:normal;font-weight:400;font-display:block;src:url(russo-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Russo One";font-style:normal;font-weight:400;font-display:block;src:url(russo-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07031a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#07031a;color:#31f6ff;font:22px "Russo One",Arial,sans-serif;z-index:10;text-shadow:0 0 12px #31f6ff;letter-spacing:2px}
#loader svg{width:120px;height:120px;filter:drop-shadow(0 0 10px #31f6ff)}
#loader .tk{animation:s 2.4s linear infinite;transform-origin:60px 60px}
@keyframes s{to{transform:rotate(360deg)}}
#loader .bar{width:180px;height:6px;border-radius:3px;background:rgba(49,246,255,.15);overflow:hidden}
#loader .bar i{display:block;height:100%;width:40%;background:#ff2e88;box-shadow:0 0 10px #ff2e88;animation:b 1.1s ease-in-out infinite alternate}
@keyframes b{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
</style>
<!--SDK-->
</head>
<body oncontextmenu="return false">
<div id="loader"><svg viewBox="0 0 120 120"><g class="tk"><rect x="58" y="48" width="48" height="24" rx="2" fill="#16112f" stroke="#a9a3d6" stroke-width="3"/><circle cx="60" cy="60" r="30" fill="#0d0828" stroke="#31f6ff" stroke-width="4"/><circle cx="60" cy="60" r="19" fill="none" stroke="rgba(150,250,255,.45)" stroke-width="2"/><polygon points="66,60 63,65.2 57,65.2 54,60 57,54.8 63,54.8" fill="#bffcff"/></g></svg><div>NEON TANKS</div><div class="bar"><i></i></div></div>
<div id="game"></div>
<script src="phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
