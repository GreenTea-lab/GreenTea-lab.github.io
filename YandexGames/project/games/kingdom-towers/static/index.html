<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Башни Королевства</title>
<style>
@font-face{font-family:"Rubik";font-style:normal;font-weight:800;font-display:block;src:url(rubik-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Rubik";font-style:normal;font-weight:800;font-display:block;src:url(rubik-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Ruslan Display";font-style:normal;font-weight:400;font-display:block;src:url(ruslan-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Ruslan Display";font-style:normal;font-weight:400;font-display:block;src:url(ruslan-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#3a2a1a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}
#game canvas{display:block;touch-action:none}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#3a2a1a;color:#ffc93c;font:800 22px Rubik,Arial,sans-serif;z-index:10;text-shadow:0 2px 0 #2b1a0e}
#loader .ring{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,201,60,.25);border-top-color:#ffc93c;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
<!--SDK-->
</head>
<body oncontextmenu="return false">
<div id="loader"><div class="ring"></div><div>KINGDOM TOWERS</div></div>
<div id="game"></div>
<script src="phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
