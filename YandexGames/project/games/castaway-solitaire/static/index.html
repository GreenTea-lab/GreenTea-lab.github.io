<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Пасьянс Робинзона</title>
<style>
@font-face{font-family:Nunito;font-weight:800;font-display:block;src:url(nunito-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:800;font-display:block;src:url(nunito-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2190-2193,U+2212,U+2215,U+2605,U+FEFF,U+FFFD}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(nunito9-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:900;font-display:block;src:url(nunito9-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2190-2193,U+2212,U+2215,U+2605,U+FEFF,U+FFFD}
@font-face{font-family:Lobster;font-weight:400;font-display:block;src:url(lobster-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Lobster;font-weight:400;font-display:block;src:url(lobster-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}
/* Тропическая «бумага и дерево»: песочные панели, бирюза, коралл, тёмно-коричневый контур */
:root{--ink:#3a2a1e;--ink2:#6b4f3a;--muted:#9b8166;--paper:#fff9ec;--paper2:#f8ecd2;--line:#ead8b6;--coral:#ff7a59;--coralD:#e05d3e;--sea:#22a7c9;--seaD:#1784a3;--leaf:#55b84a;--leafD:#3f9a36;--sun:#ffcf3f;--wood:#c98b55;--lagoon-art:url(backgrounds/lagoon.webp);--lagoon-portrait:url(backgrounds/lagoon-phone.webp);
--logo:Lobster,Georgia,serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#8fd6ef;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c,#t{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#t{pointer-events:none;z-index:2}
#t.on{pointer-events:auto}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 45%,rgba(12,52,78,.18),rgba(12,52,78,.5) 75%),linear-gradient(180deg,rgba(12,52,78,.25),rgba(12,52,78,0) 30%,rgba(12,52,78,0) 70%,rgba(12,52,78,.35))}
#shade.on{opacity:1}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#ui *{pointer-events:none}
#ui button,#ui .hit,#ui input,#ui .modal,#ui .modal *{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--sea);outline-offset:3px}
svg{display:block}
.safe{position:absolute;inset:0;padding:var(--safe-top, env(safe-area-inset-top)) var(--safe-right, env(safe-area-inset-right)) var(--safe-bottom, env(safe-area-inset-bottom)) var(--safe-left, env(safe-area-inset-left))}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative;transition:transform .08s,box-shadow .08s;font-weight:900;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:saturate(.25) brightness(1.05);opacity:.75;cursor:default}
.btn svg{width:30px;height:30px;flex:none}
.big{min-width:170px;height:64px;padding:0 26px;border-radius:20px;font-size:25px;color:#fff;background:var(--coral);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.green{background:var(--leaf)}
.big.sea{background:var(--sea)}
.big.sand{background:var(--paper2);color:var(--ink);text-shadow:none}
.big small{font-size:16px;opacity:.9}
.mid{height:54px;padding:0 18px;border-radius:16px;font-size:20px;color:#fff;background:var(--coral)}
.mid.green{background:var(--leaf)}
.mid.sea{background:var(--sea)}
.mid.sand{background:var(--paper2);color:var(--ink)}
.round{width:60px;height:60px;border-radius:50%;background:var(--paper)}
.round svg{width:32px;height:32px}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 14px 3px 5px;font-size:22px;box-shadow:0 4px 0 var(--ink);font-weight:900;height:48px}
.chip svg{width:34px;height:34px}
.chip .plus{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--leaf);border:2px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;margin-left:4px}
.top{position:absolute;left:12px;right:12px;top:calc(10px + var(--safe-top, env(safe-area-inset-top)));display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl,.tr{display:flex;gap:10px;align-items:center}
.rcol{position:absolute;right:12px;top:calc(10px + var(--safe-top, env(safe-area-inset-top)));display:flex;flex-direction:column;gap:10px}
.rcol .round{width:56px;height:56px}
.bottom{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--safe-bottom, env(safe-area-inset-bottom)));display:flex;align-items:flex-end;justify-content:center;gap:14px}
.badge{position:absolute;top:-10px;right:-10px;min-width:28px;height:28px;border-radius:14px;background:var(--coral);color:#fff;border:3px solid var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 6px;animation:bob 1.4s ease-in-out infinite}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:16px;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.side .round{width:70px;height:70px}
.side .round svg{width:40px;height:40px}
@keyframes bubbob{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 4px))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
@keyframes tipin{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.05);opacity:1}100%{transform:translateX(-50%) scale(1)}}
@keyframes toastin{0%{transform:translateX(-50%) scale(.6);opacity:0}70%{transform:translateX(-50%) scale(1.05);opacity:1}100%{transform:translateX(-50%) scale(1)}}
@keyframes popin{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes glowp{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(255,220,90,.7)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 10px rgba(255,220,90,0)}}
.pulse{animation:glowp 1.6s ease-in-out infinite}
/* логотип */
.logo{position:absolute;left:0;right:0;top:calc(74px + var(--safe-top, env(safe-area-inset-top)));display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:fadein .8s}
.logo b{max-width:calc(100vw - 150px);font-family:var(--logo);font-weight:400;font-size:clamp(40px,7vw,68px);color:#fff;letter-spacing:.5px;text-shadow:0 3px 0 #1d7fa0,0 6px 0 rgba(0,40,60,.35),0 0 24px rgba(0,60,90,.3);line-height:1.05;text-align:center;padding:0 10px}
.logo i{font-style:normal;margin-top:4px;font-size:18px;color:#fff;background:rgba(20,110,140,.55);padding:3px 14px;border-radius:999px}
/* пузырь над постройкой */
.bubble{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:6px 12px 6px 8px;font-size:19px;box-shadow:0 4px 0 var(--ink);animation:bubbob 1.6s ease-in-out infinite;white-space:nowrap}
.bubble{margin-top:-34px}.bubble:after{content:"";position:absolute;left:calc(50% + var(--ax,0px));bottom:-35px;margin-left:-9px;border:9px solid transparent;border-top:13px solid var(--ink)}
.bubble svg{width:28px;height:28px}
.bubble.ok{background:#fff1a8}
/* модальные окна */
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,48,70,.5);animation:fadein .2s;padding:12px}
.panel{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink),0 20px 50px rgba(0,0,0,.35);width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;animation:pop .28s ease-out}
.panel.wide{width:min(760px,96vw)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px 22px}
.ph h2{margin:0;font-size:28px;font-weight:900}
.ph .round{width:52px;height:52px;flex:none}
.ph .round svg{width:26px;height:26px}
.pb{padding:8px 20px 22px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.pb p{margin:6px 0 10px;font-size:21px;line-height:1.35;color:var(--ink2)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.center{text-align:center}
.ribbon{position:absolute;left:50%;top:-30px;transform:translateX(-50%);background:var(--coral);color:#fff;border:4px solid var(--ink);border-radius:16px;padding:8px 26px;font-size:28px;font-weight:900;white-space:nowrap;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.ribbon.green{background:var(--leaf)}
.ribbon.sea{background:var(--sea)}
.stars3{display:flex;justify-content:center;gap:6px;margin:30px 0 6px}
.stars3 i{width:76px;height:76px;display:block;opacity:0;animation:popin .45s ease-out forwards}
.stars3 i:nth-child(2){width:96px;height:96px;margin-top:-16px}
.stars3 svg{width:100%;height:100%}
.res{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 14px}
.res div{background:var(--paper2);border:3px solid var(--line);border-radius:16px;padding:8px 16px;font-size:22px;display:flex;align-items:center;gap:8px}
.res svg{width:30px;height:30px}
.res small{color:var(--muted);font-size:16px}
/* список построек */
.plist{display:flex;flex-direction:column;gap:10px}
.pitem{display:flex;align-items:center;gap:12px;background:var(--paper2);border:3px solid var(--line);border-radius:18px;padding:10px 12px}
.pitem.can{border-color:#f0c64a;background:#fff4c8}
.pitem .pic{width:64px;height:64px;flex:none;border-radius:14px;background:#cdeef7;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pitem .pic img{width:100%;height:100%;object-fit:cover}
.pitem .tx{flex:1;min-width:0}
.pitem .tx b{display:block;font-size:22px}
.pitem .tx small{display:block;font-size:17px;color:var(--ink2)}
.dots{display:flex;gap:5px;margin-top:4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.dots i.on{background:var(--leaf)}
.cost{display:inline-flex;align-items:center;gap:3px}
.cost svg{width:24px;height:24px}
.pitem .mid{min-width:118px}
.pitem .donetag{font-size:18px;color:var(--leafD);display:flex;align-items:center;gap:4px}
/* уровни */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:10px}
.lv{position:relative;aspect-ratio:1/1;border-radius:18px;border:3px solid var(--ink);background:var(--sea);color:#fff;font-size:28px;font-weight:900;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.lv.cur{background:var(--coral);animation:glowp 1.6s infinite}
.lv.lock{background:#c9bba3;color:#f4ecdc}
.lv.lock svg{width:30px;height:30px}
.lv .s{display:flex;gap:1px}
.lv .s svg{width:18px;height:18px}
.chap{grid-column:1/-1;font-size:20px;color:var(--ink2);margin:8px 0 0}
/* HUD партии */
.hud-c{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,249,236,.95);border:3px solid var(--ink);border-radius:18px;padding:4px 16px 6px;box-shadow:0 4px 0 var(--ink)}
.hud-c b{font-size:21px}
.hud-c .hs{display:flex;gap:2px}
.hud-c .hs svg{width:24px;height:24px}
.hud-c small{font-size:16px;color:var(--ink2)}
.boost{position:absolute;bottom:calc(14px + var(--safe-bottom, env(safe-area-inset-bottom)));display:flex;flex-direction:column;align-items:center;gap:4px}
.boost.l{left:12px}
.boost.r{right:12px}
.boost .round{width:68px;height:68px}
.boost .round svg{width:38px;height:38px}
.boost .lab{display:flex;align-items:center;gap:3px;background:rgba(255,249,236,.95);border:2px solid var(--ink);border-radius:999px;padding:1px 9px;font-size:16px}
.boost .lab svg{width:18px;height:18px}
.boost .nm{font-size:15px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.toast{position:absolute;left:50%;top:calc(96px + var(--safe-top, env(safe-area-inset-top)));transform:translateX(-50%);background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 18px;font-size:20px;box-shadow:0 4px 0 var(--ink);animation:toastin .25s;width:max-content;max-width:min(92vw,900px);text-align:center}
.tip{position:absolute;left:50%;transform:translateX(-50%);top:calc(104px + var(--safe-top, env(safe-area-inset-top)));width:min(660px,94vw);background:rgba(255,249,236,.97);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font-size:20px;line-height:1.3;box-shadow:0 4px 0 var(--ink);text-align:center;animation:tipin .3s}
/* настройки */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:20px;margin:6px 0}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.seg button{padding:8px 14px;font-size:18px;background:var(--paper2)}
.seg button.on{background:var(--sea);color:#fff}
/* магазин */
.iap-item{display:flex;align-items:center;gap:12px;background:var(--paper2);border:3px solid var(--line);border-radius:18px;padding:10px 12px;margin-bottom:10px}
.iap-ic{width:62px;height:62px;flex:none}
.iap-ic img,.iap-ic svg{width:100%;height:100%;border-radius:12px}
.iap-tx{flex:1;min-width:0}
.iap-tx b{display:block;font-size:21px}
.iap-tx small{display:block;font-size:16px;color:var(--ink2)}
.iap-buy{min-width:110px;height:52px;border-radius:14px;background:var(--leaf);color:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.iap-buy:disabled{background:#bbb}
.iap-buy.owned{background:#9bc98f}
.iap-price{display:inline-flex;align-items:center;gap:4px}
.iap-price img{width:22px;height:22px}
/* подарок дня */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 14px}
.day{border:3px solid var(--line);border-radius:16px;background:var(--paper2);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px}
.day svg{width:30px;height:30px}
.day b{font-size:19px}
.day.got{opacity:.5}
.day.now{border-color:var(--coral);background:#ffe6dc}
.day.last{grid-column:span 2}
/* таблица рекордов */
.lb{display:flex;flex-direction:column;gap:6px}
.lbr{display:flex;align-items:center;gap:10px;background:var(--paper2);border-radius:14px;padding:8px 12px;font-size:20px}
.lbr.me{background:#fff1a8}
.lbr .rk{width:36px;text-align:center;color:var(--ink2)}
.lbr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Loading screen */
#loader{position:fixed;inset:0;z-index:10;display:grid;align-items:center;justify-items:center;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));background:#12565b var(--lagoon-art) 50% 50%/cover no-repeat;color:#fff5d7;isolation:isolate;transition:opacity .25s ease}
#loader::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 52%,#082e37e6 0%,#103d46b3 33%,#04272830 70%),linear-gradient(0deg,#062e3680,transparent 45%)}
#loader.loaded{opacity:0;pointer-events:none}
.load-content{width:min(100%,560px);display:grid;justify-items:center;text-align:center;gap:clamp(13px,3vh,24px);padding:12px 0;filter:drop-shadow(0 9px 12px #0315145c)}
.load-cards{position:relative;width:164px;height:112px;transform-origin:50% 60%;animation:load-breath 5.5s ease-in-out infinite}
.load-card{position:absolute;top:9px;left:49px;display:grid;place-items:center;width:70px;height:96px;border-radius:11px;border:1px solid #ffe5a6;background:#fff1ce;color:#af423a;box-shadow:0 4px 0 #b58952,0 8px 20px #071e24a0;transform:rotate(-8deg)}
.load-card::before{content:"";position:absolute;inset:5px;border:1px solid #c99c665e;border-radius:6px}
.load-card i{font:700 13px Georgia,serif;position:absolute;top:10px;left:11px;font-style:normal}
.load-card b{font:400 38px Georgia,serif;text-shadow:0 1px #fff7dd}
.load-card.left{transform:translate(-34px,4px) rotate(-22deg);background:repeating-linear-gradient(45deg,#162f42 0 6px,#224858 6px 10px)}
.load-card.left::before{border-color:#dca96e}
.load-card.right{transform:translate(29px,7px) rotate(16deg);color:#194a52;background:linear-gradient(135deg,#fff7db,#dec698)}
.load-card.face{background:linear-gradient(145deg,#fff7dd,#efd299 90%)}
.load-card.face::after{content:"";position:absolute;width:5px;height:5px;bottom:10px;right:11px;transform:rotate(45deg);background:#af423a}
.load-heading{max-width:100%;margin:0;font:400 clamp(34px,7.4vw,68px)/1.04 var(--logo);text-wrap:balance;text-shadow:0 3px #22575b,0 5px 12px #03272c}
.load-state{width:min(100%,335px);display:grid;gap:10px;padding:15px 17px 13px;border:1px solid #f1dca28c;border-radius:15px;background:linear-gradient(150deg,#143c44f7,#0a3139f5);box-shadow:0 4px 0 #062a308c,inset 0 1px 0 #fff2c12b}
.load-progress{height:9px;overflow:hidden;border-radius:12px;background:#04262b;border:1px solid #23494f;box-shadow:inset 0 1px 2px #04171b}
.load-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#d8904d,#efbd70 70%,#fff0ad);box-shadow:0 0 9px #f0c17894;transition:width .32s ease-out}
.load-status{margin:0;font-size:14px;line-height:1.35;color:#fff0cb;overflow-wrap:anywhere}
#loader[data-error] .load-progress{display:none}
#load-retry{justify-self:center;border:1px solid #d3ae68;border-radius:10px;background:#ffe4a5;color:#2b271b;font:900 14px var(--body);padding:8px 15px;box-shadow:0 2px #9a7239;cursor:pointer}
#load-retry[hidden]{display:none}
#load-retry:focus-visible{outline:2px solid #fff4cd;outline-offset:3px}
@keyframes load-breath{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (orientation:portrait){#loader{background-image:var(--lagoon-portrait)}#loader::before{background:radial-gradient(ellipse at 50% 53%,#082e37db 0%,#103d46a9 39%,#04272819 78%)}}
@media(max-height:450px){.load-content{gap:9px}.load-cards{height:82px;scale:.76;transform-origin:50% 10%}.load-heading{font-size:clamp(31px,8vh,47px)}.load-state{padding:10px 14px;gap:7px}}
@media(prefers-reduced-motion:reduce){#loader,.load-fill{transition:none}.load-cards{animation:none}}
@media (max-height:560px){.hud-c{flex-direction:row;gap:10px;padding:3px 14px;border-radius:14px}.hud-c b{font-size:18px}.hud-c .hs svg{width:20px;height:20px}.top .round{width:48px;height:48px}.top .round svg{width:26px;height:26px}.chip{height:42px;font-size:19px}.chip svg{width:28px;height:28px}.tip{top:calc(62px + var(--safe-top, env(safe-area-inset-top)));font-size:17px;padding:6px 12px}.big{height:54px;font-size:21px;min-width:140px}.side .round{width:58px;height:58px}.logo{display:none}.boost .round{width:58px;height:58px}}
@media (max-width:420px){.big{min-width:150px;padding:0 18px;font-size:23px}.chip{font-size:20px;height:44px}.chip svg{width:30px;height:30px}.ph h2{font-size:24px}}
</style>
</head>
<body oncontextmenu="return false">
<div id="loader" aria-labelledby="lt" aria-busy="true">
  <div class="load-content">
    <div class="load-cards" aria-hidden="true">
      <span class="load-card left"></span>
      <span class="load-card right"><i>7</i><b>♠</b></span>
      <span class="load-card face"><i>A</i><b>♥</b></span>
    </div>
    <h1 id="lt" class="load-heading">Пасьянс Робинзона</h1>
    <div class="load-state">
      <div class="load-progress" role="progressbar" aria-labelledby="lt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="load-fill"></div></div>
      <p class="load-status" id="load-status" role="status">Запускаем игру…</p>
      <button id="load-retry" type="button" hidden>Попробовать снова</button>
    </div>
  </div>
</div>
<canvas id="c"></canvas>
<div id="shade"></div>
<canvas id="t"></canvas>
<div id="ui"></div>
<script>
(() => {
  const requested = new URLSearchParams(location.search).get('vk_language') || navigator.language || 'ru';
  const english = !['ru','be','kk','uk','uz','ky','tg','hy','az','ka'].includes(requested.slice(0,2));
  const title = document.getElementById('lt');
  const status = document.getElementById('load-status');
  const retry = document.getElementById('load-retry');
  if (english) {
    document.documentElement.lang = 'en';
    document.title = title.textContent = 'Castaway Solitaire';
    status.textContent = 'Starting the game…';
    retry.textContent = 'Try again';
  }
  retry.addEventListener('click', () => location.reload());
  document.addEventListener('error', event => {
    if (event.target.id !== 'castaway-entry') return;
    const loader = document.getElementById('loader');
    if (!loader) return;
    loader.dataset.error = '';
    loader.setAttribute('aria-busy','false');
    status.textContent = english ? 'The game could not load.' : 'Не удалось загрузить игру.';
    retry.hidden = false;
  }, true);
})();
</script>
<!--SDK-->
<script id="castaway-entry" src="game.js"></script>
</body>
</html>
