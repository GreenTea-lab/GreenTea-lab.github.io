<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Не гаси свет</title>
<style>
@font-face{font-family:Distressed;font-display:block;src:url(dis-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Distressed;font-display:block;src:url(dis-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:"PT Sans";font-weight:400;font-display:block;src:url(pts-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"PT Sans";font-weight:400;font-display:block;src:url(pts-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+2190-2193}
@font-face{font-family:"PT Sans";font-weight:700;font-display:block;src:url(ptsb-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"PT Sans";font-weight:700;font-display:block;src:url(ptsb-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2122,U+2190-2193}
@font-face{font-family:"Marck Script";font-display:block;src:url(marck-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Marck Script";font-display:block;src:url(marck-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2122}
@font-face{font-family:Cormorant;font-weight:700;font-display:block;src:url(corm-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Cormorant;font-weight:700;font-display:block;src:url(corm-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2122}
/* Старый дом: пожелтевшие записки на скотче, латунные таблички, карандаш и чернила */
:root{--ink:#21160c;--bone:#e8dcc0;--paper:#e9dcbd;--paper2:#d9c79f;--brass:#c89a3c;--brass2:#8a6420;--blood:#a8382c;--muted:#9a8c74;--dark:#0b0a0c;
--logo:Distressed,Cormorant,serif;--head:Cormorant,Georgia,serif;--hand:"Marck Script",cursive;--body:"PT Sans",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#040306;font-family:var(--body);color:var(--bone);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer button,.layer label,.layer .paper,.layer .notes{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:2px dashed var(--brass);outline-offset:3px}
svg{display:block}
/* виньетка: в меню мягкая, в игре темнеет, когда Жилец рядом */
#vig{position:absolute;inset:0;pointer-events:none;--d:0;transition:opacity .3s}
#vig.play{background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,calc(.55 + var(--d)*.4)) 100%),radial-gradient(ellipse at center,transparent 30%,rgba(60,0,8,calc(var(--d)*.45)) 100%)}
#vig.menu{background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.75) 100%),linear-gradient(90deg,rgba(0,0,0,.55),transparent 45%)}
/* щели шкафа */
#slats{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:repeating-linear-gradient(176deg,rgba(18,10,6,.95) 0 3vh,rgba(18,10,6,.3) 3vh 3.6vh,transparent 3.6vh 8.4vh,rgba(0,0,0,.45) 8.4vh 9vh),linear-gradient(90deg,#120a06 0 14%,transparent 14% 49%,#120a06 49% 51%,transparent 51% 86%,#120a06 86%)}
#slats.on{opacity:1}
#scare{position:absolute;inset:0;pointer-events:none;opacity:0}
#scare.on{animation:scr .09s steps(2) infinite;opacity:1}
@keyframes scr{0%{background:rgba(255,255,255,.18)}50%{background:rgba(0,0,0,.35)}}
#scare.after{opacity:1;background:radial-gradient(ellipse at center,rgba(20,0,4,.55),rgba(0,0,0,.92));transition:opacity 1s}
#white{position:absolute;inset:0;pointer-events:none;background:#fff6e4;opacity:0}
/* верхняя полоса */
.topbar{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(14,10,8,.75);border:1.5px solid rgba(200,154,60,.6);border-radius:999px;padding:4px 6px 4px 5px;font:700 19px var(--body);color:var(--bone)}
.chip svg{width:28px;height:28px}
.chip .plus{width:24px;height:24px;border-radius:50%;background:#3a6a3a;display:flex;align-items:center;justify-content:center;margin-left:4px}
.chip .plus svg{width:14px;height:14px}
.round{width:52px;height:52px;border-radius:50%;background:rgba(14,10,8,.7);border:1.5px solid rgba(232,220,192,.35);display:flex;align-items:center;justify-content:center}
.round svg{width:26px;height:26px}
/* логотип */
.logo{position:absolute;left:0;right:0;top:7%;text-align:center;pointer-events:none}
.logo-t{font-family:var(--logo);font-size:clamp(44px,9vw,108px);line-height:1;color:var(--bone);letter-spacing:.02em;text-shadow:0 0 18px rgba(255,220,160,.25),0 4px 0 #000;animation:flick 6s infinite}
@keyframes flick{0%,91%,95%,100%{opacity:1}92%{opacity:.35}93.5%{opacity:.9}94%{opacity:.25}}
.logo-s{margin-top:8px;font-family:var(--hand);font-size:clamp(18px,2.6vw,28px);color:#c8b48a;transform:rotate(-2deg)}
/* меню: латунная табличка и список, будто подписанный карандашом */
.menu-list{position:absolute;left:clamp(16px,6vw,90px);bottom:clamp(20px,8vh,80px);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.brass{pointer-events:auto;display:inline-flex;align-items:center;gap:12px;padding:10px 22px 10px 16px;border-radius:8px;color:#2a1a08;font:700 22px var(--head);background:linear-gradient(180deg,#e8c470,#c0902e 55%,#9a6c1c);border:2px solid #4a3010;box-shadow:inset 0 1px 0 rgba(255,255,220,.6),inset 0 -2px 0 rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.6);position:relative;text-align:left}
.brass::before,.brass::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f8e0a0,#6a4a10);box-shadow:0 0 0 1px #4a3010}
.brass::before{left:5px}.brass::after{right:5px}
.brass svg{width:30px;height:30px;flex:none}
.brass small{display:block;font:400 14px var(--body);color:#4a3010;margin-top:-2px}
.brass:active{transform:translateY(2px)}
.play{font-size:30px;padding:12px 30px 12px 20px}
.play svg{width:40px;height:40px}
.mitem{display:flex;align-items:center;gap:12px;padding:6px 12px 6px 6px;font:700 24px var(--head);color:var(--bone);text-shadow:0 2px 6px #000;position:relative}
.mitem svg{width:30px;height:30px;opacity:.9}
.mitem span{position:relative}
.mitem span::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--brass);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.mitem:hover span::after,.mitem:active span::after{transform:scaleX(1)}
.ghost{pointer-events:auto;padding:10px 18px;border-radius:8px;border:1.5px solid rgba(60,40,20,.55);font:700 19px var(--head);color:var(--ink);background:rgba(255,255,255,.12)}
.over .ghost{color:var(--bone);border-color:rgba(232,220,192,.45);background:rgba(0,0,0,.35)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
/* бумага */
.paper{position:relative;color:var(--ink);background:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.35),transparent 50%),radial-gradient(circle at 85% 80%,rgba(120,80,30,.25),transparent 35%),radial-gradient(circle at 10% 90%,rgba(120,80,30,.18),transparent 25%),linear-gradient(var(--paper),var(--paper2));box-shadow:0 10px 30px rgba(0,0,0,.65);clip-path:polygon(0 1%,4% 0,30% 1%,55% 0,80% 1%,100% 0,99% 30%,100% 60%,99% 100%,70% 99%,40% 100%,10% 99%,0 100%,1% 60%)}
.ph{font:700 30px var(--head);text-align:center;margin-bottom:6px}
.red{color:var(--blood)}
.hand{font-family:var(--hand);font-size:22px;line-height:1.35;color:#2a2a4a}
.pin{position:absolute;left:50%;top:-6px;width:90px;height:22px;margin-left:-45px;background:rgba(230,220,180,.55);transform:rotate(-3deg);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);pointer-events:auto;padding:12px}
.modal .paper{width:min(560px,96vw);max-height:94vh;overflow-y:auto;touch-action:pan-y;padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px;animation:pin .25s ease-out}
@keyframes pin{0%{transform:translateY(-20px) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.intro .goal{display:flex;align-items:center;gap:10px;font:700 18px var(--body);padding:8px 12px;border:1.5px dashed rgba(60,40,20,.5);border-radius:6px}
.intro .goal svg{width:34px;height:34px;flex:none}
.newr{font:italic 16px var(--body);color:#5a3a1a}
.ctrl{font-size:15px;line-height:1.45;color:#4a3a2a}
/* ночи: записки */
.panel-c{position:absolute;left:0;right:0;top:72px;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 10px 14px;overflow:hidden}
.ttl{font:700 clamp(30px,5vw,44px) var(--head);color:var(--bone);text-shadow:0 3px 10px #000}
.notes{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:1000px;overflow-y:auto;touch-action:pan-y;padding:16px 6px}
.note{position:relative;width:clamp(140px,16vw,170px);height:200px;padding:18px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);background:linear-gradient(var(--paper),var(--paper2));box-shadow:0 8px 20px rgba(0,0,0,.6);transform:rotate(var(--r))}
.note .tape{position:absolute;top:-8px;left:50%;width:60px;height:18px;margin-left:-30px;background:rgba(230,220,180,.6)}
.nn{font:700 64px/1 var(--head)}
.nl{font-family:var(--hand);font-size:22px;margin-top:-6px}
.nk{display:flex;gap:0;margin-top:6px}
.nk svg{width:24px;height:24px;margin:0 -3px}
.nb{display:flex;align-items:center;gap:3px;font-size:14px;margin-top:auto}
.nb svg{width:18px;height:18px}
.nb.new{font-family:var(--hand);font-size:22px}
.nlock{margin-top:auto}
.nlock svg{width:34px;height:34px}
.note.locked{filter:brightness(.45) sepia(.4)}
.note.done::after{content:"";position:absolute;right:10px;top:10px;width:30px;height:30px;border:3px solid var(--blood);border-radius:50%;opacity:.7}
.nm{display:flex;align-items:center;gap:12px;background:rgba(10,8,8,.75);border:1.5px solid rgba(168,56,44,.6);border-radius:10px;padding:10px 14px;max-width:560px;cursor:pointer}
.nm.off{opacity:.55;cursor:default}
.nm input{display:none}
.nm .sw{flex:none;width:46px;height:26px;border-radius:13px;background:#3a3030;position:relative;transition:background .2s}
.nm .sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--bone);transition:left .2s}
.nm input:checked+.sw{background:var(--blood)}
.nm input:checked+.sw::after{left:23px}
.nm>span:last-child{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.nm>span:last-child svg{width:28px;height:28px;grid-row:span 2}
.nm b{font:700 20px var(--head)}
.nm small{font-size:13px;color:var(--muted)}
/* лавка */
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{pointer-events:auto;padding:7px 14px;border-radius:6px;font:700 18px var(--head);color:var(--bone);background:rgba(0,0,0,.5);border:1.5px solid rgba(232,220,192,.25)}
.tab.on{background:var(--brass);color:var(--ink);border-color:#4a3010}
.paper.shop,.paper.lb{width:min(620px,96vw);padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;touch-action:pan-y;min-height:0}
.srow{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1.5px dashed rgba(60,40,20,.3);text-align:left;color:var(--ink)}
.srow:last-child{border-bottom:0}
.si{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(40,25,10,.85);border-radius:8px}
.si svg,.si img{width:34px;height:34px}
.st{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.st b{font:700 19px var(--head)}
.st small{font-size:14px;color:#5a4a3a}
.pips{display:flex;gap:4px;margin-top:3px}
.pips i{width:16px;height:6px;border-radius:3px;background:rgba(60,40,20,.25)}
.pips i.on{background:var(--brass2)}
.buy{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;font:700 18px var(--body);color:#2a1a08;background:linear-gradient(#e8c470,#b08028);border:1.5px solid #4a3010;flex:none}
.buy svg{width:22px;height:22px}
.buy.poor{filter:grayscale(.7) brightness(.85)}
.maxed{font:700 15px var(--body);color:#5a7a3a}
.freead{width:100%}
.freead:disabled{opacity:.6}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw-c{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:8px;background:rgba(30,20,10,.85);color:var(--bone);border:2px solid transparent}
.sw-c.on{border-color:var(--brass)}
.sw-c .beam{width:64px;height:40px;background:radial-gradient(ellipse at 15% 50%,var(--c),transparent 70%),linear-gradient(90deg,var(--c),transparent);clip-path:polygon(0 40%,100% 0,100% 100%,0 60%)}
.sw-c b{font:700 16px var(--head)}
.sw-c small{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--muted)}
.sw-c small svg{width:16px;height:16px}
.empty{padding:24px;text-align:center;color:#5a4a3a}
.iap-price{display:inline-flex;align-items:center;gap:5px}
.iap-price img{width:20px;height:20px}
.iap-price i{font-style:normal;font-size:.8em}
/* рекорды */
.lb ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.lb li{display:flex;gap:10px;align-items:center;font-size:18px;padding:4px 6px;border-bottom:1px dashed rgba(60,40,20,.3)}
.lb li i{font:700 20px var(--head);width:30px;font-style:normal}
.lb li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb li.me{background:rgba(200,154,60,.3)}
.lbme{font-family:var(--hand);font-size:22px;text-align:center;margin-top:6px}
.muted{color:#5a4a3a}
/* настройки */
.vol-box{display:flex;flex-direction:column;gap:12px}
.vol-row{display:flex;align-items:center;gap:10px;font-size:17px;color:var(--ink)}
.vol-ic{width:28px;height:28px;flex:none}
.vol-ic svg{width:28px;height:28px}
.vol-l{min-width:90px;font-weight:700}
.vol-v{min-width:48px;text-align:right;font-size:15px;color:#5a4a3a}
.vol-row input{-webkit-appearance:none;appearance:none;flex:1;height:30px;background:transparent;touch-action:none;margin:0;--p:50%}
.vol-row input::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brass2) var(--p),rgba(60,40,20,.25) var(--p))}
.vol-row input::-moz-range-track{height:8px;border-radius:4px;background:rgba(60,40,20,.25)}
.vol-row input::-moz-range-progress{height:8px;border-radius:4px;background:var(--brass2)}
.vol-row input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f8e0a0,#9a6c1c);border:2px solid #4a3010}
.vol-row input::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#c89a3c;border:2px solid #4a3010}
.qrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:700;color:var(--ink)}
.qrow span{min-width:128px}
.qrow .tab{color:var(--ink);background:rgba(255,255,255,.2);border-color:rgba(60,40,20,.35);font-size:16px}
.qrow .tab.on{background:var(--brass)}
/* HUD */
.hud-tl{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:8px}
.bat{display:flex;align-items:center;gap:8px;font:700 17px var(--body);text-shadow:0 1px 3px #000}
.bico{position:relative;width:52px;height:22px;border:2.5px solid var(--bone);border-radius:4px;padding:2px}
.bico::after{content:"";position:absolute;right:-7px;top:5px;width:4px;height:8px;background:var(--bone);border-radius:0 2px 2px 0}
.bico i{display:block;height:100%;border-radius:1px;background:#8ac860;transition:width .3s}
.bat.off{opacity:.55}
.hkeys{display:flex;gap:2px}
.hkeys svg{width:32px;height:32px;filter:drop-shadow(0 1px 2px #000)}
.hkeys .got svg{filter:drop-shadow(0 0 6px rgba(255,200,90,.7))}
.pulse{animation:pul .6s}
@keyframes pul{40%{transform:scale(1.25)}}
.pause{position:absolute;right:14px;top:12px;pointer-events:auto}
.cross{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(232,220,192,.55)}
.prompt{position:absolute;left:50%;top:calc(50% + 34px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;font:700 18px var(--body);text-shadow:0 1px 4px #000;opacity:0;transition:opacity .15s;white-space:nowrap}
.prompt.show{opacity:1}
.prompt svg{width:26px;height:26px}
.prompt kbd{font:700 15px var(--body);padding:2px 8px;border:1.5px solid var(--bone);border-radius:5px;background:rgba(0,0,0,.5)}
.stam{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));width:180px;margin-left:-90px;height:5px;border-radius:3px;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
.stam.show{opacity:1}
.stam i{display:block;height:100%;border-radius:3px;background:var(--bone)}
.stam.tired i{background:var(--blood)}
.lockhint{position:absolute;left:50%;top:62%;transform:translateX(-50%);font:700 17px var(--body);padding:8px 16px;background:rgba(0,0,0,.6);border-radius:8px;border:1px solid rgba(232,220,192,.3)}
.joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(232,220,192,.35);background:rgba(0,0,0,.2);opacity:0;pointer-events:none}
.joy.on{opacity:1}
.joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(232,220,192,.35)}
.mbtns{position:absolute;right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;gap:12px;align-items:end;pointer-events:none}
.mb{pointer-events:auto;width:64px;height:64px;border-radius:50%;background:rgba(12,10,10,.6);border:2px solid rgba(232,220,192,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.mb svg{width:34px;height:34px}
.mb.cool{opacity:.4}
.mb.act{grid-column:span 2;justify-self:end;width:88px;height:88px;opacity:.25;border-color:var(--brass)}
.mb.act.show{opacity:1;background:rgba(60,40,10,.7)}
.mb.act small{font-size:12px;font-weight:700;max-width:84px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mb.run{background:rgba(40,20,20,.6)}
/* тосты */
#toasts{position:absolute;left:0;right:0;top:16%;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:70}
.toast{font-family:var(--hand);font-size:clamp(22px,3vw,30px);color:var(--bone);text-shadow:0 2px 8px #000,0 0 2px #000;animation:toastA 3.2s forwards;text-align:center;max-width:90vw;padding:0 12px}
@keyframes toastA{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* итоги */
.over{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;pointer-events:auto}
.caught{font-family:var(--logo);font-size:clamp(46px,9vw,96px);color:var(--blood);text-shadow:0 0 30px rgba(168,56,44,.5),0 4px 0 #000;animation:flick 3s infinite}
.csub{font-family:var(--hand);font-size:26px;color:#c8b48a}
.ckeys{display:flex;align-items:center;gap:6px;font:700 22px var(--body)}
.ckeys svg{width:34px;height:34px}
.second{max-width:420px}
.second small{font-size:13px}
.paper.res{width:min(480px,94vw);padding:28px 26px 22px;display:flex;flex-direction:column;gap:12px;transform:rotate(-1deg)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:18px}
.stats b{font-weight:700}
.score{font:700 24px var(--head);text-align:center}
.score em{display:block;font:400 22px var(--hand);color:var(--blood);transform:rotate(-3deg)}
.coinsrow{display:flex;align-items:center;justify-content:center;gap:8px;font:700 22px var(--body)}
.coinsrow svg{width:30px;height:30px}
.dbl{display:flex;align-items:center;gap:6px;font-size:16px;padding:6px 10px}
.dbl svg{width:24px;height:24px}
/* план дома */
.mapw{position:relative;border:1.5px solid rgba(60,40,20,.4);transform:rotate(-.6deg)}
.mapw canvas{width:100%;height:auto;display:block}
.mapt{position:absolute;right:8px;bottom:6px;display:flex;gap:6px;align-items:center;font-family:var(--hand);font-size:20px;color:#3a2a1a}
.mapt svg{width:24px;height:24px}
/* загрузка */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#040306;z-index:100;color:#c8b48a;font:20px Georgia,serif}
#loader svg{width:70px;height:110px}
.flame{transform-origin:35px 40px;animation:fl .18s infinite alternate}
@keyframes fl{to{transform:scale(.92,1.06) rotate(2deg)}}
@media (max-height:520px){.logo{top:3%}.logo-t{font-size:clamp(36px,7vw,64px)}.menu-list{bottom:12px;gap:2px}.mitem{font-size:20px}.play{font-size:24px;padding:8px 22px 8px 14px}.panel-c{top:62px}.note{height:170px}.nn{font-size:48px}.modal .paper{padding:18px}}
</style>
</head>
