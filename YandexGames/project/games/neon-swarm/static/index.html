<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Неоновый Рой</title>
<style>
@font-face{font-family:"Russo One";font-style:normal;font-weight:400;font-display:block;src:url(russo-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Russo One";font-style:normal;font-weight:400;font-display:block;src:url(russo-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07031a;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
#game{position:fixed;top:var(--sat);bottom:var(--sab);left:var(--sal);right:var(--sar)}
#game canvas{display:block;touch-action:none}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#07031a;color:#31f6ff;font:22px "Russo One",Arial,sans-serif;z-index:10;text-shadow:0 0 12px #31f6ff}
#loader .ring{width:56px;height:56px;border-radius:50%;border:4px solid rgba(49,246,255,.2);border-top-color:#ff2e88;animation:s 0.9s linear infinite;box-shadow:0 0 18px rgba(255,46,136,.5)}
@keyframes s{to{transform:rotate(360deg)}}
</style>
<!--SDK-->
</head>
<body oncontextmenu="return false">
<div id="loader"><div class="ring"></div><div>NEON SWARM</div></div>
<div id="game"></div>
<script src="phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
