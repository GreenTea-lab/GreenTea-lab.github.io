<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Конфетная Ночь</title>
<style>
@font-face{font-family:Nunito;font-weight:800;font-display:block;src:url(nunito-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Nunito;font-weight:800;font-display:block;src:url(nunito-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2190-2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Pangolin;font-weight:400;font-display:block;src:url(pangolin-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Pangolin;font-weight:400;font-display:block;src:url(pangolin-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Rubik Wet Paint";font-weight:400;font-display:block;src:url(wet-cyr.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Rubik Wet Paint";font-weight:400;font-display:block;src:url(wet-lat.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Хеллоуинская «войлочная» канцелярия: тёмно-фиолетовый фетр со строчкой, крафтовые пакетики для конфет, леденцовые кнопки с чернильным контуром */
:root{--ink:#1e1430;--ink2:#3a2d5e;--felt:#2e2350;--felt2:#3b2e66;--paper:#fff3e0;--kraft:#e9c896;--kraft2:#d8b27a;--muted:#b8a8d8;--pumpkin:#ff8a2a;--lime:#8fd65a;--candy:#ff6aa8;--sky:#62c0f2;--violet:#9b6ae0;--gold:#ffd24a;
--logo:"Rubik Wet Paint",Pangolin,"Comic Sans MS",cursive;--disp:Pangolin,Nunito,"Comic Sans MS",sans-serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#2a2148;font-family:var(--body);font-weight:800;color:var(--paper);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer button,.layer .chip,.layer canvas{pointer-events:auto}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
svg{display:block}
/* кнопки-леденцы */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .08s,box-shadow .08s;font-family:var(--disp);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);text-shadow:0 2px 0 rgba(30,20,48,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{cursor:default}
.btn svg{width:24px;height:24px;flex:none}
.big{min-width:150px;height:56px;padding:0 22px;border-radius:18px;font-size:24px;color:#fff;background:var(--pumpkin)}
.big::after,.mid::after{content:"";position:absolute;left:10px;right:10px;top:5px;height:30%;border-radius:12px;background:rgba(255,255,255,.22);pointer-events:none}
.big.green{background:var(--lime)}
.big.blue{background:var(--sky)}
.big.violet{background:var(--violet)}
.big svg{width:26px;height:26px}
.mid{height:46px;padding:0 16px;border-radius:14px;font-size:19px;color:#fff;background:var(--violet)}
.mid.green{background:var(--lime)}
.mid.blue{background:var(--sky)}
.mid:disabled{opacity:.5}
.round{width:56px;height:56px;border-radius:50%;color:var(--ink);background:var(--paper)}
.round svg{width:30px;height:30px}
.round.small{width:46px;height:46px}
.round.small svg{width:24px;height:24px}
.chip{display:flex;align-items:center;gap:6px;background:var(--felt);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 4px;font-size:19px;box-shadow:0 3px 0 var(--ink);font-family:var(--disp)}
.chip svg{width:30px;height:30px}
.chip small{font-size:13px;color:var(--muted)}
.chip.coins{cursor:pointer}
.chip .plus{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--lime);border:2px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;margin-left:2px}
.topbar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.tb-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
/* меню */
.menu-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:70px 12px 20px}
.menu-c .spacer{flex:1}
.logo{position:absolute;left:0;right:0;top:9%;display:flex;justify-content:center;pointer-events:none}
.logo-in{position:relative;text-align:center;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-1deg)}}
.logo-t{font-family:var(--logo);font-size:clamp(42px,8.6vw,92px);line-height:1;color:var(--pumpkin);-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(255,138,42,.45);transform:rotate(-3deg)}
.logo-sub{display:inline-block;margin-top:6px;font-family:var(--disp);font-size:clamp(16px,2.6vw,24px);color:var(--ink);background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:2px 14px;transform:rotate(2deg);box-shadow:0 3px 0 var(--ink)}
.logo-p{position:absolute;left:-30px;bottom:-10px;width:clamp(44px,7vw,70px);height:clamp(44px,7vw,70px);transform:rotate(-14deg)}
.logo-b{position:absolute;right:-26px;top:-24px;width:clamp(40px,6vw,62px);height:clamp(40px,6vw,62px);animation:flap 1.4s ease-in-out infinite}
@keyframes flap{50%{transform:translateY(-6px) scaleX(.85)}}
.logo-p svg,.logo-b svg{width:100%;height:100%}
.play{height:72px;min-width:250px;font-size:34px}
.play svg{width:32px;height:32px}
.gift.ready{background:var(--candy);color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
/* уровни: крафтовые пакетики */
.panel-c{position:absolute;left:0;right:0;top:66px;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 10px 14px;overflow:hidden}
.ttl{font-family:var(--logo);font-size:clamp(30px,5vw,46px);color:var(--pumpkin);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{pointer-events:auto;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:12px;font-family:var(--disp);font-size:17px;color:var(--muted);background:var(--felt);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--c1);color:var(--ink);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.tab.locked{opacity:.7}
.tab svg{width:16px;height:16px}
.lcards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:18px 6px 12px;max-width:min(1040px,100%)}
.lcard{pointer-events:auto;position:relative;width:clamp(150px,17vw,178px);display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 8px 12px;border-radius:4px 4px 12px 12px;color:var(--ink);background:linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px) 0 0/14px 100%,linear-gradient(var(--kraft),var(--kraft2));border:3px solid var(--ink);box-shadow:0 5px 0 rgba(10,6,20,.55);transform:rotate(-1.2deg)}
/* зубчатый загнутый верх пакетика */
.lcard::before{content:"";position:absolute;left:-3px;right:-3px;top:-12px;height:16px;background:linear-gradient(135deg,transparent 33%,var(--ink) 33% 45%,var(--kraft) 45%) 0 0/16px 16px,linear-gradient(225deg,transparent 33%,var(--ink) 33% 45%,var(--kraft) 45%) 0 0/16px 16px}
.lcard::after{content:"";position:absolute;left:10px;right:10px;top:6px;height:8px;border-top:2px dashed rgba(30,20,48,.35)}
.lcard:nth-child(2n){transform:rotate(1.1deg)}
.lcard:nth-child(3n){transform:rotate(-.4deg)}
.lcard:active{transform:scale(.97)}
.lcard.boss{background:linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px) 0 0/14px 100%,linear-gradient(#ffb36a,#f2913a)}
.lcard.boss::before{background:linear-gradient(135deg,transparent 33%,var(--ink) 33% 45%,#ffb36a 45%) 0 0/16px 16px,linear-gradient(225deg,transparent 33%,var(--ink) 33% 45%,#ffb36a 45%) 0 0/16px 16px}
.lnum{font-family:var(--logo);font-size:38px;line-height:1;color:var(--c2)}
.lboss{position:absolute;top:10px;right:-10px;font-family:var(--disp);font-size:14px;background:var(--candy);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 8px;transform:rotate(10deg)}
.lens{display:flex;justify-content:center;min-height:56px;align-items:center;align-self:stretch}
.lens img{width:52px;height:52px;margin:0 -6px}
.lstars{display:flex;gap:2px}
.st svg{width:26px;height:26px}
.st.sm svg{width:18px;height:18px}
.st.lg svg{width:64px;height:64px}
.st.lg.pop{animation:popS .45s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes popS{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1)}}
.lbest{display:flex;align-items:center;gap:4px;font-family:var(--disp);font-size:16px;white-space:nowrap}
.lbest svg{width:20px;height:20px}
.lbest .muted{color:#7a6248;font-size:14px}
.llock{background:var(--paper);border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.llock svg{width:22px;height:22px}
.lcard.locked{filter:grayscale(.75) brightness(.8)}
.lcard.locked .lens{opacity:.45}
/* модальные окна: фетр со строчкой */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(14,8,28,.6);pointer-events:auto}
.mpanel{position:relative;width:min(480px,94vw);max-height:92vh;display:flex;flex-direction:column;background:var(--felt);border:3px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink),0 18px 50px rgba(0,0,0,.5);animation:mIn .22s ease-out}
.mpanel::before{content:"";position:absolute;inset:7px;border:2px dashed rgba(255,170,90,.55);border-radius:16px;pointer-events:none}
@keyframes mIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 4px 20px}
.mhead b{font-family:var(--disp);font-weight:400;font-size:26px;color:var(--gold);text-shadow:0 2px 0 var(--ink)}
.mbody{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 20px 22px;overflow-y:auto;touch-action:pan-y;text-align:center}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:17px;z-index:80;animation:toastA 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw;border:2px solid var(--pumpkin)}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* окно уровня */
.intro .mpanel{width:min(540px,95vw)}
.itask{font-family:var(--disp);font-size:18px;line-height:1.3;color:var(--paper);max-width:440px}
.igoals{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.goal,.itime{display:flex;align-items:center;gap:4px;background:var(--felt2);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-family:var(--disp);font-size:18px}
.goal svg,.itime svg{width:20px;height:20px}
.goal .st svg{width:16px;height:16px}
.isec{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.ihead{font-family:var(--disp);font-size:17px;color:var(--muted)}
.enemies{display:flex;flex-direction:column;gap:6px}
.enemy{display:flex;align-items:center;gap:10px;text-align:left;background:var(--felt2);border-radius:14px;padding:4px 10px 4px 4px}
.enemy img{width:56px;height:56px;flex:none}
.enemy b{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--gold)}
.enemy small{display:block;font-size:13px;color:var(--muted);line-height:1.25}
/* мастерская */
.ws-c{position:absolute;left:0;right:0;top:66px;bottom:0;display:flex;justify-content:center;padding:0 10px 14px}
.ws-panel{position:relative;width:min(640px,100%);display:flex;flex-direction:column;background:var(--felt);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);overflow:hidden;pointer-events:auto;max-height:100%}
.ws-panel::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,170,90,.45);border-radius:16px;pointer-events:none}
.ktabs{display:flex;gap:8px;padding:14px 14px 6px;justify-content:center}
.ktab{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:12px;font-family:var(--disp);font-size:18px;background:var(--felt2);color:var(--muted);border:3px solid var(--ink)}
.ktab svg{width:22px;height:22px}
.ktab.on{background:var(--gold);color:var(--ink)}
.kbody{overflow-y:auto;touch-action:pan-y;padding:8px 14px 18px;display:flex;flex-direction:column;gap:10px}
.uprow{display:flex;align-items:center;gap:12px;background:var(--felt2);border:2px solid var(--ink);border-radius:16px;padding:8px 10px}
.upic{width:54px;height:54px;flex:none;background:var(--paper);border:3px solid var(--ink);border-radius:14px;display:flex;align-items:center;justify-content:center}
.upic svg{width:38px;height:38px}
.uptx{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.uptx b{font-family:var(--disp);font-weight:400;font-size:19px}
.uptx em{font-style:normal;color:var(--gold);font-size:16px;margin-left:4px}
.uptx small{font-size:13px;color:var(--muted)}
.pips{display:flex;gap:4px;margin-top:3px}
.pips i{width:20px;height:9px;border-radius:5px;background:var(--ink2);border:2px solid var(--ink)}
.pips i.on{background:var(--pumpkin)}
.upg{height:46px;padding:0 10px;border-radius:14px;background:var(--lime);color:#fff;font-size:18px;gap:4px}
.upg svg{width:22px;height:22px}
.upg.poor{filter:saturate(.35) brightness(.85)}
.upg.max{background:var(--ink2);color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--felt2);border:3px solid var(--ink);border-radius:16px;padding:6px 6px 10px;font-family:var(--disp)}
.ccard b{font-weight:400;font-size:17px}
.ccard.sel{background:#5a4a8a;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.ccard.notown .cimg{filter:brightness(.55) saturate(.6)}
.cimg{width:110px;height:110px}
.price{display:flex;align-items:center;gap:3px;font-size:17px}
.price svg{width:20px;height:20px}
.price.poor{color:#ff8a9a}
.wear{display:flex;align-items:center;gap:3px;color:var(--lime);font-size:16px}
.wear svg{width:18px;height:18px}
/* настройки */
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:17px}
.segs{display:flex;gap:4px;background:var(--ink);padding:3px;border-radius:12px}
.seg{padding:6px 12px;border-radius:9px;font-family:var(--disp);font-size:16px;color:var(--muted)}
.seg.on{background:var(--gold);color:var(--ink)}
.ctrl{display:flex;flex-direction:column;gap:6px;background:var(--felt2);border-radius:14px;padding:10px 14px;font-size:14px;text-align:left;font-weight:700}
.ctrl b{font-family:var(--disp);font-weight:400;font-size:18px;color:var(--gold)}
.ctrl small{color:var(--paper);font-size:14px;line-height:1.35}
/* таблица рекордов */
.lb{align-self:stretch;display:flex;flex-direction:column;gap:5px}
.lbrow{display:flex;align-items:center;gap:10px;background:var(--felt2);border-radius:10px;padding:7px 12px;font-size:16px}
.lbrow b{width:28px;color:var(--gold)}
.lbrow span{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow.me{background:#5a4a8a;outline:2px solid var(--gold)}
.lblogin{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:6px}
.lbnote{font-size:14px}
/* магазин и подарок */
.free{align-self:stretch;display:flex;align-items:center;gap:10px;text-align:left;background:var(--felt2);border:2px solid var(--ink);border-radius:14px;padding:8px 10px}
.free>svg{width:44px;height:44px;flex:none}
.free div{flex:1;display:flex;flex-direction:column}
.free small{color:var(--muted);font-size:13px}
.free.off{opacity:.6}
.iap-box{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.iap-item{display:flex;align-items:center;gap:10px;background:var(--felt2);border:2px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:left}
.iap-ic{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center}
.iap-ic img,.iap-ic svg{width:56px;height:56px;object-fit:contain}
.iap-tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.iap-tx b{font-family:var(--disp);font-weight:400;font-size:17px}
.iap-tx small{font-size:13px;color:var(--muted)}
.iap-buy{min-width:92px;height:44px;padding:0 10px;border-radius:12px;background:var(--lime);color:#fff;font-family:var(--disp);font-size:18px;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.iap-buy.owned{background:transparent;color:var(--muted);font-size:14px;box-shadow:none}
.iap-price{display:inline-flex;align-items:center;gap:5px}
.iap-price img{width:20px;height:20px}
.gift-big svg{width:96px;height:96px;animation:pulse 1.3s infinite}
.gamount{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:34px}
.gamount svg{width:40px;height:40px}
/* HUD */
.hud{position:absolute;inset:0;pointer-events:none}
.hud button{pointer-events:auto}
.h-tl{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.bagchip{position:relative;display:flex;align-items:center;gap:6px;background:var(--felt);border:3px solid var(--ink);border-radius:16px;padding:4px 12px 10px 6px;box-shadow:0 3px 0 var(--ink)}
.bagchip>svg{width:38px;height:38px}
.bagtx{font-family:var(--disp);font-size:24px;line-height:1}
.bagtx small{font-size:15px;color:var(--muted)}
.bagbar{position:absolute;left:10px;right:10px;bottom:4px;height:5px;border-radius:3px;background:var(--ink2);overflow:hidden}
.bagbar i{display:block;height:100%;width:0;background:var(--candy);transition:width .15s}
.bagchip.full{animation:shake .5s infinite;border-color:var(--candy)}
@keyframes shake{25%{transform:rotate(-3deg)}75%{transform:rotate(3deg)}}
.pwchip{display:none;align-items:center;gap:6px;background:var(--felt);border:3px solid var(--ink);border-radius:14px;padding:3px 10px 3px 4px}
.pwchip.on{display:flex}
.pwchip svg{width:30px;height:30px}
.pwbar{width:80px;height:8px;border-radius:4px;background:var(--ink2);overflow:hidden}
.pwbar i{display:block;height:100%;background:var(--gold)}
.h-tc{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.goalbar{display:flex;align-items:center;gap:8px;background:var(--felt);border:3px solid var(--ink);border-radius:16px;padding:4px 12px 4px 6px;box-shadow:0 3px 0 var(--ink)}
.goalbar>svg{width:34px;height:34px}
.goalbar b{font-family:var(--disp);font-weight:400;font-size:24px;min-width:40px}
.gtrack{position:relative;width:clamp(110px,22vw,240px);height:12px;border-radius:6px;background:var(--ink2);border:2px solid var(--ink)}
.gtrack>i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--pumpkin),var(--gold));transition:width .3s}
.gmark{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px}
.gmark svg{width:20px;height:20px}
.bossbar{display:flex;align-items:center;gap:8px;background:var(--felt);border:3px solid var(--ink);border-radius:12px;padding:3px 10px;font-family:var(--disp);font-size:16px}
.bhp{display:flex;gap:4px}
.bhp i{width:18px;height:14px;border-radius:4px;background:var(--ink2);border:2px solid var(--ink)}
.bhp i.on{background:var(--candy)}
.h-tr{position:absolute;right:10px;top:10px;display:flex;gap:8px;align-items:center}
.timer{display:flex;align-items:center;gap:6px;background:var(--felt);border:3px solid var(--ink);border-radius:14px;padding:4px 12px 4px 6px;font-family:var(--disp);font-size:24px;box-shadow:0 3px 0 var(--ink)}
.timer svg{width:30px;height:30px}
.timer.low{background:#a8304a;animation:pulse 1s infinite}
.minimap{position:absolute;right:10px;top:72px;border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);image-rendering:pixelated;pointer-events:none!important;opacity:.95}
.homearrow{position:absolute;left:0;top:0;width:54px;height:54px;margin:-27px 0 0 -27px;display:none;align-items:center;justify-content:center;background:var(--gold);border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 var(--ink)}
.homearrow.on{display:flex;animation:pulse 1s infinite}
.homearrow svg{width:34px;height:34px}
.homearrow i{position:absolute;inset:-14px;pointer-events:none}
.homearrow i::after{content:"";position:absolute;right:-2px;top:50%;margin-top:-9px;border:9px solid transparent;border-left:12px solid var(--ink)}
.banner-box{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none}
.banner{display:inline-block;font-family:var(--disp);font-size:clamp(26px,4.6vw,42px);color:var(--gold);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);animation:bannerA 1.8s ease forwards;padding:0 12px}
.banner.big{font-family:var(--logo);font-size:clamp(36px,7vw,66px);color:var(--pumpkin)}
@keyframes bannerA{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);max-width:min(560px,80vw);font-family:var(--disp);font-size:19px;line-height:1.25;text-align:center;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 16px;box-shadow:0 4px 0 var(--ink);display:none}
.hint.on{display:block;animation:hintA .3s ease-out}
@keyframes hintA{0%{transform:translate(-50%,10px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
.keys-hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:rgba(255,243,224,.6);font-weight:700}
.fl{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);font-size:24px;color:var(--gold);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:flA 1.1s ease-out forwards;white-space:nowrap}
.fl.good{color:var(--lime)}
.fl.bad{color:#ff7a9a}
.fl.bank{color:var(--gold);font-size:32px}
.fl.bonus{color:var(--candy);font-size:22px}
.fl.warn{color:var(--paper);font-size:20px}
@keyframes flA{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
/* сенсорное управление */
.jzone{position:absolute;left:0;bottom:0;width:62%;height:70%;pointer-events:auto;touch-action:none}
.jbase{position:absolute;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;background:rgba(255,243,224,.12);border:3px solid rgba(255,243,224,.4);display:none}
.jbase.on{display:block}
.jknob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--pumpkin);border:3px solid var(--ink)}
.dashbtn{position:absolute;right:22px;bottom:26px;width:92px;height:92px;border-radius:50%;background:var(--sky);border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden}
.dashbtn svg{width:52px;height:52px;position:relative;z-index:1}
.dashbtn .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(30,20,48,.55)}
.dashbtn.on{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.hud.touch .hint{bottom:auto;top:128px;font-size:16px;padding:6px 12px}
/* итоги и прочие окна */
.rstars{display:flex;gap:6px;margin-top:-4px}
.rbank{display:flex;align-items:center;gap:8px;font-family:var(--disp)}
.rbank svg{width:46px;height:46px}
.rbank b{font-size:42px;font-weight:400;color:var(--gold)}
.rbank small{font-size:16px;color:var(--muted)}
.newbest{font-family:var(--disp);font-size:20px;color:var(--ink);background:var(--candy);border:2px solid var(--ink);border-radius:10px;padding:2px 12px;transform:rotate(-2deg)}
.rstats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:15px;color:var(--muted)}
.rstats span{display:flex;align-items:center;gap:4px}
.rstats svg{width:22px;height:22px}
.rstats b{color:var(--paper)}
.rcoins{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-size:28px}
.rcoins>svg{width:36px;height:36px}
.unl{font-family:var(--disp);font-size:18px;color:var(--lime)}
.lose-ic svg{width:80px;height:80px;animation:float 2s ease-in-out infinite}
@media (max-height:520px){
.panel-c{top:60px;gap:6px}.ttl{display:none}.lcard{width:146px;padding:16px 6px 8px}.lens img{width:42px;height:42px}.lens{min-height:44px}.lnum{font-size:28px}
.menu-c{gap:8px;padding-bottom:12px}.logo{top:6%}.logo-t{font-size:clamp(30px,11vh,60px)}.play{height:56px;font-size:26px;min-width:200px}.menu-c .big{height:48px;font-size:19px}.menu-c .round{width:50px;height:50px}
.mbody{gap:8px;padding:6px 16px 14px}.st.lg svg{width:46px;height:46px}.rbank b{font-size:32px}.enemy img{width:44px;height:44px}
.hud.touch .hint{top:auto;bottom:8px;max-width:46vw;font-size:15px}
.dashbtn{width:78px;height:78px;right:16px;bottom:16px}
}
@media (max-aspect-ratio:3/4){.logo{top:11%}.menu-c{justify-content:center;gap:16px;padding-bottom:40px}}
@media (max-width:600px){
.goalbar b{font-size:20px}.gtrack{width:100px}.gmark,.gmark svg{width:14px;height:14px}.gmark{margin:-7px 0 0 -7px}.bagtx{font-size:20px}.timer{font-size:20px;padding:3px 8px 3px 4px}.timer svg{width:24px;height:24px}
.h-tc{top:64px}.minimap{top:120px}
.hud.touch .hint{top:172px}
}
/* загрузка */
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#3b2e66,#1e1430);color:var(--pumpkin);z-index:10;overflow:hidden}
#loader svg{width:min(48vw,220px);height:auto;overflow:visible}
#loader #lt{font-family:"Rubik Wet Paint",Pangolin,sans-serif;font-size:clamp(34px,7vw,58px);-webkit-text-stroke:7px #1e1430;paint-order:stroke fill;text-shadow:0 5px 0 #1e1430;text-align:center;padding:0 10px}
#loader .ld{display:flex;gap:8px}
#loader .ld i{width:14px;height:14px;border-radius:50%;background:#ff8a2a;border:3px solid #1e1430;animation:ldp 1s ease-in-out infinite}
#loader .ld i:nth-child(2){animation-delay:.15s;background:#ff6aa8}
#loader .ld i:nth-child(3){animation-delay:.3s;background:#8fd65a}
@keyframes ldp{50%{transform:translateY(-10px)}}
#loader .face{animation:flick 1.2s ease-in-out infinite}
@keyframes flick{50%{opacity:.65}}
#loader .pk{animation:float 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
</head>

<canvas id="c"></canvas>
<div id="ui"></div>

<svg viewBox="0 0 200 180" stroke="#1e1430" stroke-width="5" stroke-linejoin="round">

<path d="M100 40c-6-14 0-26 14-30" fill="none" stroke="#3f7a3a" stroke-width="9" stroke-linecap="round"/>
<ellipse cx="62" cy="105" rx="42" ry="58" fill="#f2761a"/><ellipse cx="138" cy="105" rx="42" ry="58" fill="#f2761a"/><ellipse cx="100" cy="105" rx="44" ry="62" fill="#ff9333"/>
<g class="face" fill="#ffd24a" stroke-width="4"><path d="M64 88l18-14 6 22z"/><path d="M136 88l-18-14-6 22z"/><path d="M60 122c10 14 30 22 40 22s30-8 40-22l-10 2-6 8-8-8-8 8-8-8-8 8-6-8z"/></g>
</g>
</svg>
