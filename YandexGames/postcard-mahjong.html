/* Почтовая открытка: кремовая бумага, рамка авиапочты, тёплое дерево на панелях, зелёные «главные» кнопки. Всё крупно: старшей аудитории удобно читать и попадать пальцем */
:root{--ink:#3b2412;--ink2:#5a3a1e;--paper:#fff6e3;--paper2:#f5e6c8;--wood:#8a5530;--wood2:#5e3519;--honey:#e9b25f;--honey2:#c98a3a;--green:#4f9a3a;--green2:#3a7a28;--blue:#3f80c8;--blue2:#2b5f9a;--muted:#7a5a3a;--gold:#f6c443;
--logo:Lobster,Georgia,serif;--head:Kurale,Georgia,"Times New Roman",serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#2a4a6a;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.screen,.mlayer,.tut{position:absolute;inset:0;pointer-events:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0;pointer-events:auto}
button:disabled{cursor:default}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
svg{display:block}
/* фишки и круглые кнопки */
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 14px 0 6px;border-radius:26px;background:var(--paper);border:3px solid var(--wood2);box-shadow:0 4px 0 var(--wood2),0 6px 14px rgba(0,0,0,.25);font-size:24px;color:var(--ink)}
.chip svg{width:38px;height:38px}
.chip .plus{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;margin-left:4px;font-weight:900}
.round{width:60px;height:60px;border-radius:50%;background:var(--paper);border:3px solid var(--wood2);box-shadow:0 4px 0 var(--wood2),0 6px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.round svg{width:34px;height:34px}
.round.small{width:52px;height:52px}
.round.small svg{width:28px;height:28px}
.round:active,.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood2)}
.topbar{position:absolute;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:10px}
.tb-l,.tb-r{display:flex;gap:10px;align-items:center}
/* большие кнопки */
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;width:min(420px,88vw);padding:8px 20px;border-radius:22px;color:#fff;position:relative;transition:transform .08s;border:3px solid rgba(40,20,5,.55);box-shadow:0 6px 0 rgba(40,20,5,.55),0 10px 22px rgba(0,0,0,.3)}
.bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(40,20,5,.55)}
.bigbtn::after{content:"";position:absolute;left:14px;right:14px;top:6px;height:34%;border-radius:14px;background:linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.bigbtn .bt{font-family:var(--head);font-size:31px;line-height:1.05;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.bigbtn .bs{display:flex;align-items:center;gap:6px;font-size:19px;opacity:.95}
.bigbtn .bs svg{width:24px;height:24px}
.bigbtn>svg{width:34px;height:34px;position:absolute;left:18px;top:50%;transform:translateY(-50%)}
.bigbtn.green{background:linear-gradient(#66b04c,var(--green) 55%,var(--green2))}
.bigbtn.honey{background:linear-gradient(#f2c477,var(--honey) 55%,var(--honey2));color:var(--ink)}
