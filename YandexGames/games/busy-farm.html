/* Деревенский стиль: доски забора, бумажные бирки, зелёные эмалированные кнопки с тёмным контуром */
:root{--ink:#3a2814;--ink2:#6b4a2c;--muted:#9a8166;--paper:#fffaea;--paper2:#f5ebd3;--line:#e6d4b2;--grass:#62b843;--grassD:#3f8f2c;--sky:#4f9fe0;--sun:#ffcd3c;--red:#e2574c;--wood:#d29858;--woodD:#a9703e;--plank:#e1aa6a;
--disp:"Balsamiq Sans",Nunito,"Comic Sans MS",sans-serif;--hand:Neucha,"Balsamiq Sans",Nunito,sans-serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#8fd36a;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.layer,.scr{position:absolute;inset:0;pointer-events:none}
.layer button,.layer .chip,.hud button{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--sky);outline-offset:3px}
svg{display:block}
img{display:block}
.muted{color:var(--muted)}.c{text-align:center}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .08s,box-shadow .08s;font-family:var(--disp);font-weight:700;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{cursor:default;opacity:.55}
.btn svg{width:24px;height:24px;flex:none}
.big{min-width:170px;height:58px;padding:0 22px;border-radius:16px;font-size:23px;color:#fff;background:var(--red);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.green{background:var(--grass)}.big.blue{background:var(--sky)}
.big svg{width:26px;height:26px}
.big.poor{background:#b8a993}
.mid{height:48px;padding:0 16px;border-radius:14px;font-size:18px;color:#fff;background:var(--red)}
.mid.green{background:var(--grass)}.mid.blue{background:var(--sky)}
.mid.wood,.big.wood{background:repeating-linear-gradient(180deg,var(--plank) 0 14px,#d79d5c 14px 16px);color:var(--ink);text-shadow:none}
.round{width:58px;height:58px;border-radius:50%;color:var(--ink);background:var(--paper)}
.round svg{width:28px;height:28px}
.round.small{width:48px;height:48px}
.round.small svg{width:24px;height:24px}
.dot{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--red);border:3px solid var(--ink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 13px 3px 5px;font-size:20px;box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-weight:700;white-space:nowrap}
.chip svg{width:30px;height:30px;flex:none}
.chip .plus{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--grass);border:2px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;margin-left:2px}
.chip.bankc{cursor:pointer}
/* меню: вывеска на верёвках */
.menu-top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px}
.menu-c{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 12px 20px}
.logo{position:absolute;left:0;right:0;top:12%;display:flex;justify-content:center;pointer-events:none}
.sign{position:relative;padding:14px 34px 20px;background:repeating-linear-gradient(180deg,#e2aa66 0 16px,#c98d4f 16px 18px,#e2aa66 18px 36px);border:4px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 var(--ink);transform:rotate(-2deg);max-width:94vw;animation:sway 4s ease-in-out infinite;transform-origin:50% -70px}
.sign::after{content:"";position:absolute;inset:7px;border:2px dashed rgba(90,50,20,.35);border-radius:12px;pointer-events:none}
@keyframes sway{50%{transform:rotate(-.6deg)}}
.sign .rope{position:absolute;top:-70px;width:5px;height:70px;background:repeating-linear-gradient(180deg,#8a6438 0 6px,#6b4a2c 6px 9px);border-radius:2px}
.sign .rope.l{left:20%}.sign .rope.r{right:20%}
.logo-t{font-family:var(--disp);font-weight:700;font-size:clamp(36px,7vw,74px);line-height:1;color:#fff6d8;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-align:center}
.logo-s{position:absolute;right:-16px;bottom:-22px;padding:4px 14px;background:var(--grass);color:#fff;border:3px solid var(--ink);border-radius:12px;font-family:var(--hand);font-weight:400;font-size:clamp(16px,2.4vw,24px);transform:rotate(4deg);box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.play{height:76px;min-width:260px;font-size:30px;border-radius:20px}
.play svg{width:32px;height:32px}
.play span{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.play small{font-size:15px;opacity:.9;margin-top:3px;font-family:var(--body)}
/* панели (уровни, улучшения) */
.panel-c{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 10px 14px;background:linear-gradient(180deg,rgba(110,190,90,.0),rgba(60,120,40,.25))}
.topbar{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl{font-family:var(--disp);font-weight:700;font-size:clamp(28px,5vw,42px);color:#fff6d8;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{pointer-events:auto;padding:8px 16px;border-radius:12px;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink2);background:var(--paper2);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--c1);color:var(--ink);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.lgrid{display:grid;grid-template-columns:repeat(6,minmax(0,140px));gap:14px;justify-content:center;align-content:start;overflow-y:auto;touch-action:pan-y;padding:12px 8px;max-width:100%;pointer-events:auto;flex:1;min-height:0}
.lcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 8px;border-radius:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s}
.lcard::before{content:"";position:absolute;top:-10px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#c24a3a;border:3px solid var(--ink)}
.lcard:active{transform:translateY(3px)}
.lcard.cur{background:#eaffd6;animation:pulse 1.6s infinite}
.lcard.locked{background:#e5dccb;filter:saturate(.3)}
.lnum{font-family:var(--disp);font-size:30px;line-height:1}
.lgoals{display:flex;gap:2px;min-height:40px;align-items:center}
.gimg{width:38px;height:38px;object-fit:contain}
.gico svg{width:30px;height:30px}
.gico{display:flex;width:38px;height:38px;align-items:center;justify-content:center;font-style:normal}
.lmedal{display:flex;align-items:center;gap:3px;font-size:13px;color:var(--ink2)}
.lmedal svg{width:26px;height:26px}
.lmedal.new{color:var(--grassD)}
.llock svg{width:26px;height:26px;color:var(--muted)}
.season0 .lcard{border-bottom-color:#5aa63a}.season3 .lcard.cur{background:#e4f3ff}
.board{width:min(640px,100%);flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;pointer-events:auto;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.uphint{font-family:var(--hand);font-weight:400;font-size:18px;color:var(--ink2);text-align:center}
.uprow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--paper2)}
.uprow.locked{opacity:.6}
.upic{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;border:2px solid var(--line)}
.upic svg{width:36px;height:36px}.upimg{width:46px;height:46px}
.uptx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.uptx b{font-size:18px}.uptx small{font-size:14px;color:var(--ink2)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:8px;border-radius:4px;background:var(--line)}.pips i.on{background:var(--sun);box-shadow:inset 0 0 0 1.5px #c48a00}
.upg{flex:none;min-width:84px;height:46px;padding:0 10px;border-radius:12px;font-size:20px;background:var(--grass);color:#fff;display:flex;align-items:center;justify-content:center;gap:4px}
.upg svg{width:22px;height:22px}
.btn.upg.poor{background:#b8a993}
span.upg{color:var(--muted);font-family:var(--disp);background:none}
span.upg.max{color:var(--grassD)}
/* окна */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(40,30,10,.45);pointer-events:auto}
.mpanel{position:relative;width:min(480px,94vw);max-height:94vh;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 7px 0 var(--ink);animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 10px 8px 18px;font-family:var(--disp);font-weight:700;font-size:25px;border-bottom:3px dashed var(--line);border-radius:17px 17px 0 0;background:repeating-linear-gradient(180deg,#f0c48c 0 14px,#e8b77c 14px 16px)}
.mbody{padding:16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:pan-y}
.modal.barn .mpanel{width:min(780px,96vw)}
.tut.side{flex-direction:column;align-items:flex-start;max-width:230px}.tut.side .tface{width:52px;height:52px}.tut.side .tbub p{font-size:15px}
.modal.tpad{padding:6px;transition:padding .2s}.modal.tpad .mpanel{max-height:100%}
.isec{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.ihead{font-family:var(--hand);font-weight:400;font-size:20px;color:var(--ink2);text-align:center}
.igoals{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.igoal{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:8px 6px;border-radius:14px;background:var(--paper2);border:2px solid var(--line)}
.igoal .gimg,.igoal .gico{width:54px;height:54px}.igoal .gico svg{width:42px;height:42px}
.igoal b{font-size:24px;font-family:var(--disp)}.igoal small{font-size:13px;color:var(--ink2);text-align:center}
.feat{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:#fff1b8;border:2px dashed #d9a400;font-size:16px;text-align:center}
.feat svg{width:24px;height:24px;flex:none}
.itimes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.itime{display:flex;align-items:center;gap:4px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--paper2);font-size:18px}
.itime svg{width:28px;height:28px}
.icoins{display:flex;align-items:center;gap:6px;font-size:18px}.icoins svg{width:26px;height:26px}
.qrow{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;flex-wrap:wrap}
.segs{display:flex;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg{padding:7px 12px;font-size:15px;background:var(--paper2)}.seg+.seg{border-left:2px solid var(--ink)}.seg.on{background:var(--grass);color:#fff}
.bankbig{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-size:40px}.bankbig svg{width:56px;height:56px}
.iap-box{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.iap-item{display:flex;align-items:center;gap:10px;background:var(--paper2);border-radius:14px;padding:8px}
.iap-ic{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.iap-ic svg,.iap-ic img{width:48px;height:48px;object-fit:contain}
.iap-tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:16px}
.iap-tx small{font-size:13px;color:var(--muted);line-height:1.2}
.iap-buy{flex:none;min-width:88px;height:44px;padding:0 10px;border-radius:12px;font:inherit;font-size:18px;color:#fff;background:var(--grass);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.iap-buy:disabled{opacity:.6}
.iap-buy.owned{background:var(--paper);color:var(--muted);font-size:13px}
.iap-price{display:inline-flex;align-items:center;gap:5px}.iap-price img{width:20px;height:20px}.iap-price i{font-style:normal;font-size:.8em}
.lb{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.lbnote{font-family:var(--hand);font-weight:400;font-size:17px;color:var(--ink2);text-align:center}
.lbl{display:flex;flex-direction:column;gap:5px}
.lbrow{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:12px;background:var(--paper2);font-size:17px}
.lbrow.me{background:#eaffd6}.lbrow b{width:30px}.lbrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow i{display:flex;align-items:center;gap:3px;font-style:normal}.lbrow svg{width:20px;height:20px}
.lblogin{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;flex-wrap:wrap}
.free{align-self:stretch;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#e6f3ff;border:2px solid #b6d8f6}
.free>svg{width:34px;height:34px;flex:none}
.free>div{flex:1;display:flex;flex-direction:column;gap:2px;font-size:16px}.free small{font-size:13px;color:var(--ink2)}
.free.off{opacity:.65}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:14px;font-size:18px;z-index:80;animation:toastA 2.2s forwards;pointer-events:none;text-align:center;max-width:90vw}
.timg{width:32px;height:32px}
@keyframes toastA{0%{opacity:0;margin-top:10px}10%,80%{opacity:1;margin-top:0}100%{opacity:0}}
/* HUD */
.hud{position:absolute;inset:0;pointer-events:none}
.htop{position:absolute;left:8px;right:8px;top:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.hl,.hr{display:flex;gap:8px;align-items:center;flex:none}
.hl{flex-direction:column;align-items:flex-start;gap:6px}
.chip.money{min-width:120px;font-size:24px}
.chip.timer{font-size:20px}
.chip.timer.gold{background:#fff4c0}.chip.timer.silver{background:#eef1f5}.chip.timer.done{background:#f8e2cf}
.tmed{display:flex;font-style:normal}
.hshop{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sbtn{position:relative;width:78px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px;border-radius:16px;background:repeating-linear-gradient(180deg,var(--plank) 0 14px,#d79d5c 14px 16px);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.simg{width:58px;height:58px}
.sprice{position:absolute;left:-3px;right:-3px;bottom:-3px;display:flex;align-items:center;justify-content:center;gap:2px;height:26px;border-radius:0 0 14px 14px;background:var(--paper);border:3px solid var(--ink);font-size:15px;font-family:var(--disp)}
.sprice svg{width:18px;height:18px}
.sbtn.poor .simg{filter:grayscale(.8) opacity(.7)}.sbtn.poor .sprice{color:var(--red)}
.goals{position:absolute;left:8px;top:120px;display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:16px;background:rgba(255,250,234,.92);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);min-width:150px}
.gtitle{font-family:var(--hand);font-weight:400;font-size:17px;text-align:center;color:var(--ink2);line-height:1}
.gslip{position:relative;display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:10px;background:var(--paper2)}
.gslip .gimg,.gslip .gico{width:38px;height:38px;flex:none}
.gnum{font-size:15px;color:var(--ink2);white-space:nowrap}.gnum b{font-size:20px;color:var(--ink);font-family:var(--disp)}
.gok{position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--grass);color:#fff;border:2px solid var(--ink);display:none;align-items:center;justify-content:center;font-style:normal}
.gok svg{width:16px;height:16px}
.gslip.ok{background:#dff5cf}.gslip.ok .gok{display:flex}
.gslip.pulse{animation:gp .5s ease-out}
@keyframes gp{40%{transform:scale(1.12);background:#fff1a8}}
/* метки над постройками (не ловят касания: тап по ферме идёт сквозь них) */
.marks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;left:0;top:0;width:0;height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;will-change:transform}
.mk>*{flex:none}
.mtag{display:flex;align-items:center;gap:3px;padding:2px 9px 2px 4px;border-radius:999px;background:var(--paper);border:2.5px solid var(--ink);font-size:16px;white-space:nowrap;box-shadow:0 2px 0 var(--ink)}
.mtag svg{width:22px;height:22px}
.mtag b{font-size:17px}
.mtag em{display:flex;align-items:center;font-style:normal;margin-left:4px;color:var(--ink2)}.mtag em svg{width:18px;height:18px}
.mtag.hot{background:#ffe0d8;border-color:#a3281c}
.mtag.go{background:#e4f6d5}
.mtag.price{background:#fff4c0}.mtag.price.poor{background:#eee4d4;color:var(--muted)}
.mk.dim{opacity:.85}.mk.wait .mtag{opacity:.85}
.mk.pulse>*:first-child{animation:pulse 1s ease-in-out infinite}
.mbar{display:block;width:62px;height:10px;border-radius:6px;background:rgba(58,40,20,.25);border:2px solid var(--ink);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:4px}
.mbar.big{width:200px;height:16px}
.mq{display:flex;gap:3px}.mq i{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}.mq i.on{background:var(--sun)}
.min{display:flex;align-items:center;gap:1px;padding:1px 7px 1px 2px;border-radius:999px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 2px 0 var(--ink)}
.min.need{opacity:.6;border-style:dashed}.min.ready{background:#fff4c0}
.mimg{width:30px;height:30px}
.min b{font-size:15px}
.hung{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:50%;background:#fff4c0;border:2.5px solid var(--ink)}
.hung svg{width:22px;height:22px}.hung.starve{background:#ffc8bd}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.float{position:absolute;display:flex;align-items:center;gap:3px;transform:translate(-50%,-50%);font-family:var(--disp);font-weight:700;font-size:22px;color:#fff6c8;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:floatA 1.4s ease-out forwards}
.float svg{width:24px;height:24px}
@keyframes floatA{0%{opacity:0;margin-top:0}12%{opacity:1}100%{opacity:0;margin-top:-60px}}
.tipbox{position:absolute;left:50%;bottom:14px;transform:translate(-50%,20px);max-width:min(560px,80vw);padding:10px 18px;border-radius:16px;background:var(--paper);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-family:var(--hand);font-weight:400;font-size:21px;text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.tipbox.show{opacity:1;transform:translate(-50%,0)}
.tarrow{position:absolute;left:0;top:0;width:0;height:0;color:var(--red);pointer-events:none}
.tarrow svg{position:absolute;width:52px;height:52px;left:-26px;filter:drop-shadow(0 0 0 #fff) drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink))}
.tarrow.down svg{top:-62px;transform:rotate(180deg);animation:bobD .8s ease-in-out infinite}
.tarrow.up svg{top:-44px;animation:bobU .8s ease-in-out infinite}
/* стрелка слева от кнопки, смотрит вправо */
.tarrow.right svg{top:-26px;left:-56px;transform:rotate(90deg);animation:bobR .8s ease-in-out infinite}
@keyframes bobR{50%{transform:rotate(90deg) translateY(-10px)}}
@keyframes bobD{50%{transform:rotate(180deg) translateY(10px)}}
@keyframes bobU{50%{transform:translateY(10px)}}
/* амбар и машина */
.barn2{align-self:stretch;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bcol{display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px;border-radius:16px;background:var(--paper2);border:2px solid var(--line)}
.truckc{background:#e8f2fc;border-color:#bcd6ef}
.bhead{display:flex;align-items:center;gap:6px;font-family:var(--disp);font-size:20px}
.bhead svg{width:30px;height:30px}.bhead .cap{margin-left:auto;font-size:17px;color:var(--ink2)}
.ilist{display:flex;flex-direction:column;gap:6px;max-height:min(48vh,360px);overflow-y:auto;touch-action:pan-y}
.irow{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border-radius:12px;background:#fff;border:2.5px solid var(--ink);box-shadow:0 3px 0 var(--ink);text-align:left}
.irow:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.irow:disabled{opacity:.6}
.iimg{width:44px;height:44px;flex:none}
.iname{flex:1;min-width:0;display:flex;flex-direction:column;font-size:16px;line-height:1.1}
.iname small{display:flex;align-items:center;gap:2px;font-size:14px;color:var(--ink2)}.iname small svg{width:16px;height:16px}
.icnt{font-size:20px;font-family:var(--disp)}
.iall{padding:6px 8px;border-radius:10px;background:var(--grass);color:#fff;font-size:14px;border:2px solid var(--ink)}
.empty{font-family:var(--hand);font-weight:400;font-size:18px;color:var(--muted);text-align:center;padding:20px 6px}
.tsum{display:flex;align-items:center;justify-content:center;gap:5px;font-size:19px}.tsum svg{width:24px;height:24px}
.truckc .go{align-self:center}
.away{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 6px;font-size:18px}.away>svg{width:60px;height:60px}
.chain{display:flex;align-items:center;gap:10px}.cimg{width:84px;height:84px}.carr svg{width:36px;height:36px}
.cinfo{display:flex;align-items:center;gap:5px;font-size:17px;color:var(--ink2);flex-wrap:wrap;justify-content:center}.cinfo svg{width:22px;height:22px}
/* итоги */
.wmedal{display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--disp);font-size:28px}
.wmedal svg{width:110px;height:110px;animation:medal .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes medal{from{transform:scale(.2) rotate(-30deg)}}
.wrow{align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:19px;padding:6px 12px;border-radius:12px;background:var(--paper2)}
.wrow span{display:flex;align-items:center;gap:5px}.wrow svg{width:26px;height:26px}
.wrow.small{justify-content:center;gap:20px;font-size:16px;background:none;padding:0}
.wstars{display:flex;align-items:center;gap:6px;font-size:21px;color:#9a6a00}.wstars svg{width:32px;height:32px}
/* машина на дороге в город (правый нижний угол) */
.tmap{position:absolute;right:8px;bottom:8px;width:236px;padding:6px 10px 6px;border-radius:16px;background:rgba(255,250,234,.94);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:2px;pointer-events:auto;font-family:var(--disp);font-size:15px;color:var(--ink2)}
.tmap:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.tmap.ready{background:#eaffd6;animation:pulse 1.4s infinite}
.tmroad{position:relative;display:block;height:40px}
.tmline{position:absolute;left:24px;right:28px;top:27px;height:8px;border-radius:5px;background:#c99a62;border:2px solid var(--ink)}
.tmline::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:2px;background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 12px)}
.tmfarm,.tmcity{position:absolute;bottom:0;width:28px;height:28px;display:flex;font-style:normal;z-index:1}
.tmfarm{left:-2px}.tmcity{right:-4px;width:32px}
.tmfarm svg,.tmcity svg{width:100%;height:100%}
.tmt{position:absolute;bottom:9px;left:0;width:46px;height:30px;z-index:2;transition:left .2s linear}
.tmt svg{width:100%;height:100%;overflow:visible}
.tmap.away .tmt svg{animation:lcar2 .3s ease-in-out infinite alternate}
.tmt.back svg{transform:scaleX(-1)}
.tmt.empty .tmbox{display:none}
@keyframes lcar2{to{transform:translateY(-2px)}}
.tmap.away .tmt.back svg{animation:lcar3 .3s ease-in-out infinite alternate}
@keyframes lcar3{from{transform:scaleX(-1)}to{transform:scaleX(-1) translateY(-2px)}}
.tml{display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap}.tml svg{width:18px;height:18px}
/* метка мастерской: сырьё → товар */
.wk{display:flex;align-items:center;gap:2px;padding:2px 6px 2px 3px;border-radius:14px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:0 2px 0 var(--ink);white-space:nowrap}
.wk.ready{background:#fff4c0;border-color:#b07a00}
.wk.idle{opacity:.82}
.wkin{position:relative;display:flex}

#loader .car{position:absolute;bottom:12px;left:0;width:54px;height:36px;margin-left:-27px;transition:left .35s ease-out}
