/* Тропическая «бумага и дерево»: песочные панели, бирюза, коралл, тёмно-коричневый контур */
:root{--ink:#3a2a1e;--ink2:#6b4f3a;--muted:#9b8166;--paper:#fff9ec;--paper2:#f8ecd2;--line:#ead8b6;--coral:#ff7a59;--coralD:#e05d3e;--sea:#22a7c9;--seaD:#1784a3;--leaf:#55b84a;--leafD:#3f9a36;--sun:#ffcf3f;--wood:#c98b55;
--logo:Lobster,Georgia,serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#8fd6ef;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c,#t{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#t{pointer-events:none;z-index:2}
#t.on{pointer-events:auto}
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse at 50% 45%,rgba(12,52,78,.18),rgba(12,52,78,.5) 75%),linear-gradient(180deg,rgba(12,52,78,.25),rgba(12,52,78,0) 30%,rgba(12,52,78,0) 70%,rgba(12,52,78,.35))}
#shade.on{opacity:1}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#ui *{pointer-events:none}
#ui button,#ui .hit,#ui input,#ui .modal,#ui .modal *{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--sea);outline-offset:3px}
svg{display:block}
.safe{position:absolute;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative;transition:transform .08s,box-shadow .08s;font-weight:900;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:saturate(.25) brightness(1.05);opacity:.75;cursor:default}
.btn svg{width:30px;height:30px;flex:none}
.big{min-width:170px;height:64px;padding:0 26px;border-radius:20px;font-size:25px;color:#fff;background:var(--coral);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.big.green{background:var(--leaf)}
.big.sea{background:var(--sea)}
.big.sand{background:var(--paper2);color:var(--ink);text-shadow:none}
.big small{font-size:16px;opacity:.9}
.mid{height:54px;padding:0 18px;border-radius:16px;font-size:20px;color:#fff;background:var(--coral)}
.mid.green{background:var(--leaf)}
.mid.sea{background:var(--sea)}
.mid.sand{background:var(--paper2);color:var(--ink)}
.round{width:60px;height:60px;border-radius:50%;background:var(--paper)}
.round svg{width:32px;height:32px}
