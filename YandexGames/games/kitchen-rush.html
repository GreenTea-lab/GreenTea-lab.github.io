/* Кухонная канцелярия: чеки на рейке, доска мелом, деревянная вывеска, эмалированные кнопки с тёмным контуром */
:root{--ink:#3b2418;--ink2:#6e4a36;--muted:#9a7d68;--paper:#fffaf0;--paper2:#f6ead6;--line:#e8d5ba;--tomato:#ef5a3c;--basil:#58b047;--sky:#4a98dc;--butter:#ffd24a;--berry:#e8508a;--chalk:#34493f;--wood:#cf8f58;--woodD:#a8683a;
--disp:"Balsamiq Sans",Nunito,"Comic Sans MS",sans-serif;--hand:Neucha,"Balsamiq Sans",Nunito,sans-serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#ffcf9e;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer button,.layer .chip{pointer-events:auto}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--sky);outline-offset:3px}
svg{display:block}
/* кнопки: эмаль с тёмным контуром и «ступенькой» */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .08s,box-shadow .08s;font-family:var(--disp);font-weight:700;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{cursor:default}
.btn svg{width:24px;height:24px;flex:none}
.big{min-width:150px;height:56px;padding:0 22px;border-radius:16px;font-size:22px;color:#fff;background:var(--tomato)}
.big.green{background:var(--basil)}
.big.blue{background:var(--sky)}
.big svg{width:26px;height:26px}
.big.poor{filter:saturate(.4);opacity:.85}
.big.sel{background:var(--paper2);color:var(--ink2)}
.mid{height:46px;padding:0 16px;border-radius:14px;font-size:18px;color:#fff;background:var(--tomato)}
.mid.green{background:var(--basil)}
.mid.blue{background:var(--sky)}
.mid:disabled{opacity:.5}
.round{width:56px;height:56px;border-radius:50%;color:var(--ink);background:var(--paper)}
.round svg{width:28px;height:28px}
.round.small{width:46px;height:46px}
.round.small svg{width:22px;height:22px}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 12px 3px 5px;font-size:19px;box-shadow:0 3px 0 var(--ink);font-family:var(--disp);font-weight:700}
.chip svg{width:28px;height:28px}
.chip small{font-size:13px;color:var(--muted)}
.chip.coins{cursor:pointer}
.chip .plus{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--basil);border:2px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;margin-left:2px}
.topbar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.tb-l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
/* меню: деревянная вывеска на верёвках */
.menu-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;padding:70px 12px 18px}
.menu-c .spacer{flex:1}
.logo{position:absolute;left:0;right:0;top:9%;display:flex;justify-content:center;pointer-events:none}
.sign{position:relative;padding:14px 30px 18px;background:repeating-linear-gradient(180deg,#d89a60 0 15px,#c98a52 15px 17px,#d89a60 17px 34px);border:4px solid var(--ink);border-radius:16px;box-shadow:0 7px 0 var(--ink);transform:rotate(-2.5deg);max-width:94vw;animation:sway 4s ease-in-out infinite;transform-origin:50% -60px}
@keyframes sway{50%{transform:rotate(-1deg)}}
.sign .rope{position:absolute;top:-62px;width:4px;height:62px;background:var(--ink);border-radius:2px}
.sign .rope.l{left:22%}.sign .rope.r{right:22%}
.logo-t{font-family:var(--disp);font-weight:700;font-size:clamp(36px,7.4vw,76px);line-height:1;color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);text-align:center}
.logo-s{position:absolute;left:-18px;top:-26px;width:58px;height:58px;color:#fff;transform:rotate(-18deg);filter:drop-shadow(2px 0 0 var(--ink)) drop-shadow(-2px 0 0 var(--ink)) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 -2px 0 var(--ink))}
.logo-s svg{width:100%;height:100%}
.play{height:70px;min-width:240px;font-size:32px}
.play svg{width:30px;height:30px}
.gift.ready{background:var(--berry);color:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
/* уровни: карточки рецептов на скотче */
.panel-c{position:absolute;left:0;right:0;top:66px;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 10px 14px;overflow:hidden}
.ttl{font-family:var(--disp);font-weight:700;font-size:clamp(28px,5vw,40px);color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab{pointer-events:auto;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:12px;font-family:var(--disp);font-weight:700;font-size:16px;color:var(--ink2);background:var(--paper2);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--c1);color:var(--ink);transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}
.tab.locked{opacity:.7}
.tab svg{width:16px;height:16px}
.lcards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:14px 6px 12px;max-width:min(1000px,100%)}
.lcard{pointer-events:auto;position:relative;width:clamp(150px,17vw,176px);display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 8px 10px;border-radius:6px;color:var(--ink);background:linear-gradient(var(--c1) 0 10px,transparent 10px),repeating-linear-gradient(180deg,var(--paper) 0 23px,var(--line) 23px 24px);border:3px solid var(--ink);box-shadow:0 5px 0 rgba(59,36,24,.35);transform:rotate(-1.2deg)}
.lcard:nth-child(2n){transform:rotate(1.1deg)}
.lcard:nth-child(3n){transform:rotate(-.4deg)}
.lcard::before{content:"";position:absolute;top:-12px;left:50%;width:62px;height:20px;margin-left:-31px;background:rgba(255,236,170,.85);border:1px solid rgba(160,120,60,.3);transform:rotate(-3deg)}
.lcard:active{transform:scale(.97)}
.lnum{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1}
.ldish{display:flex;justify-content:center;gap:2px;min-height:58px;align-items:center;align-self:stretch}
.ldish img{width:52px;height:52px}
.lstars{display:flex;gap:2px}
.st svg{width:26px;height:26px}
.st.sm svg{width:18px;height:18px}
.lbest{font-family:var(--hand);font-weight:400;font-size:16px;white-space:nowrap}
.lbest .muted{font-size:15px}
.llock{background:var(--paper2);border:3px solid var(--ink);border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.llock svg{width:22px;height:22px}
.lcard.locked{filter:grayscale(.7);opacity:.85}
.lcard.locked .ldish{opacity:.45}
/* окно уровня */
.intro .mpanel{width:min(540px,95vw)}
.isec{align-self:stretch;display:flex;flex-direction:column;gap:8px}
.ihead{font-family:var(--hand);font-weight:400;font-size:19px;color:var(--ink2)}
.rcp{display:flex;align-items:center;gap:10px;background:var(--paper2);border-radius:12px;padding:6px 10px 6px 4px}
.rimg{width:66px;height:66px;flex:none}
.rtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.rtx b{font-family:var(--disp);font-weight:700;font-size:18px}
.rtx small{font-size:12px;color:var(--muted)}
.rparts{display:flex;align-items:center;flex-wrap:wrap}
.part{position:relative;display:inline-block}
.pimg{width:36px;height:36px;display:block}
.tbadge{position:absolute;right:-4px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--paper);border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tbadge svg{width:11px;height:11px}
.tbadge.pot{background:#ffe2a8}.tbadge.pan{background:#ffd0c4}
.plus-s{color:var(--muted);font-size:14px;margin:0 2px}
.tools{display:flex;flex-wrap:wrap;gap:3px}
.tool{display:inline-flex;align-items:center;gap:2px;font-family:var(--hand);font-weight:400;font-size:14px;line-height:1;padding:2px 6px 2px 3px;border-radius:8px;background:#efe2cc;color:var(--ink)}
.tool svg{width:13px;height:13px}
.tool.pot{background:#ffe2a8}.tool.pan{background:#ffd0c4}
.tool em{font-style:normal}
.feats{align-self:stretch;display:flex;flex-direction:column;gap:5px}
.feat{font-family:var(--hand);font-weight:400;font-size:17px;background:#fff3c8;border-left:5px solid var(--butter);border-radius:4px;padding:5px 10px;color:var(--ink)}
.igoals{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.goal,.itime{display:flex;align-items:center;gap:4px;background:var(--paper2);border-radius:10px;padding:4px 10px;font-family:var(--disp);font-weight:700;font-size:17px}
.itime svg{width:22px;height:22px;color:var(--ink2)}
.mode{display:flex;align-items:center;gap:10px;font-size:16px;align-self:stretch;justify-content:space-between}
.coopkeys{align-self:stretch;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--ink2);background:var(--paper2);border-radius:10px;padding:6px 10px}
.coopkeys div{display:flex;align-items:center;gap:6px}
.coopkeys.off{display:none}
/* кухня */
.kitchen-c{position:absolute;left:0;right:0;top:64px;bottom:0;display:flex;flex-direction:column;align-items:center;padding:0 10px 12px;gap:8px}
.kspace{flex:1;min-height:150px}
.kpanel{pointer-events:auto;width:min(560px,96vw);max-height:58vh;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.ktabs{display:flex;gap:6px;padding:8px 8px 0;background:var(--paper2);border-bottom:3px solid var(--ink)}
.ktab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;font-family:var(--disp);font-weight:700;font-size:17px;color:var(--ink2);border:3px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;margin-bottom:-3px}
.ktab svg{width:20px;height:20px}
.ktab.on{background:var(--paper);color:var(--ink);border-color:var(--ink)}
.kbody>*{flex:none}
.kbody{padding:10px 12px;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px}
.uprow{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:2px dashed var(--line)}
.uprow:last-child{border-bottom:0}
.upic{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--paper2);border:2px solid var(--ink);color:var(--tomato)}
.upic svg{width:26px;height:26px}
.uptx{flex:1;display:flex;flex-direction:column;min-width:0;font-size:15px;line-height:1.15}
.uptx b{font-family:var(--disp);font-weight:700}
.uptx small{font-family:var(--hand);font-weight:400;font-size:15px;color:var(--ink2)}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:16px;height:8px;border-radius:4px;background:var(--line);border:1.5px solid rgba(59,36,24,.35)}
.pips i.on{background:var(--butter);border-color:var(--ink)}
.upg{height:42px;padding:0 10px;border-radius:12px;font-size:16px;color:#fff;background:var(--basil);min-width:100px}
.upg svg{width:18px;height:18px}
.upg.poor{filter:grayscale(.6);opacity:.75}
.upg.max{background:var(--paper2);color:var(--muted)}
.slots{align-self:center}
.seg.slot{display:flex;align-items:center;gap:6px;padding:7px 14px}
.apdot{width:14px;height:14px;border-radius:50%;background:var(--ap);border:2px solid var(--ink);display:inline-block;flex:none}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ccard{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px;border-radius:14px;background:var(--paper2);border:3px solid transparent;font-family:var(--disp);font-weight:700;font-size:14px}
.ccard.sel{border-color:var(--ink);background:#fff1c8}
.ccard.notown .cimg{filter:grayscale(.5) brightness(.92)}
.cimg{width:72px;height:72px}
.ccard .price{display:flex;align-items:center;gap:3px;font-size:13px}
.ccard .price svg{width:16px;height:16px}
.ccard .price.poor{opacity:.6}
.inslot{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.ccard .muted{font-size:12px}
/* окна: листок бумаги на скотче */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(59,36,24,.45);pointer-events:auto}
.mpanel{position:relative;width:min(480px,94vw);max-height:92vh;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 var(--ink);animation:pop .2s ease-out}
.mpanel::before{content:"";position:absolute;top:-14px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(255,236,170,.9);border:1px solid rgba(160,120,60,.35);transform:rotate(2deg);z-index:2}
@keyframes pop{0%{transform:scale(.88);opacity:0}100%{transform:scale(1);opacity:1}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 12px 10px 18px;font-family:var(--disp);font-weight:700;font-size:24px;color:var(--ink);border-bottom:3px dashed var(--line)}
.mhead b{font-weight:700}
.mhead .round{box-shadow:0 3px 0 var(--ink)}
.mbody{padding:16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:pan-y}
.qrow{display:flex;align-items:center;gap:10px;align-self:stretch;justify-content:space-between;font-size:17px}
.segs{display:flex;border-radius:12px;overflow:hidden;border:3px solid var(--ink)}
.seg{padding:6px 12px;font-family:var(--disp);font-weight:700;font-size:15px;color:var(--ink2);background:var(--paper2)}
.seg+.seg{border-left:2px solid var(--ink)}
.seg.on{background:var(--butter);color:var(--ink)}
.ctrl{align-self:stretch;display:flex;flex-direction:column;gap:2px;font-size:16px}
.ctrl small{color:var(--ink2);font-size:13px;line-height:1.35}
.lb{align-self:stretch;display:flex;flex-direction:column;gap:5px;min-height:120px}
.lbnote{font-family:var(--hand);font-weight:400;font-size:16px}
.lbrow{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;background:var(--paper2);font-size:17px}
.lbrow b{width:28px;text-align:center;font-family:var(--disp)}
.lbrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbrow i{font-style:normal;font-family:var(--disp);font-variant-numeric:tabular-nums}
.lbrow.me{background:#fff1c8;box-shadow:inset 0 0 0 2px var(--ink)}
.lblogin{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:14px;color:var(--muted)}
.free{align-self:stretch;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#eef8e2;border:2px dashed var(--basil)}
.free>svg{width:44px;height:44px;flex:none}
.free div{flex:1;display:flex;flex-direction:column;font-size:16px}
.free small{font-size:12px;color:var(--muted)}
.free.off{opacity:.6}
.iap-box{display:flex;flex-direction:column;gap:8px;align-self:stretch}
.iap-item{display:flex;align-items:center;gap:10px;background:var(--paper2);border-radius:14px;padding:8px}
.iap-ic{width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center}
.iap-ic svg,.iap-ic img{width:48px;height:48px;object-fit:contain}
.iap-tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:15px}
.iap-tx small{font-size:12px;color:var(--muted);line-height:1.2}
.iap-buy{flex:none;min-width:84px;height:42px;padding:0 10px;border-radius:12px;font:inherit;font-size:17px;color:#fff;background:var(--basil);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer}
.iap-buy:disabled{opacity:.6}
.iap-buy.owned{background:var(--paper);color:var(--muted);font-size:13px}
.iap-price{display:inline-flex;align-items:center;gap:5px}
.iap-price img{width:20px;height:20px}
.iap-price i{font-style:normal;font-size:.8em}
.gift-big svg{width:90px;height:90px;color:var(--berry);filter:drop-shadow(0 4px 0 var(--ink))}
.gamount{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:38px}
.gamount svg{width:40px;height:40px}
.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-size:17px;z-index:80;animation:toastA 2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* HUD: чеки заказов на рейке */
.hud{position:absolute;inset:0;pointer-events:none}
.hud button{pointer-events:auto}
.orders{position:absolute;left:8px;top:6px;max-width:calc(100% - 260px);min-width:120px;display:flex;gap:10px;align-items:flex-start;padding:10px 6px 0;min-height:24px}
.orders::before{content:"";position:absolute;left:0;right:0;top:4px;height:9px;border-radius:5px;background:linear-gradient(#e8ecf2,#aab2c0);border:2px solid var(--ink)}
.ocard{position:relative;flex:0 1 100px;min-width:60px;background:var(--paper);display:flex;flex-direction:column;align-items:center;padding:8px 5px 6px;transform:rotate(var(--rot,0deg));transform-origin:50% 0;filter:drop-shadow(0 3px 0 rgba(59,36,24,.35));transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .35s}
.ocard::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:8px;background:linear-gradient(-45deg,transparent 5px,var(--paper) 0),linear-gradient(45deg,transparent 5px,var(--paper) 0);background-size:10px 8px;background-position:left bottom}
.ocard .clip{position:absolute;top:-8px;left:50%;width:22px;height:14px;margin-left:-11px;border-radius:4px;background:#c9ced8;border:2px solid var(--ink)}
.ocard.new{transform:translateY(-110px) rotate(var(--rot,0deg));opacity:0}
.ocard.served{transform:translateY(-30px) scale(1.12);opacity:0;transition:transform .4s,opacity .4s}
.ocard.gone{transform:translateY(24px) rotate(-10deg);opacity:0;filter:grayscale(1)}
.ocard.hurry{animation:shake .5s infinite}
@keyframes shake{25%{transform:rotate(calc(var(--rot,0deg) - 4deg))}75%{transform:rotate(calc(var(--rot,0deg) + 4deg))}}
.obar{align-self:stretch;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.obar i{display:block;height:100%;width:100%;border-radius:4px;background:var(--basil)}
.odish{width:62px;height:62px;max-width:100%;object-fit:contain}
.oname{font-family:var(--hand);font-weight:400;font-size:15px;line-height:1.05;text-align:center;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:-2px 0 3px}
.oparts{display:flex;justify-content:center;flex-wrap:wrap;gap:1px;padding:1px 2px;border-top:2px dashed var(--line);padding-top:3px}
.opimg{width:24px;height:24px;display:block}
.ocard .tbadge{width:14px;height:14px;right:-3px;bottom:-2px;border-width:1.5px}
.ocard .tbadge svg{width:9px;height:9px}
.ocard .tools{justify-content:center;margin-top:4px}
.ocard .tool{font-size:13px;padding:1px 5px 1px 2px}
.ocard .tool svg{width:12px;height:12px}
.h-tr{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hrow{display:flex;gap:10px;align-items:center}
.timer{position:relative;width:70px;height:70px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);background:conic-gradient(var(--tomato) var(--p,100%),var(--paper2) 0);display:flex;align-items:center;justify-content:center}
.timer::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.timer::after{content:"";position:absolute;top:-9px;left:50%;width:14px;height:8px;margin-left:-7px;border-radius:3px 3px 0 0;background:var(--ink)}
.timer b{position:relative;font-family:var(--disp);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.timer.low b{color:var(--tomato)}
.timer.low{animation:pulse 1s infinite}
.score{position:relative;display:flex;flex-direction:column;align-items:center;min-width:92px;padding:3px 12px 5px;background:var(--chalk);border:4px solid var(--wood);border-radius:8px;box-shadow:0 0 0 2px var(--ink),0 5px 0 var(--ink);color:#f4f1e6}
.score small{font-family:var(--hand);font-weight:400;font-size:13px;opacity:.75;line-height:1}
.score b{font-family:var(--hand);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.combo{position:absolute;right:-12px;top:-12px;font-style:normal;font-family:var(--disp);font-size:14px;background:var(--berry);color:#fff;border:2px solid var(--ink);border-radius:10px;padding:0 6px;opacity:0;transform:scale(.5);transition:all .2s}
.combo.on{opacity:1;transform:rotate(8deg)}
.hstars{display:flex;align-items:center;gap:2px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:2px 8px}
.hstars small{font-family:var(--disp);font-size:13px;color:var(--ink2);margin-left:4px}
.ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ov{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform}
.ovi{display:flex;gap:1px;background:var(--paper);border:2px solid var(--ink);border-radius:10px;padding:2px 3px;position:relative}
.ovi img,.ovi i{width:26px;height:26px;display:block}
.ovi i{border-radius:50%;background:var(--line);transform:scale(.55)}
.ovi .ok{position:absolute;right:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--basil);color:#fff;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center}
.ovi .ok svg{width:12px;height:12px}
.ovb{width:46px;height:9px;border-radius:5px;background:var(--paper);border:2px solid var(--ink);overflow:hidden;box-sizing:content-box}
.ovb i{display:block;height:100%;width:0}
.ovw,.ovx{width:28px;height:28px;border-radius:50%;background:var(--tomato);color:#fff;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:17px;animation:pulse .5s infinite}
.ovx{background:#5a4a4a;animation:none}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);font-weight:700;font-size:22px;color:var(--paper);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;white-space:nowrap;animation:floatA 1.4s ease-out forwards;pointer-events:none}
.float.f-big{font-size:34px;color:var(--butter)}
.float.f-tip{font-family:var(--hand);font-weight:400;font-size:22px;color:#b8f59e;-webkit-text-stroke:4px var(--ink)}
.float.f-combo{font-size:20px;color:#ffb0cf}
.float.f-bad{font-size:18px;color:#ffb0a0}
@keyframes floatA{0%{opacity:0;margin-top:10px;scale:.6}15%{opacity:1;margin-top:0;scale:1.1}25%{scale:1}100%{opacity:0;margin-top:-60px}}
.hmiss{position:absolute;left:50%;top:160px;transform:translateX(-50%);font-family:var(--hand);font-weight:400;font-size:20px;color:#fff;background:var(--tomato);border:2px solid var(--ink);padding:5px 14px;border-radius:10px;animation:toastA 1.6s forwards;white-space:nowrap}
.count{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--disp);font-weight:700;font-size:clamp(50px,10vw,100px);color:var(--paper);-webkit-text-stroke:9px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);opacity:0;pointer-events:none}
.count.show{animation:cnt 2.1s ease-out forwards}
.count.go{color:var(--butter);animation:cnt 1.1s ease-out forwards}
@keyframes cnt{0%{opacity:0;transform:scale(1.8) rotate(-6deg)}15%{opacity:1;transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.banner-box{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none}
.banner{display:inline-block;font-family:var(--disp);font-weight:700;font-size:clamp(30px,6vw,50px);color:var(--paper);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:bannerA 2.4s ease forwards}
@keyframes bannerA{0%{opacity:0;transform:scale(1.6)}12%{opacity:1;transform:scale(1) rotate(-2deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.hint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:max-content;max-width:min(560px,92vw);text-align:center;font-family:var(--hand);font-weight:400;font-size:21px;line-height:1.2;color:var(--ink);background:#fff6c4;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:9px 18px;border-radius:4px 14px 4px 14px;opacity:0;transition:opacity .3s;pointer-events:none}
.hint.show{opacity:1;animation:hintA 1.6s ease-in-out infinite}
@keyframes hintA{50%{transform:translateX(-50%) translateY(-4px)}}
.keys-hint{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;font-size:12px;color:var(--paper);background:rgba(59,36,24,.6);padding:3px 10px;border-radius:8px;white-space:nowrap}
.keys-hint.coop{display:flex;gap:18px}
.keys-hint.coop span{display:flex;align-items:center;gap:5px}
.keys-hint .apdot{width:11px;height:11px;border-color:var(--paper)}
.jzone{position:absolute;left:0;bottom:0;width:55%;height:55%;pointer-events:auto;touch-action:none}
.jbase{position:absolute;left:90px;top:calc(100% - 110px);width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(255,250,240,.35);border:3px solid rgba(59,36,24,.7)}
.jbase.on{background:rgba(255,250,240,.5)}
.jknob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
.tc-r{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}
.tbtn{pointer-events:auto;width:84px;height:84px;border-radius:50%;color:var(--ink);background:rgba(255,250,240,.82);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;gap:1px;font-family:var(--disp);font-weight:700}
.tbtn svg{width:34px;height:34px}
.tbtn small{font-size:12px}
.tbtn.on{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tbtn.pick{grid-column:2;grid-row:2;width:96px;height:96px;background:rgba(88,176,71,.88);color:#fff}
.tbtn.act{grid-column:1;grid-row:2;background:rgba(74,152,220,.88);color:#fff}
.tbtn.sw{grid-column:2;grid-row:1;width:64px;height:64px;justify-self:center}
.tbtn.sw svg{width:26px;height:26px}
/* итоги: чек из кассы */
.results{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(59,36,24,.35)}
.results button{pointer-events:auto}
.rpanel{pointer-events:auto;position:relative;width:min(400px,94vw);max-height:94%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--paper);padding:18px 18px 22px;filter:drop-shadow(0 6px 0 rgba(59,36,24,.45));animation:printA .5s ease-out}
.rpanel.receipt{-webkit-mask:linear-gradient(-45deg,transparent 6px,#000 0) bottom left/12px 51% repeat-x,linear-gradient(45deg,transparent 6px,#000 0) bottom left/12px 51% repeat-x,linear-gradient(-135deg,transparent 6px,#000 0) top left/12px 51% repeat-x,linear-gradient(135deg,transparent 6px,#000 0) top left/12px 51% repeat-x;mask:linear-gradient(-45deg,transparent 6px,#000 0) bottom left/12px 51% repeat-x,linear-gradient(45deg,transparent 6px,#000 0) bottom left/12px 51% repeat-x,linear-gradient(-135deg,transparent 6px,#000 0) top left/12px 51% repeat-x,linear-gradient(135deg,transparent 6px,#000 0) top left/12px 51% repeat-x}
@keyframes printA{0%{transform:translateY(-40px);opacity:0}100%{transform:none;opacity:1}}
.rhead{display:flex;flex-direction:column;align-items:center;gap:0;padding-bottom:6px;border-bottom:2px dashed var(--line);align-self:stretch}
.rhead b{font-family:var(--disp);font-weight:700;font-size:24px;color:var(--tomato)}
.rhead span{font-family:var(--hand);font-weight:400;font-size:17px;color:var(--ink2)}
.bstars{display:flex;gap:4px;align-items:flex-end}
.bstar{position:relative;width:66px;height:66px;display:block}
.bstar.s1{width:82px;height:82px;margin-bottom:10px}
.bstar svg{width:100%;height:100%}
.bstar b{position:absolute;inset:0;transform:scale(0) rotate(-40deg);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.bstar.on b{transform:scale(1)}
