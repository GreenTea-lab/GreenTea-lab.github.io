html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",Arial,sans-serif;font-weight:500;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button[disabled]{cursor:default}
.hidden{display:none!important}
.ic{width:1.3em;height:1.3em;flex:none;display:block}
#sky,#petals,#fx{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#fx{z-index:70}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.view{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.muted{color:var(--muted)}
.small{font-size:.95rem!important}
.ctr{text-align:center}

/* ---------- кнопки ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:.55em;min-height:3.3em;padding:.5em 1.2em;border-radius:1.1em;font-size:1.15rem;font-weight:800;line-height:1.15;text-align:center;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn .ic{width:1.45em;height:1.45em}
.btn small{display:flex;align-items:center;justify-content:center;gap:.2em;font-weight:500;font-size:.82em;opacity:.85}
.btn small .ic{width:1.1em;height:1.1em}
.b-gold{background:linear-gradient(180deg,#f0c873,var(--gold));color:var(--goldInk);box-shadow:0 4px 0 var(--goldD),0 10px 24px var(--shadow)}
:root[data-gtheme="contrast"] .b-gold{background:var(--gold)}
.b-glass{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1.5px var(--panelLine) inset,0 6px 18px var(--shadow);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.btn[disabled]{opacity:.5;pointer-events:none}
.ibtn{position:relative;width:3em;height:3em;border-radius:1em;display:grid;place-items:center;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset;color:var(--ink);flex:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ibtn .ic{width:1.6em;height:1.6em}
.ibtn:active{transform:translateY(2px)}
.ibtn[disabled]{opacity:.35}
.ibtn .dot{position:absolute;top:-.3em;right:-.3em;min-width:1.4em;height:1.4em;padding:0 .3em;border-radius:.7em;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:.8em;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.chip{display:flex;align-items:center;gap:.4em;height:3em;padding:0 .9em 0 .55em;border-radius:1.5em;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset;font-weight:800;font-size:1.12em;flex:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.chip .ic{width:1.6em;height:1.6em}
.chip.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.12)}}

.bar{display:flex;align-items:center;gap:.55em;padding:.6em .75em;flex:none;position:relative;z-index:2}
.bar .sp{flex:1}
.bar .ttl{flex:1;min-width:0;text-align:center;font-family:"Yeseva One",Georgia,serif;font-size:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px var(--shadow)}
.backbtn{display:flex;align-items:center;gap:.3em;height:3em;padding:0 .9em 0 .5em;border-radius:1em;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset;font-weight:800;font-size:1.02em;flex:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.backbtn .ic{width:1.6em;height:1.6em}
.gprog{display:flex;align-items:center;gap:.5em;font-size:.85em;font-weight:500;color:var(--muted);margin-top:.2em;font-variant-numeric:tabular-nums}
.gprog{white-space:nowrap}
.gprog i{flex:1;min-width:1.5em;height:.42em;border-radius:1em;background:var(--glass);overflow:hidden;max-width:9em}
.gprog i b{display:block;height:100%;background:var(--gold);border-radius:1em}

/* ---------- меню ---------- */
#menu{align-items:center;overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
#menu .bar{width:100%}
.mwrap{width:min(30rem,100%);display:flex;flex-direction:column;align-items:center;gap:.8rem;padding:0 1rem 1.5rem;margin:auto 0}
.mhead{display:flex;flex-direction:column;align-items:center;gap:.7rem}
.logo{width:auto;height:min(8.5rem,16vh);filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.mt{font-family:"Yeseva One",Georgia,serif;font-size:2.7rem;line-height:1;text-align:center;text-shadow:0 3px 14px rgba(0,0,0,.5)}
.mt span{display:flex;align-items:center;justify-content:center;gap:.6rem;font-family:"Alegreya Sans",sans-serif;font-weight:800;font-size:1.05rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-top:.55rem}
.mt span::before,.mt span::after{content:"";width:2.2rem;height:1.5px;background:var(--gold);opacity:.7}
.msub{color:var(--muted);font-size:1.12rem;text-align:center;text-shadow:0 2px 8px var(--shadow)}
.mbtns{width:100%;display:flex;flex-direction:column;gap:.7rem;margin-top:.3rem}
.mbtns .btn{width:100%;min-height:3.6rem;font-size:1.25rem}
.mbtns .m-play{min-height:4.1rem}
.mbtns .row{display:flex;gap:.7rem}
.mbtns .row .btn{flex:1;font-size:1.1rem;min-width:0;min-height:3.2rem}
.btn-left{justify-content:flex-start;text-align:left;padding-left:1rem}
.btn-left .dl{flex:1;min-width:0}
.btn-left .dl small{justify-content:flex-start}
.btn-left>.ic{width:2rem;height:2rem;color:var(--gold)}
.btn-left .tick{width:1.6rem;height:1.6rem;color:var(--green)}
.btn-left .tick .ic{width:1.6rem;height:1.6rem}
body.wide .mwrap{width:min(60rem,100%);flex-direction:row;align-items:center;gap:3rem;padding:0 2rem 1.5rem}
body.wide .mhead{flex:1}
body.wide .mbtns{flex:1;max-width:28rem}
body.wide .logo{height:min(11rem,26vh)}

/* ---------- экраны со списками ---------- */
.scroll{flex:1;overflow-y:auto;touch-action:pan-y;padding:.25rem .75rem 1.5rem;position:relative;z-index:1}
.inner{width:min(48rem,100%);margin:0 auto}
.cic{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;background:var(--cc);color:#fff;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.cic .ic{width:1.9rem;height:1.9rem}
.pathlist{display:flex;flex-direction:column;gap:.7rem}
.gcard{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;border-radius:1.2rem;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset,0 8px 22px var(--shadow);text-align:left;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.gcard:active{transform:translateY(2px)}
.gcard .gtx{flex:1;min-width:0}
.gcard b{display:block;font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:1.3rem}
.gcard small{display:block;color:var(--muted);font-size:.98rem;margin-top:.1rem}
.gcard .gprog i{max-width:none}
.gcard .gst{display:flex;align-items:center;gap:.25em;font-weight:800;font-size:1.05rem;color:var(--gold);font-variant-numeric:tabular-nums}
.gcard .gst .ic{width:1.2em;height:1.2em}
.gcard.cur{box-shadow:0 0 0 2.5px var(--gold) inset,0 8px 22px var(--shadow)}
.gcard.lock{opacity:.55}
.gcard.lock .cic{background:var(--glass);color:var(--muted)}
.chap{background:var(--panel);border-radius:1.3rem;box-shadow:0 0 0 1.5px var(--panelLine) inset,0 10px 30px var(--shadow);padding:1rem;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chh{display:flex;align-items:center;gap:.8rem;margin-bottom:.6rem}
.chh b{display:block;font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:1.35rem}
.chh small{display:flex;flex-wrap:wrap;align-items:center;gap:.15em;color:var(--muted);font-size:1rem;margin-top:.15rem}
.chh small .ic{width:1em;height:1em;color:var(--gold)}
.gdesc{margin:.2rem 0 .9rem;color:var(--muted);font-size:1.02rem;line-height:1.35}
.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:.45rem}
.tile{aspect-ratio:1/1.1;border-radius:.8rem;background:var(--glass);box-shadow:0 0 0 1.5px var(--panelLine) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05rem;font-weight:800;font-size:1.1rem;position:relative;overflow:hidden;font-variant-numeric:tabular-nums}
.tile:active{transform:translateY(2px)}
.tile .st{display:flex;gap:0}
.tile .st span{color:rgba(255,255,255,.18);display:block}
.tile .st span.on{color:var(--gold)}
.tile .st .ic{width:.72rem;height:.72rem}
.tile .tb{position:absolute;left:22%;right:22%;bottom:0;height:.22rem;border-radius:.2rem .2rem 0 0;background:var(--tc);opacity:.9}
.tile .km{position:absolute;top:.15rem;left:.2rem;color:var(--sakura);font-style:normal}
.tile .km .ic{width:.8rem;height:.8rem}
.tile.done{background:color-mix(in srgb,var(--cc) 30%,transparent)}
.tile.cur{background:var(--gold);color:var(--goldInk);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.tile.cur .km{color:var(--goldInk)}
.tile.lock{opacity:.4;color:var(--muted)}
.tile.lock>.ic{width:1.1rem;height:1.1rem}
.tile .ip{position:absolute;top:.3rem;right:.3rem;width:.5rem;height:.5rem;border-radius:50%;background:var(--sakura)}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.8rem;color:var(--muted);font-size:.95rem}
.legend span{display:flex;align-items:center;gap:.35rem}
.legend .km{color:var(--sakura);font-style:normal}
.legend .km .ic{width:1rem;height:1rem}

.qwrap{display:flex;flex-direction:column;gap:.8rem}
.ktabs{display:flex;gap:.4rem;background:var(--panel);padding:.35rem;border-radius:1.1rem;box-shadow:0 0 0 1.5px var(--panelLine) inset}
.ktabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.55rem .2rem;border-radius:.8rem;font-weight:800;font-size:1rem;line-height:1.1;color:var(--muted)}
.ktabs button .ic{width:1.5rem;height:1.5rem}
.ktabs button.on{background:var(--gold);color:var(--goldInk)}
.qwrap .gdesc{margin:0 .2rem}
.qlist{display:flex;flex-direction:column;gap:.6rem}
.qrow{display:flex;align-items:center;gap:.9rem;padding:.8rem 1rem;border-radius:1.1rem;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset,0 6px 18px var(--shadow);text-align:left;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.qrow:active{transform:translateY(2px)}
.qdot{width:1.1rem;height:1.1rem;border-radius:50%;background:var(--cc);flex:none;display:inline-block;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.qtx{flex:1;min-width:0}
.qtx b{display:block;font-size:1.25rem;font-weight:800}
.qtx small{display:block;color:var(--muted);font-size:1rem;line-height:1.25}
.qtx small.qs{font-size:.92rem;opacity:.85;margin-top:.15rem}
.qgo{display:flex;align-items:center;gap:.3rem;color:var(--gold);font-weight:800}
.qgo .ic{width:1.5rem;height:1.5rem}

/* ---------- игра ---------- */
#game{font-size:18px}
.gbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:.55em;padding:0 .65em .65em;position:relative;z-index:1}
.info{display:flex;align-items:center;justify-content:center;gap:.5em;flex:none;flex-wrap:nowrap;max-width:100%;min-width:0}.info .pill{flex:none}.info .pill.diff{flex:0 1 auto;min-width:0}
.pill{display:flex;align-items:center;gap:.35em;height:2.2em;padding:0 .85em;border-radius:1.1em;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset;font-weight:800;font-size:.98em;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill .ic{width:1.15em;height:1.15em;color:var(--gold)}
.pill.diff{background:var(--cc,var(--gold));box-shadow:none;color:#fff;max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:2.2em}
.pill.mist .ic{color:var(--red)}
.g-time{cursor:pointer}
.g-time.on{background:var(--gold);color:var(--goldInk)}
.g-time.on .ic{color:var(--goldInk)}
.g-time.notimer span{display:none}
.boardbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.board{position:relative;display:grid;background:var(--paper);border-radius:.6em;box-shadow:0 0 0 3px var(--gridBox),0 0 0 7px rgba(227,180,90,.35),0 18px 50px rgba(0,0,0,.45);overflow:hidden;transition:filter .2s;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.55),transparent 60%),radial-gradient(ellipse at 80% 90%,var(--paper2),transparent 70%)}
.board.blur{filter:blur(12px)}
.cell{--rw:1px;--rc:var(--grid);--bw:1px;--bc:var(--grid);position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset calc(-1*var(--rw)) 0 0 var(--rc),inset 0 calc(-1*var(--bw)) 0 var(--bc);transition:background-color .12s;font-family:"Noto Serif",Georgia,serif;font-weight:700;color:var(--user);line-height:1}
.cell.rt{--rw:2.5px;--rc:var(--gridBox)}
.cell.rn{--rw:0px}
.cell.bt{--bw:2.5px;--bc:var(--gridBox)}
.cell.bn{--bw:0px}
.cell.dg{background:var(--diag)}
.cell.g{color:var(--given)}
.cell.rev{color:var(--rev)}
.cell.peer{background:var(--peer)}
.cell.h-area{background:var(--harea)}
.cell.same{background:var(--same)}
.cell.h-focus{background:var(--hfocus)}
.cell.h-elim{background:var(--helim)}
.cell.sel{background:var(--sel)}
.cell.h-target{background:var(--sel);animation:tpulse 1.1s ease-in-out infinite}
@keyframes tpulse{50%{box-shadow:inset 0 0 0 4px var(--goldD)}}
.cell.bad{color:var(--bad);background:var(--badBg)}
.cell.bad.sel{background:#ffb9a8}
.cell .v{position:relative;z-index:1}
.cell .nt{position:absolute;inset:6%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-family:"Alegreya Sans",sans-serif;font-weight:800;color:var(--note);line-height:1;font-size:var(--nf)}
.board[data-n="6"] .nt{grid-template-rows:repeat(2,1fr)}
.cell .nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.cell .nt i.hl{color:#fff;background:var(--goldD);border-radius:30%}
.cell.pop .v{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.3)}}
.cell.wave{animation:wave .9s both}
@keyframes wave{0%{background-color:var(--paper)}35%{background-color:#ffe09a}100%{}}
.cell.hint .v{animation:hint 1s}
@keyframes hint{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}}
.board.won .cell{animation:wave 1.2s both}
.diagsvg{position:absolute;pointer-events:none;overflow:visible}
.diagsvg path{stroke:var(--sakura);stroke-width:.35;opacity:.55;fill:none;vector-effect:non-scaling-stroke;stroke-width:2;stroke-dasharray:6 6}
.pausecover{position:absolute;inset:0;display:grid;place-items:center;z-index:3}
.pausecover>div{display:flex;flex-direction:column;align-items:center;gap:.8em;background:var(--paper);color:var(--given);padding:1.4em 2em;border-radius:1.2em;box-shadow:0 0 0 2px var(--gold),0 20px 50px rgba(0,0,0,.5)}
.pausecover>div>.ic{width:2.6em;height:2.6em;color:var(--goldD)}
.pausecover b{font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:1.8em}

.gright{position:relative}
.tools{flex:none;display:flex;gap:.5em}
.tool{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;height:3.7em;border-radius:1em;background:var(--panel);box-shadow:0 0 0 1.5px var(--panelLine) inset;font-weight:800;font-size:.92em;line-height:1.05;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tool:active{transform:translateY(2px)}
.tool .ic{width:1.55em;height:1.55em;color:var(--gold)}
.tool .tr{display:flex;align-items:center;gap:.25em}
.tool .tl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .cost{display:flex;align-items:center;gap:.08em;font-size:.8em;color:var(--gold)}
.tool .cost .ic{width:.95em;height:.95em}
.tool .cost .free{font-size:.85em;padding:.05em .35em;border-radius:.5em;background:var(--green);color:#10291c;white-space:nowrap}
.tool .badge{font-size:.72em;padding:.05em .4em;border-radius:.5em;background:var(--glass);color:var(--muted)}
.tool.on{background:var(--gold);color:var(--goldInk);box-shadow:0 0 0 2px var(--gold) inset}
.tool.on .ic{color:var(--goldInk)}
.tool.on .badge{background:rgba(0,0,0,.15);color:var(--goldInk)}

.pad{flex:none;display:grid;grid-template-columns:repeat(9,1fr);gap:.35em}
.pad[data-n="6"]{grid-template-columns:repeat(6,1fr);gap:.5em}
.num{position:relative;height:3.5em;border-radius:.8em;background:var(--key);color:var(--keyInk);box-shadow:0 0 0 1.5px var(--keyEdge) inset,0 3px 0 var(--keyEdge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;font-family:"Noto Serif",Georgia,serif;font-weight:700;font-size:1.65em;line-height:1;padding:0}
.num small{font-family:"Alegreya Sans",sans-serif;font-weight:800;font-size:.42em;color:var(--note)}
.num:active,.num.down{transform:translateY(2px);box-shadow:0 0 0 1.5px var(--keyEdge) inset,0 1px 0 var(--keyEdge);background:var(--sel)}
.num.act{background:var(--gold);color:var(--goldInk);box-shadow:0 0 0 3px var(--goldD) inset,0 3px 0 var(--goldD)}
.num.full{opacity:.35}
.num.full small{visibility:hidden}
.pad.notes .num{color:var(--user);font-size:1.3em}
.pad.notes .num small{font-size:.5em}

.hintpanel{position:absolute;left:0;right:0;bottom:0;min-height:100%;z-index:4;display:flex;flex-direction:column;gap:.5em;padding:.8em 1em;background:var(--paper);color:var(--given);border-radius:1.1em;box-shadow:0 0 0 2px var(--gold),0 -10px 30px rgba(0,0,0,.35);animation:tup .2s ease-out;font-size:1.05rem}
.hintpanel .hp-t{display:flex;align-items:center;gap:.4em;font-weight:800;font-size:1.15em;color:var(--goldD)}
.hintpanel .hp-t .ic{width:1.4em;height:1.4em}
.hintpanel p{margin:0;line-height:1.35}
.hintpanel p em{font-style:normal;font-weight:800;color:var(--goldD);margin-right:.4em}
.hintpanel .hp-pre{color:#3d3a52}
.hintpanel .hp-b{display:flex;gap:.6em;margin-top:auto}
.hintpanel .hp-b .btn{flex:1;min-height:2.9em;font-size:1.05rem;padding:.3em .6em}
.hintpanel .b-glass{background:var(--paper2);color:var(--given);box-shadow:0 0 0 1.5px var(--grid) inset,0 3px 0 var(--grid)}

/* широкий экран: справа панель */
body.wide .gbody{flex-direction:row;gap:1.2em;padding:0 1.2em 1.2em}
body.wide .gleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:.6em}
body.wide .gright{width:clamp(20em,30vw,25em);display:flex;flex-direction:column;justify-content:center;gap:.8em}
body.wide .pad{grid-template-columns:repeat(3,1fr);gap:.55em}
body.wide .num{height:auto;aspect-ratio:1.25/1;font-size:2.1em}
body.wide .tools{display:grid;grid-template-columns:1fr 1fr;gap:.55em}
body.wide .tool{height:3.4em;flex-direction:row;gap:.5em;font-size:1.02em}
body.wide .hintpanel{top:auto;bottom:auto;min-height:0;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:1.12rem}
.gleft{flex:1;min-height:0;display:flex;flex-direction:column;gap:.55em}
.gright{display:flex;flex-direction:column;gap:.55em}

/* ---------- обучение, сообщения ---------- */
.glow{animation:glow 1.2s ease-in-out infinite;position:relative;z-index:5}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--gold),0 0 24px 6px rgba(255,213,107,.8)}}
.tipbox{position:fixed;z-index:45;width:min(30rem,calc(100% - 1.2rem));background:var(--paper);color:var(--given);border-radius:1rem;padding:.75rem 1rem .8rem;font-size:1.1rem;line-height:1.32;box-shadow:0 0 0 2.5px var(--gold),0 12px 34px rgba(0,0,0,.5)}
.tipbox.anim{animation:fade .25s ease-out}
.tipbox .tp-n{font-size:.85rem;font-weight:800;color:var(--goldD);text-transform:uppercase;letter-spacing:.06em}
.tipbox p{margin:.3rem 0 .55rem}
.tipbox .tp-b{display:flex;gap:.6rem;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.tipbox .tp-ok{background:var(--gold);color:var(--goldInk);border-radius:.7rem;padding:.6rem 1.1rem;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 var(--goldD)}

/* ---------- окна ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(6,8,22,.62);padding:1rem;animation:fade .18s}

.sheet{width:min(32rem,100%);max-height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--given);border-radius:1.4rem;box-shadow:0 0 0 2px var(--gold),0 24px 60px rgba(0,0,0,.55);overflow:hidden;animation:rise .22s ease-out;--muted:#5d6280;--glass:rgba(33,29,41,.08)}

@keyframes rise{from{transform:translateY(18px)}}
.sh-h{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem .7rem 1.2rem;border-bottom:1.5px solid var(--grid)}

.seg{display:flex;gap:.4rem;background:var(--paper2);padding:.3rem;border-radius:1rem}
.seg button{flex:1;min-height:2.9rem;border-radius:.75rem;font-weight:800;font-size:1rem;padding:.3rem .2rem;line-height:1.1}

.rtabs{margin:.8rem 1.2rem 0}
.toggle{display:flex;align-items:center;gap:.8rem;cursor:pointer}
.toggle .tx{flex:1}
.toggle .tx b{display:block;font-size:1.1rem}
.toggle .tx small{display:block;color:var(--muted);font-size:.95rem;margin-top:.15rem;line-height:1.25}
.sw{width:3.6rem;height:2rem;border-radius:1rem;background:var(--grid);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:.2rem;top:.2rem;width:1.6rem;height:1.6rem;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:left .15s}

.toggle.on .sw::after{left:1.8rem}
.vol-box{min-width:0!important}
.vol-row{font-size:1.1rem!important}
.vol-in{min-width:0}
.vol-l{min-width:5rem!important}
.howto{font-size:1.02rem!important;color:var(--muted);line-height:1.45!important}

.sheet.win{overflow-y:auto;touch-action:pan-y}
.win .sh-b,.win .sh-f{flex:none;overflow:visible}

.win h2{margin:0;font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:2rem}
.win .wsub{color:var(--muted);font-size:1.08rem}

.stars{display:flex;gap:.5rem;justify-content:center}
.stars .ic{width:3.4rem;height:3.4rem;color:#d9cdb3}
.stars .ic.on{color:var(--gold);animation:spop .45s both}
@keyframes spop{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.2)}100%{transform:none}}
.rew{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}

.newitem,.gdone{display:flex;align-items:center;gap:.8rem;background:linear-gradient(135deg,#1b2150,#2c2f6b);color:#f4ecdc;border-radius:1rem;padding:.6rem .8rem;text-align:left;width:100%;box-shadow:0 0 0 1.5px var(--gold) inset}
.newitem svg{width:4.4rem;height:4.4rem;flex:none}
.newitem b,.gdone b{display:block;font-family:"Yeseva One",Georgia,serif;font-weight:400;font-size:1.15rem}

.srow{display:flex;align-items:center;gap:.8rem;padding:.7rem;border-radius:1rem;background:var(--paper2);box-shadow:0 0 0 1.5px var(--grid) inset}

.srow .stx{flex:1;min-width:0}
.srow .stx b{display:block;font-size:1.15rem}
.srow .stx small{display:block;color:var(--muted);font-size:.95rem;line-height:1.25;margin-top:.1rem}
.srow .btn{min-height:3rem;padding:.4rem .9rem;font-size:1.1rem;flex:none}
.srow.col{flex-wrap:wrap}

.iap-price{display:inline-flex;align-items:center;gap:.3rem}

.lb{display:flex;flex-direction:column;gap:.4rem}

.arow{display:flex;align-items:center;gap:.8rem;padding:.6rem .7rem;border-radius:1rem;background:var(--paper2);box-shadow:0 0 0 1.5px var(--grid) inset}

/* судоку дня */
.dtop{display:flex;justify-content:space-between;align-items:center;gap:1rem}

.dtop small{display:block;color:var(--muted);font-size:.95rem}
.dtoday{text-align:right}

/* загрузка */
#boot{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 70% 25%,#2b3270,#121735 65%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:26px;transition:opacity .45s}

}

}

.chst{display:flex!important;gap:.8em;flex-wrap:wrap}.chst .sv{display:inline-flex;align-items:center;gap:.25em;white-space:nowrap}.chst .sv svg{width:1em;height:1em;color:var(--gold)}

/* ---------- стили поля ---------- */
[data-skin="bamboo"]{--paper:#eef1da;--paper2:#e0e7c2;--grid:#a9b47c;--gridBox:#34431e;--given:#232a14;--user:#2c5a8a;--peer:#e2e8c3;--same:#f1d88e;--diag:#e9ecd0;--harea:#d9ecc4}

[data-skin="sakura"]{--paper:#fdf1f3;--paper2:#f7dfe5;--grid:#dcaab6;--gridBox:#5a2c3c;--given:#38202d;--user:#6a3aa0;--peer:#f6dde3;--same:#f6c2cf;--diag:#f9e6eb;--sel:#ffd0dc}

.board[data-skin="gold"]{box-shadow:0 0 0 3px var(--gridBox),0 0 0 7px #e3b45a,0 0 26px rgba(227,180,90,.55),0 18px 50px rgba(0,0,0,.45)}
