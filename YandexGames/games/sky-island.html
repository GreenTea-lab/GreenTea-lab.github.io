.res{display:flex;flex-wrap:wrap;gap:6px;max-width:72%}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,253,248,.92);border-radius:16px;padding:5px 10px 5px 7px;box-shadow:0 3px 0 rgba(61,70,96,.12),0 6px 16px rgba(61,70,96,.08);font-size:15px;line-height:1}
.chip .ic{width:22px;height:22px}
.chip .cv{display:flex;flex-direction:column;gap:1px}
.chip small{font-size:10px;color:var(--greenD);min-height:10px}
.chip-crystals{cursor:pointer}
.chip.small{font-size:13px;padding:4px 9px 4px 6px}
.chip.small .ic{width:18px;height:18px}
.chip.warn{background:#ffe3dd;color:var(--redD)}
.stats{position:absolute;left:8px;top:64px;display:flex;gap:6px}
.tr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.lvl{display:flex;align-items:center;gap:6px;background:rgba(255,253,248,.92);border-radius:18px;padding:4px 10px 4px 4px;box-shadow:0 3px 0 rgba(61,70,96,.12);cursor:pointer}
.lvn{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:15px;box-shadow:inset 0 -3px 0 var(--purpleD)}
.lvbar{width:64px;height:8px;border-radius:5px;background:#e9e3f7;overflow:hidden}
.lvbar i{display:block;height:100%;background:linear-gradient(90deg,#b49cf0,#8f75e6);border-radius:5px}
.tbtns{display:flex;gap:6px}
.ibtn{width:42px;height:42px;border-radius:14px;background:rgba(255,253,248,.95);display:grid;place-items:center;box-shadow:0 3px 0 rgba(61,70,96,.15);position:relative}
.ibtn .ic{width:24px;height:24px}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,70,96,.15)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* цель */
.goal{position:absolute;left:8px;top:100px;width:min(250px,62vw);background:rgba(255,253,248,.94);border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 rgba(61,70,96,.12);font-size:13px;cursor:pointer}
.goal .gt{display:flex;gap:6px;align-items:center}
.goal .gp{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--muted)}
.goal.done{background:#eaffe3;animation:pulse 1.2s infinite}
.gclaim{margin-top:6px;background:var(--green);color:#fff;border-radius:10px;padding:5px 8px;display:flex;gap:6px;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 var(--greenD)}
@keyframes pulse{50%{transform:scale(1.03)}}
.pb{flex:1;height:7px;border-radius:5px;background:#eee7da;overflow:hidden}
.pb i{display:block;height:100%;background:var(--green);border-radius:5px}
/* низ */
.bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none}
.bottom>*{pointer-events:auto}
.big{display:flex;align-items:center;gap:8px;padding:13px 28px;border-radius:22px;font-size:20px;color:#fff}
.big .ic{width:28px;height:28px}
.green{background:var(--green);box-shadow:inset 0 -5px 0 var(--greenD),0 6px 16px rgba(79,166,74,.3)}
.blue{background:var(--blue);color:#fff;box-shadow:inset 0 -4px 0 var(--blueD)}
.yellow{background:var(--yellow);color:#5a4210;box-shadow:inset 0 -4px 0 var(--yellowD)}
.red{background:var(--red);color:#fff;box-shadow:inset 0 -4px 0 var(--redD)}
.purple{background:var(--purple);color:#fff;box-shadow:inset 0 -4px 0 var(--purpleD)}
.gray{background:var(--gray);color:#fff;box-shadow:inset 0 -4px 0 var(--grayD)}
.big:active,.btn:active,.rb:active{transform:translateY(2px)}
.builders{display:flex;align-items:center;gap:5px;background:rgba(255,253,248,.95);border-radius:18px;padding:9px 12px;box-shadow:0 3px 0 rgba(61,70,96,.15);font-size:15px}
.builders .ic{width:24px;height:24px}
.builders.none{background:#ffe3dd;color:var(--redD)}
/* меню стройки */
.drawer{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(61,70,96,.18);padding:10px 0 calc(12px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.tabs{display:flex;gap:6px;padding:0 10px 8px;overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 13px;border-radius:13px;background:#f1ebdf;color:var(--muted);font-size:14px;white-space:nowrap}
.tab.on{background:var(--blue);color:#fff;box-shadow:inset 0 -3px 0 var(--blueD)}
.tabx{margin-left:auto;width:36px;flex:none;display:grid;place-items:center}
.tabx .ic{width:26px;height:26px}
.cards{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 6px;scroll-snap-type:x mandatory;scrollbar-width:thin;touch-action:pan-x}
.card{flex:none;width:132px;background:#fff;border-radius:18px;padding:8px;box-shadow:0 3px 0 var(--line),0 0 0 2px var(--line) inset;display:flex;flex-direction:column;align-items:center;gap:3px;scroll-snap-align:start;cursor:pointer;text-align:center}
.card img{width:84px;height:84px}
.card .cn{font-size:13px}
.card .cn small{color:var(--muted)}
.card .cd{font-size:10px;color:var(--muted);line-height:1.15;min-height:34px;font-weight:700}
.card .cs{display:flex;gap:3px;align-items:center;font-size:12px;color:#e86f93}
.card .cc{display:flex;flex-wrap:wrap;justify-content:center;gap:3px 6px;font-size:12px;align-items:center}
.card.locked{opacity:.55;cursor:default}
.card.locked .cc{color:var(--muted);font-size:11px;gap:3px}
.card.owned{opacity:.7}
.card.poor{opacity:.75}
.cost{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.cost .ic{width:16px;height:16px}
.cost.short{color:var(--redD)}
/* карточка объекта */
.sheet{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(440px,calc(100% - 16px));background:var(--card);border-radius:22px;box-shadow:0 8px 30px rgba(61,70,96,.22);padding:12px;animation:up .18s ease-out}
.sh-h{display:flex;gap:10px;align-items:center}
.sh-h img{width:64px;height:64px;background:#f3f8ee;border-radius:14px}
.sh-h>div{flex:1;display:flex;flex-direction:column;gap:2px}
.sh-h b{font-size:17px}
.sh-h small{font-size:11px;color:var(--muted);font-weight:700}
.lv{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--purpleD)}
.lv .ic{width:16px;height:16px}
.x{width:34px;height:34px;display:grid;place-items:center;align-self:flex-start}
.x .ic{width:24px;height:24px}
.sh-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:10px 0;font-size:12px}
.st{display:flex;align-items:center;gap:5px;background:#f6f1e6;border-radius:10px;padding:5px 7px}
.st span{color:var(--muted);flex:1}
.st em{color:var(--greenD);font-style:normal}
.st .ic{width:16px;height:16px}
.sh-b{display:flex;gap:8px;align-items:stretch}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:16px;font-size:15px}
.btn .ic{width:20px;height:20px}
.btn.wide{flex:1;flex-wrap:wrap;color:#fff}
.btn.wide small{width:100%;display:flex;justify-content:center;gap:4px;font-size:11px;opacity:.9}
.btn.wide small .ic{width:14px;height:14px}
.btn .cl{display:flex;gap:6px;background:rgba(255,255,255,.25);border-radius:9px;padding:3px 7px}
.btn.wide .cost.short{color:#fff2a8}
.btn.sm{padding:9px 12px;font-size:13px}
.btn.poor{filter:saturate(.5) brightness(.95)}
.btn.dis{opacity:.6;pointer-events:none}
.bt{display:flex;align-items:center;gap:6px;flex:1;font-size:18px;color:var(--blueD)}
.max{display:flex;gap:6px;align-items:center;flex:1;color:var(--yellowD)}
/* панель расстановки */
.placebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--card);border-radius:22px;padding:8px;box-shadow:0 8px 30px rgba(61,70,96,.22);width:min(440px,calc(100% - 16px))}
.pinfo{flex:1;display:flex;flex-direction:column;gap:2px;font-size:14px;padding-left:6px}
.pinfo div{display:flex;gap:6px;font-size:13px}
.pinfo small{font-size:11px;color:var(--muted);font-weight:700}
.rb{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.rb .ic{width:26px;height:26px}
.rb.dis{opacity:.45}
/* метки в мире */
.labels{position:absolute;inset:0;overflow:hidden}
.wl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;background:rgba(255,253,248,.95);border-radius:12px;padding:4px 8px;font-size:12px;box-shadow:0 2px 0 rgba(61,70,96,.15);pointer-events:auto;cursor:pointer;white-space:nowrap;overflow:hidden}
.wl .ic{width:16px;height:16px}
.wl.timer i{position:absolute;left:0;bottom:0;height:3px;background:var(--blue)}
.wl.plot{background:rgba(255,253,248,.9);font-size:13px;padding:6px 10px}
.wl.plot .short{color:var(--redD)}
.wl.locked{opacity:.75;color:var(--muted)}
.floater{position:absolute;left:0;top:0;display:flex;align-items:center;gap:3px;font-size:16px;color:#fff;text-shadow:0 2px 0 rgba(61,70,96,.5),0 0 6px rgba(61,70,96,.35);white-space:nowrap}
.floater .ico .ic{width:18px;height:18px}
.floater.done{background:rgba(114,198,106,.95);padding:4px 10px;border-radius:12px;text-shadow:none;font-size:13px}
.bigfloat{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;gap:12px;font-size:30px;background:rgba(255,253,248,.95);padding:10px 18px;border-radius:20px;box-shadow:0 8px 30px rgba(61,70,96,.22);animation:bigf 1.6s ease-out forwards;pointer-events:none}
.bigfloat .ic{width:30px;height:30px}
@keyframes bigf{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.05);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-90%);opacity:0}}
.toasts{position:absolute;left:50%;top:110px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(420px,90%)}
.toast{background:rgba(61,70,96,.88);color:#fff;border-radius:14px;padding:8px 14px;font-size:13px;text-align:center;animation:up .2s ease-out;transition:opacity .4s}
.toast.out{opacity:0}
/* модальные окна */
.modal-wrap{position:absolute;inset:0;background:rgba(40,52,82,.35);display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.modal{touch-action:pan-y;position:relative;background:var(--card);border-radius:26px;padding:20px 18px 18px;width:min(420px,100%);max-height:88vh;overflow:auto;text-align:center;box-shadow:0 12px 40px rgba(40,52,82,.3);animation:pop .25s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.tut{position:absolute;left:50%;transform:translateX(-50%);max-width:min(420px,88vw);background:#3d4660;color:#fff;font-size:15px;line-height:1.3;padding:10px 16px;border-radius:16px;box-shadow:0 6px 20px rgba(40,52,82,.35);text-align:center;pointer-events:none;z-index:30;animation:pop .25s}
.tut.top{top:calc(110px + env(safe-area-inset-top))}
.tut.bottom{bottom:calc(96px + env(safe-area-inset-bottom))}
.tut-arrow{position:fixed;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:22px solid #ffd94d;transform:translateX(-50%);z-index:31;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:tutBob .7s ease-in-out infinite alternate}
.tut-arrow.up{border-top:0;border-bottom:22px solid #ffd94d}
@keyframes tutBob{to{margin-top:-8px}}
.tut-hl{position:relative;z-index:6;animation:tutPulse 1s ease-in-out infinite}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 3px #ffd94d,0 0 14px 4px rgba(255,217,77,.7)}50%{box-shadow:0 0 0 6px #ffd94d,0 0 26px 10px rgba(255,217,77,.9)}}
.iap-box{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.iap-item{display:flex;align-items:center;gap:10px;background:#f6f1e8;border-radius:16px;padding:8px 10px;text-align:left}
.iap-ic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.iap-ic svg,.iap-ic img{width:44px;height:44px;object-fit:contain}
.iap-tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.iap-tx small{font-size:11px;color:var(--muted);line-height:1.2;font-weight:700}
.iap-buy{flex:none;min-width:80px;height:40px;padding:0 10px;border-radius:14px;font:inherit;font-size:16px;color:#fff;background:var(--green);border:0;box-shadow:0 3px 0 var(--greenD);cursor:pointer}
.iap-buy:disabled{opacity:.6}
.iap-buy.owned{background:var(--gray);box-shadow:none;font-size:12px}
.iap-price{display:inline-flex;align-items:center;gap:5px}
.iap-price img{width:20px;height:20px}
.iap-price i{font-style:normal;font-size:.8em}
.modal h2{margin:4px 0 8px;font-size:21px}
.modal h3{margin:14px 0 6px;font-size:14px;color:var(--muted)}
.modal p{margin:6px 0;font-size:14px;font-weight:700}
.modal .small{font-size:12px}
.muted{color:var(--muted)}
.mx{position:absolute;right:10px;top:10px;width:34px;height:34px;display:grid;place-items:center}
.mx .ic{width:24px;height:24px}
.mb{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.mb .btn{padding:13px;font-size:16px}
.rewards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.rw{display:flex;flex-direction:column;align-items:center;gap:4px;background:#f6f1e6;border-radius:16px;padding:10px 14px;min-width:84px}
.rw .ic{width:34px;height:34px}
.rw small{font-size:11px;color:var(--muted)}

.rewards>.cost .ic{width:26px;height:26px}
.bigicon .ic{width:72px;height:72px;margin:0 auto}
.lvbig{width:70px;height:70px;border-radius:50%;margin:0 auto;background:var(--purple);color:#fff;font-size:34px;display:grid;place-items:center;box-shadow:inset 0 -5px 0 var(--purpleD),0 0 0 6px #ece6ff}
.celebrate{background:radial-gradient(circle at 50% 0,#fff6d8,var(--card) 60%)}
.unl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.un{display:flex;flex-direction:column;align-items:center;width:84px;font-size:11px;gap:2px}
.un img{width:64px;height:64px;background:#f3f8ee;border-radius:14px}
.un.biome .ic{width:64px;height:64px}
.streak{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sd{background:#f6f1e6;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.sd small{font-size:10px;color:var(--muted)}
.sd.past{opacity:.45}
.sd.now{background:#eaffe3;box-shadow:0 0 0 3px var(--green) inset}
.sd .cost .ic{width:18px;height:18px}
.task{display:flex;gap:8px;align-items:center;background:#f6f1e6;border-radius:16px;padding:9px 10px;margin:6px 0;text-align:left;font-size:13px}
.task .tt{flex:1;display:flex;flex-direction:column;gap:6px}
.task .tr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px}
.task.claimed{opacity:.55}
.task .ok .ic{width:24px;height:24px}
.srow{display:flex;justify-content:space-between;width:100%;background:#f6f1e6;border-radius:14px;padding:13px 14px;margin:6px 0;font-size:15px}
.srow b{color:var(--blueD)}
.lb{font-size:14px;text-align:left}
.lbr{display:flex;gap:8px;padding:8px 10px;border-radius:12px}
.lbr:nth-child(odd){background:#f6f1e6}
.lbr .nm{flex:1}
.lbr.me{background:#fff2c8}
@keyframes float{50%{transform:translateY(-10px)}}
@media (max-width:420px){.chip{font-size:13px;padding:4px 8px 4px 5px}.chip .ic{width:19px;height:19px}.big{padding:12px 22px;font-size:18px}.card{width:118px}.card img{width:72px;height:72px}.lvbar{width:44px}}

#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(#8ccff7,#e9f6ff);color:#fff;font:800 26px Nunito,Arial,sans-serif;z-index:10;text-shadow:0 2px 0 rgba(61,70,96,.3);overflow:hidden}
#loader svg{width:min(90vw,520px);height:auto;overflow:visible}
#loader #lt{font-size:clamp(26px,6vw,38px);color:#3d6fb0;-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 4px 10px rgba(61,70,96,.25)}
#loader .ld{display:flex;gap:8px}
#loader .ld i{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 2px 0 #6aa8ec;animation:ldp 1s ease-in-out infinite}
#loader .ld i:nth-child(2){animation-delay:.15s}
#loader .ld i:nth-child(3){animation-delay:.3s}
@keyframes ldp{50%{transform:translateY(-7px)}}
#loader .isl{animation:isl 3s ease-in-out infinite}
@keyframes isl{50%{transform:translateY(-8px)}}
#loader .cl1{animation:cl 16s linear infinite}
#loader .cl2{animation:cl 22s linear infinite reverse}
@keyframes cl{from{transform:translateX(-50px)}to{transform:translateX(50px)}}
#loader .walk{animation:walk 5s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}
#loader .walk2{animation:walk 6s ease-in-out infinite reverse}
#loader .coin{animation:coin 1s ease-in-out infinite alternate}
@keyframes coin{to{transform:translateY(-4px)}}
#loader .smoke{animation:smk 2.4s ease-out infinite;opacity:0}
#loader .smoke.b{animation-delay:1.2s}
@keyframes smk{0%{opacity:.8;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(8px,-26px) scale(1.4)}}
#loader .fall{animation:fall .9s linear infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(10px)}}
</style>
