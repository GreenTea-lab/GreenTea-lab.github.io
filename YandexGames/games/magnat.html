/* классика настольной игры: кремовая бумага, тёмно-зелёный контур, красная лента, золото */
:root{--ink:#1d2a24;--ink2:#3e524a;--muted:#7a8a82;--paper:#fbf6e8;--paper2:#efe6cf;--line:#ddd0b0;--red:#c8282a;--redD:#9a1c1e;--green:#1f8a4c;--sea:#2f6fb0;--gold:#d9a53a;--mint:#d4ecd6;
--logo:"Playfair Display",Georgia,serif;--cond:Oswald,"Arial Narrow",Arial,sans-serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#2b3360 center/cover no-repeat;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#ui *{pointer-events:none}
#ui button,#ui .hit,#ui input,#ui .modal,#ui .modal *{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
svg{display:block}
.safe{position:absolute;inset:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;position:relative;transition:transform .08s,box-shadow .08s;font-weight:900;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:saturate(.25) brightness(1.05);opacity:.7;cursor:default}
.btn svg{width:28px;height:28px;flex:none}
.big,.mid,.sm2{color:#fff;background:var(--red);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big::after,.mid::after{content:"";position:absolute;inset:4px;border:2px solid rgba(255,255,255,.35);border-radius:inherit;pointer-events:none}
.big{min-width:200px;height:68px;padding:0 26px;border-radius:16px;font-size:26px}
.mid{height:52px;padding:0 16px;border-radius:14px;font-size:19px}
.sm2{height:42px;padding:0 12px;border-radius:11px;font-size:16px;gap:5px;box-shadow:0 4px 0 var(--ink)}
.sm2 svg{width:22px;height:22px}
.green{background:var(--green)}
.sea{background:var(--sea)}
.sand{background:var(--paper2);color:var(--ink);text-shadow:none}
.sand::after{border-color:rgba(29,42,36,.18)}
.round{width:56px;height:56px;border-radius:50%;background:var(--paper)}
.round svg{width:30px;height:30px}
.round.sm{width:50px;height:50px}
.round.sm svg{width:27px;height:27px}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:3px 10px 3px 4px;font-size:21px;box-shadow:0 4px 0 var(--ink);font-weight:900;height:46px}
.chip svg{width:32px;height:32px}
.chip .plus{font-style:normal;width:25px;height:25px;border-radius:50%;background:var(--green);border:2px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;margin-left:3px}

<h3>\u0410\u0440\u0435\u043D\u0434\u0430 \u0438 \u0434\u043E\u043C\u0430</h3><p>\u041A\u0442\u043E \u0432\u0441\u0442\u0430\u043B \u043D\u0430 \u0447\u0443\u0436\u043E\u0439 \u0443\u0447\u0430\u0441\u0442\u043E\u043A, \u043F\u043B\u0430\u0442\u0438\u0442 \u0432\u043B\u0430\u0434\u0435\u043B\u044C\u0446\u0443 \u0430\u0440\u0435\u043D\u0434\u0443. \u0415\u0441\u043B\u0438 \u0443 \u0432\u0430\u0441 \u0432\u0441\u044F \u0433\u0440\u0443\u043F\u043F\u0430 \u043E\u0434\u043D\u043E\u0433\u043E \u0446\u0432\u0435\u0442\u0430, \u0430\u0440\u0435\u043D\u0434\u0430 \u043F\u0443\u0441\u0442\u044B\u0445 \u0443\u0447\u0430\u0441\u0442\u043A\u043E\u0432 \u0443\u0434\u0432\u0430\u0438\u0432\u0430\u0435\u0442\u0441\u044F \u0438 \u043C\u043E\u0436\u043D\u043E \u0441\u0442\u0440\u043E\u0438\u0442\u044C \u0434\u043E\u043C\u0430 (\u0434\u043E 4), \u0430 \u043F\u043E\u0442\u043E\u043C \u043E\u0442\u0435\u043B\u044C. \u0414\u043E\u043C\u0430 \u0441\u0442\u0430\u0432\u044F\u0442\u0441\u044F \u0440\u0430\u0432\u043D\u043E\u043C\u0435\u0440\u043D\u043E: \u043D\u0435\u043B\u044C\u0437\u044F \u0441\u0442\u0440\u043E\u0438\u0442\u044C \u0432\u0442\u043E\u0440\u043E\u0439 \u0434\u043E\u043C, \u043F\u043E\u043A\u0430 \u043D\u0430 \u0434\u0440\u0443\u0433\u0438\u0445 \u0443\u0447\u0430\u0441\u0442\u043A\u0430\u0445 \u0433\u0440\u0443\u043F\u043F\u044B \u043D\u0435\u0442 \u043F\u0435\u0440\u0432\u043E\u0433\u043E.</p>
<h3>\u0422\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442 \u0438 \u043F\u0440\u0435\u0434\u043F\u0440\u0438\u044F\u0442\u0438\u044F</h3><p>\u0410\u0440\u0435\u043D\u0434\u0430 \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u0430 \u0440\u0430\u0441\u0442\u0451\u0442 \u0441 \u0447\u0438\u0441\u043B\u043E\u043C \u0432\u0430\u0448\u0438\u0445 \u0442\u0440\u0430\u043D\u0441\u043F\u043E\u0440\u0442\u043D\u044B\u0445 \u0443\u0447\u0430\u0441\u0442\u043A\u043E\u0432: 25, 50, 100, 200 \u0442\u044B\u0441. \u0417\u0430 \u043F\u0440\u0435\u0434\u043F\u0440\u0438\u044F\u0442\u0438\u0435 \u043F\u043B\u0430\u0442\u044F\u0442 \u0441\u0443\u043C\u043C\u0443 \u043A\u0443\u0431\u0438\u043A\u043E\u0432 \xD74, \u0430 \u0435\u0441\u043B\u0438 \u0443 \u0432\u043B\u0430\u0434\u0435\u043B\u044C\u0446\u0430 \u043E\u0431\u0430 \u043F\u0440\u0435\u0434\u043F\u0440\u0438\u044F\u0442\u0438\u044F \u2014 \xD710.</p>
<h3>\u0422\u044E\u0440\u044C\u043C\u0430</h3><p>\u0412 \u0442\u044E\u0440\u044C\u043C\u0443 \u043F\u043E\u043F\u0430\u0434\u0430\u044E\u0442 \u0441 \u043A\u043B\u0435\u0442\u043A\u0438 \xAB\u0412 \u0442\u044E\u0440\u044C\u043C\u0443\xBB, \u043F\u043E \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0435 \u0438\u043B\u0438 \u0437\u0430 \u0442\u0440\u0438 \u0434\u0443\u0431\u043B\u044F. \u0412\u044B\u0439\u0442\u0438 \u043C\u043E\u0436\u043D\u043E, \u0437\u0430\u043F\u043B\u0430\u0442\u0438\u0432 50 000 \u20BD, \u043F\u043E \u043A\u0430\u0440\u0442\u043E\u0447\u043A\u0435 \xAB\u041E\u0441\u0432\u043E\u0431\u043E\u0436\u0434\u0435\u043D\u0438\u0435\xBB \u0438\u043B\u0438 \u0432\u044B\u0431\u0440\u043E\u0441\u0438\u0432 \u0434\u0443\u0431\u043B\u044C. \u041F\u043E\u0441\u043B\u0435 \u0442\u0440\u0435\u0442\u044C\u0435\u0439 \u043D\u0435\u0443\u0434\u0430\u0447\u043D\u043E\u0439 \u043F\u043E\u043F\u044B\u0442\u043A\u0438 \u0448\u0442\u0440\u0430\u0444 \u043F\u043B\u0430\u0442\u0438\u0442\u0441\u044F \u043E\u0431\u044F\u0437\u0430\u0442\u0435\u043B\u044C\u043D\u043E.</p>
<h3>\u0417\u0430\u043B\u043E\u0433 \u0438 \u0434\u043E\u043B\u0433\u0438</h3><p>\u0423\u0447\u0430\u0441\u0442\u043E\u043A \u0431\u0435\u0437 \u0434\u043E\u043C\u043E\u0432 \u043C\u043E\u0436\u043D\u043E \u0437\u0430\u043B\u043E\u0436\u0438\u0442\u044C \u0431\u0430\u043D\u043A\u0443 \u0437\u0430 \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443 \u0446\u0435\u043D\u044B. \u0412\u044B\u043A\u0443\u043F \u0441\u0442\u043E\u0438\u0442 \u0437\u0430\u043B\u043E\u0433 \u043F\u043B\u044E\u0441 10%. \u0417\u0430\u043B\u043E\u0436\u0435\u043D\u043D\u044B\u0439 \u0443\u0447\u0430\u0441\u0442\u043E\u043A \u043D\u0435 \u043F\u0440\u0438\u043D\u043E\u0441\u0438\u0442 \u0430\u0440\u0435\u043D\u0434\u0443. \u0415\u0441\u043B\u0438 \u0432\u044B \u0434\u043E\u043B\u0436\u043D\u044B \u0431\u043E\u043B\u044C\u0448\u0435, \u0447\u0435\u043C \u043C\u043E\u0436\u0435\u0442\u0435 \u0441\u043E\u0431\u0440\u0430\u0442\u044C, \u043D\u0430\u0441\u0442\u0443\u043F\u0430\u0435\u0442 \u0431\u0430\u043D\u043A\u0440\u043E\u0442\u0441\u0442\u0432\u043E: \u0438\u043C\u0443\u0449\u0435\u0441\u0442\u0432\u043E \u0443\u0445\u043E\u0434\u0438\u0442 \u043A\u0440\u0435\u0434\u0438\u0442\u043E\u0440\u0443.</p>
<h3>\u041E\u0431\u043C\u0435\u043D</h3><p>\u041A\u043D\u043E\u043F\u043A\u0430 \xAB\u041E\u0431\u043C\u0435\u043D\xBB \u043F\u043E\u0437\u0432\u043E\u043B\u044F\u0435\u0442 \u043F\u0440\u0435\u0434\u043B\u043E\u0436\u0438\u0442\u044C \u0441\u043E\u043F\u0435\u0440\u043D\u0438\u043A\u0443 \u0441\u0434\u0435\u043B\u043A\u0443: \u0443\u0447\u0430\u0441\u0442\u043A\u0438 \u0438 \u0434\u0435\u043D\u044C\u0433\u0438. \u0421\u043E\u043F\u0435\u0440\u043D\u0438\u043A\u0438 \u0441\u043E\u0433\u043B\u0430\u0448\u0430\u044E\u0442\u0441\u044F, \u0435\u0441\u043B\u0438 \u0438\u043C \u0432\u044B\u0433\u043E\u0434\u043D\u043E, \u0438 \u0438\u043D\u043E\u0433\u0434\u0430 \u043F\u0440\u0435\u0434\u043B\u0430\u0433\u0430\u044E\u0442 \u0441\u0434\u0435\u043B\u043A\u0438 \u0441\u0430\u043C\u0438.</p>

test. Collect {n}.",h_inherit_card:"You inherit {n}.",t_car:"Car",t_doll:"Matryoshka",t_boat:"Boat",t_plane:"Plane",t_rocket:"Rocket",t_samovar:"Samovar",t_train:"Steam train",t_balalaika:"Balalaika",t_crown:"Crown",p_sunset:"Summer sunset",p_nights:"White nights",p_autumn:"Golden autumn",p_port:"Harbor lights",p_winter:"Winter tale",h_classic:"Classic",h_terem:"Wooden terems",h_modern:"Skyscrapers",rulesHTML:`<h3>Goal</h3><p>Become the richest: buy cities, build houses and hotels, collect rent. A player who runs out of money and property leaves the game. In a game with a round limit, the player with the highest net worth (cash, property and buildings) wins after the last round.</p>
<h3>Your turn</h3><p>Roll two dice and move that many cells. Doubles give another roll, but three doubles in a row send you to jail. Each time you pass Start you collect \u20BD200,000.</p>
<h3>Buying and auctions</h3><p>Land on an unowned property and you may buy it at its price. If you decline, it goes to auction: players raise the bid in turn and whoever passes drops out. With no bids it stays with the bank.</p>
<h3>Rent and houses</h3><p>Landing on someone else's property means paying rent. Own a whole color group and rent on empty cells doubles, and you can build houses (up to 4), then a hotel. Build evenly: no second house until every cell in the group has one.</p>
<h3>Transport and utilities</h3><p>Transport rent grows with the number you own: 25, 50, 100, 200 thousand. Utilities charge the dice total \xD74, or \xD710 if the owner has both.</p>
<h3>Jail</h3><p>You go to jail from the Go to jail cell, by a card, or for three doubles. Get out by paying \u20BD50,000, using a Get out card, or rolling doubles. After the third failed try you must pay.</p>
<h3>Mortgage and debts</h3><p>A property without houses can be mortgaged for half its price. Redeeming costs the mortgage plus 10%. Mortgaged property earns no rent. If you owe more than you can raise, you go bankrupt and your property goes to the creditor.</p>
<h3>Trading</h3><p>The Trade button lets you offer a rival a deal with property and money. Rivals accept when the deal suits them, and sometimes make offers themselves.</p>
<h3>Our simplifications</h3><p>The bank never runs out of houses or hotels. Property of a player bankrupt to the bank goes back on sale without an auction.</p>`},tc=ec,bi="ru";function vu(n){bi=["ru","be","kk","uk","uz","ky","tg","hy","az","ka"].includes(n)?"ru":"en",tc=bi==="ru"?ec:mp,document.documentElement.lang=bi,document.title=tc.title}function L(n,t){let e=tc[n]??ec[n]??n;if(t&&typeof e=="string")for(let[i,s]of Object.entries(t))e=e.split(`{${i}}`).join(s);return e}var ir=n=>Math.floor(n).toLocaleString(bi==="ru"?"ru-RU":"en-US");function ce(n){let t=Math.round(n*1e3);return bi==="ru"?`${t.toLocaleString("ru-RU")} \u20BD`:`\u20BD${t.toLocaleString("en-US")}`}function En(n){let t=n<0?"-":"";return n=Math.abs(n),bi==="ru"?n>=1e3?`${t}${(n/1e3).toLocaleString("ru-RU",{maximumFractionDigits:n>=1e4?1:2})} \u043C\u043B\u043D \u20BD`:`${t}${Math.round(n)} \u0442\u044B\u0441. \u20BD`:n>=1e3?`${t}\u20BD${(n/1e3).toLocaleString("en-US",{maximumFractionDigits:n>=1e4?1:2})}M`:`${t}\u20BD${Math.round(n)}K`}var gp=n=>440*Math.pow(2,(n-69)/12),_a={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixolydian:[0,2,4,5,7,9,10],phrygian:[0,1,3,5,7,8,10],lydian:[0,2,4,6,7,9,11],pentaMinor:[0,3,5,7,10,12,15],pentaMajor:[0,2,4,7,9,12,14]};function _p(n){let t=n*2654435761>>>0||1;return()=>(t=t*1664525+1013904223>>>0)/4294967296}function xp(n){let t=_a[n.scale]||_a.minor,e=i=>n.key+t[(i%7+7)%7]+12*Math.floor(i/7);n._deg=e,n._chords=n.prog.map(i=>[e(i),e(i+2),e(i+4),e(i+6)]),n._bars=n.prog.length;for(let i of n.layers)(i.t==="lead"||i.t==="bell"||i.t==="flute")&&(i._mel=yp(n,i));return n}function yp(n,t){let e=_p((n.seed||1)*97+(t.seed||0)*13+5),i=_a[n.scale]||_a.minor,s=Array.isArray(t.rhythm)?t.rhythm:[t.rhythm||"x...x...x.x.x..."],r=n._bars,a=[],o=7+Math.floor(e()*3),l=[];for(let c=0;c<r;c++){let h=s[c%s.length],f=n.prog[c],d=new Array(16).fill(null),u=c>=2&&c%4!==3&&e()<.55?l[c%2]:null;for(let p=0;p<16;p++){if(h[p]!=="x"&&h[p]!=="o")continue;let x;if(u&&u[p]!
