/* Чайхана: кремовые панели с золотой каймой, гранат, бирюза изразцов, тёмный орех */
:root{--ink:#2e1a10;--ink2:#5c3f2a;--muted:#8a6a4a;--paper:#fbf1dc;--paper2:#f3e2bf;--line:#e2c995;--gold:#e0b24e;--goldD:#b8862c;--wine:#9a2a30;--wineD:#6e1a1f;--teal:#1f6f6a;--tealD:#154f4b;--leaf:#4f8f3a;
--logo:Yeseva,Georgia,serif;--body:Nunito,"Arial Rounded MT Bold",Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#2a160d;font-family:var(--body);font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none}
#ui *{pointer-events:none}
#ui button,#ui .hit,#ui input,#ui .modal,#ui .modal *{pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
svg{display:block}
.safe{position:absolute;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative;transition:transform .08s,box-shadow .08s,filter .15s;font-weight:900;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);white-space:nowrap}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{filter:saturate(.2) brightness(.95);opacity:.55;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn svg{width:30px;height:30px;flex:none}
.big{min-width:170px;height:64px;padding:0 24px;border-radius:18px;font-size:24px;color:#fff6e2;background:linear-gradient(#b1343b,#86222a);box-shadow:0 5px 0 var(--ink),inset 0 0 0 2px rgba(240,200,110,.55);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big.green{background:linear-gradient(#2a8a83,#1a5f5a)}
.big.gold{background:linear-gradient(#f2c862,#d39b34);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.4)}
.big.sand{background:linear-gradient(#fdf5e3,#f0dcb2);color:var(--ink);text-shadow:none}
.mid{height:54px;padding:0 18px;border-radius:15px;font-size:20px;color:#fff6e2;background:linear-gradient(#b1343b,#86222a)}
.mid.sand{background:linear-gradient(#fdf5e3,#f0dcb2);color:var(--ink)}
.mid.sea{background:linear-gradient(#2a8a83,#1a5f5a)}
.mid.gold{background:linear-gradient(#f2c862,#d39b34);color:var(--ink)}
.mid.wine{background:linear-gradient(#b1343b,#86222a)}
.mid svg{width:28px;height:28px}
