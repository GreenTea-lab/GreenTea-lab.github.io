:root{--ink:#24325a;--ink2:#4a5a85;--muted:#6a7a99;--paper:#ffffff;--paper2:#eef5ff;--edge:#2c3d6e;--orange:#ff8a3c;--orangeD:#d0601a;--green:#5ccc4e;--greenD:#2f8f2a;--blue:#4aa3ff;--blueD:#2266c4;--pink:#ff7aa2;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-touch-callout:none;background:#8fd3ff;font-family:Nunito,"Arial Rounded MT Bold",Arial,sans-serif;font-weight:800;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer button,.layer .chip,.layer canvas.tmap{pointer-events:auto}
.floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
svg{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;transition:transform .08s}
.btn:active{transform:translateY(2px) scale(.97)}
.btn:disabled{cursor:default}
.btn svg{width:24px;height:24px;flex:none}
.big{min-width:150px;height:56px;padding:0 22px;border-radius:18px;font-size:21px;color:#fff;background:linear-gradient(#ffa860,#ff8030);box-shadow:inset 0 -5px 0 rgba(0,0,0,.15),0 4px 0 var(--orangeD),0 8px 18px rgba(30,40,90,.25);text-shadow:0 2px 0 rgba(0,0,0,.2);border:3px solid #fff}

.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

.logo{position:absolute;left:0;right:0;top:12%;text-align:center;pointer-events:none}
.logo-t{display:inline-block;font-family:"Russo One",Nunito,sans-serif;font-size:clamp(40px,8vw,82px);line-height:.95;color:#fff;-webkit-text-stroke:7px var(--edge);paint-order:stroke fill;text-shadow:0 7px 0 var(--edge),0 14px 26px rgba(20,30,80,.35);max-width:94vw;transform:rotate(-3deg)}
.play{height:72px;min-width:240px;font-size:30px;font-family:"Russo One",Nunito,sans-serif;font-weight:400}

.online{display:flex;align-items:center;gap:6px;font-size:13px;color:#fff;background:rgba(36,50,90,.45);padding:5px 12px;border-radius:12px;max-width:94vw;text-align:center}

/* трассы */
.panel-c{position:absolute;left:0;right:0;top:66px;bottom:0;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 10px 14px;overflow:hidden}
.ttl{font-family:"Russo One",Nunito,sans-serif;font-size:clamp(26px,5vw,38px);color:#fff;-webkit-text-stroke:5px var(--edge);paint-order:stroke fill;text-shadow:0 4px 0 var(--edge)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tab{pointer-events:auto;display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:14px;font-size:16px;color:#fff;background:linear-gradient(var(--c1),var(--c2));border:3px solid rgba(255,255,255,.7);opacity:.75;text-shadow:0 1px 0 rgba(0,0,0,.3)}

.tcards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:stretch;overflow-y:auto;touch-action:pan-y;padding:4px 4px 10px;max-width:100%}

/* гараж */

.bar{height:12px;border-radius:8px;background:#dfe9f7;overflow:hidden}

.mhead{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px;font-family:"Russo One",Nunito,sans-serif;font-size:24px;background:linear-gradient(#72bcff,#3d8ef0);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2)}

.mbody{padding:16px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:pan-y}

.segs{display:flex;border-radius:12px;overflow:hidden;border:3px solid #d6e4f5}

.lblogin{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:14px;color:var(--muted)}
.free{align-self:stretch;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#eafbe4;border:3px solid #bfeab2}

.iap-box{display:flex;flex-direction:column;gap:8px;align-self:stretch}

.iap-buy{flex:none;min-width:84px;height:42px;padding:0 10px;border-radius:12px;font:inherit;font-size:17px;color:#fff;background:linear-gradient(#7ee060,#4fbe3e);box-shadow:0 3px 0 var(--greenD);cursor:pointer}

.toast{position:fixed;left:50%;top:16%;transform:translateX(-50%);background:rgba(36,50,90,.9);color:#fff;padding:10px 18px;border-radius:14px;font-size:17px;z-index:80;animation:toastA 2s forwards;pointer-events:none;text-align:center;max-width:90vw}
@keyframes toastA{0%{opacity:0;transform:translate(-50%,10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
/* поиск */
.search{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(36,50,90,.35);color:#fff;font-size:26px;-webkit-text-stroke:5px var(--edge);paint-order:stroke fill}
.spin{width:64px;height:64px;border-radius:50%;border:8px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin 0.9s linear infinite}

/* HUD */
.hud{position:absolute;inset:0;pointer-events:none}
.hud button{pointer-events:auto}
.h-tl{position:absolute;left:12px;top:10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.pos{display:flex;align-items:baseline;font-family:"Russo One",Nunito,sans-serif;color:#fff;-webkit-text-stroke:6px var(--edge);paint-order:stroke fill;text-shadow:0 4px 0 var(--edge)}

.pos small{font-size:22px}
.pos.top b{color:var(--gold)}
.lapb{font-size:16px;color:#fff;background:rgba(36,50,90,.55);padding:3px 10px;border-radius:10px}
.h-tc{position:absolute;left:50%;top:12px;transform:translateX(-50%)}
.time{font-family:"Russo One",Nunito,sans-serif;font-size:24px;color:#fff;-webkit-text-stroke:5px var(--edge);paint-order:stroke fill}

.nlabel{position:absolute;left:0;top:0;display:none;font-size:13px;color:#fff;background:rgba(36,50,90,.6);padding:2px 8px;border-radius:9px;white-space:nowrap;will-change:transform}
.h-bc{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.speed{display:flex;align-items:baseline;gap:4px;font-family:"Russo One",Nunito,sans-serif;color:#fff;-webkit-text-stroke:5px var(--edge);paint-order:stroke fill}
.speed b{font-weight:400;font-size:36px;min-width:64px;text-align:right}
.speed small{font-size:14px;-webkit-text-stroke:3px var(--edge)}
.nbar{position:relative;width:180px;height:18px;border-radius:10px;background:rgba(36,50,90,.55);border:3px solid #fff;overflow:hidden}
.nbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ff9a3c,#ff5a3c)}
.nbar span{position:absolute;right:4px;top:-1px;color:#fff}
.nbar span svg{width:14px;height:14px}
.nbar.full{box-shadow:0 0 14px #ffb060;animation:pulse 0.8s infinite}
.count{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:"Russo One",Nunito,sans-serif;font-size:clamp(70px,14vw,130px);color:#fff;-webkit-text-stroke:8px var(--edge);paint-order:stroke fill;opacity:0;pointer-events:none}
.count.show{animation:cnt .9s ease-out forwards}
.count.go{color:var(--green)}
@keyframes cnt{0%{opacity:0;transform:scale(1.8)}20%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.banner-box{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none}
.banner{display:inline-block;font-family:"Russo One",Nunito,sans-serif;font-size:clamp(28px,6vw,48px);color:#fff;-webkit-text-stroke:6px var(--edge);paint-order:stroke fill;animation:bannerA 2.4s ease forwards}

.hint{position:absolute;left:50%;top:17%;transform:translateX(-50%);max-width:min(560px,90vw);text-align:center;font-size:18px;color:#fff;background:rgba(36,50,90,.75);padding:10px 18px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none}
.hint.show{opacity:1}
.wrong{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-family:"Russo One",Nunito,sans-serif;font-size:40px;color:#ff5a5a;-webkit-text-stroke:6px #fff;paint-order:stroke fill;opacity:0;pointer-events:none}
.wrong.show{opacity:1;animation:pulse .6s infinite}
.keys-hint{position:absolute;left:12px;bottom:12px;font-size:13px;color:#fff;background:rgba(36,50,90,.45);padding:4px 10px;border-radius:10px}
.tc{position:absolute;bottom:14px;display:flex;gap:12px;align-items:flex-end}
.tc-l{left:14px}
.tc-r{right:14px;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end}

.tc-r .tbtn.drift{grid-column:2;grid-row:2}
.hud.touch .h-bc{bottom:auto;top:52px}
.hud.touch .speed b{font-size:26px}
.tbtn{pointer-events:auto;width:84px;height:84px;border-radius:24px;color:#fff;background:rgba(36,50,90,.42);border:3px solid rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;position:relative;overflow:hidden}
.tbtn svg{width:44px;height:44px;position:relative;z-index:1}
.tbtn small{font-size:12px;position:relative;z-index:1}
.tbtn.on{background:rgba(255,138,60,.75);transform:scale(.95)}
.tbtn.small{width:60px;height:60px;border-radius:18px}
.tbtn.small svg{width:30px;height:30px}
.tbtn.drift{width:96px;height:96px}
.tbtn.nit i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,120,60,.7)}
.tbtn.nit.full{border-color:#ffd23f;box-shadow:0 0 16px #ffb060;animation:pulse .8s infinite}
/* результаты */
.results{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;background:rgba(20,30,70,.35)}
.results button{pointer-events:auto}
.rhead{display:flex;align-items:center;gap:12px}
.rmedal svg{width:64px;height:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.rplace{font-family:"Russo One",Nunito,sans-serif;font-size:clamp(36px,7vw,58px);color:#fff;-webkit-text-stroke:7px var(--edge);paint-order:stroke fill;text-shadow:0 5px 0 var(--edge)}
.rplace.top{color:var(--gold)}
.rtime{display:flex;align-items:center;gap:6px;font-family:"Russo One",Nunito,sans-serif;font-size:22px;color:#fff;background:rgba(36,50,90,.55);padding:4px 12px;border-radius:12px}
.rtime svg{width:20px;height:20px}
.rnote{font-size:18px;color:#fff;background:linear-gradient(#ff9ac0,#ff5a8a);padding:4px 14px;border-radius:12px;border:2px solid #fff}
.rtable{width:min(440px,94vw);max-height:38vh;overflow-y:auto;display:flex;flex-direction:column;gap:3px;background:rgba(255,255,255,.94);border:4px solid #fff;border-radius:18px;padding:6px;pointer-events:auto;touch-action:pan-y}
.rrow{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:10px;font-size:15px}
.rrow b{width:24px;text-align:center;font-family:"Russo One",Nunito,sans-serif;font-weight:400}
.rrow .pc{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #c8d6ea;flex:none}
.rrow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow em{font-style:normal;font-size:13px;color:var(--muted)}
.rrow.me{background:#ffe9d6;box-shadow:inset 0 0 0 2px var(--orange)}

.big-chip{font-size:24px}
